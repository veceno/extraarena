[package]
name = "trainv3_core"
version = "0.1.0"
edition = "2021"
description = "Training-only Rust environment scaffolding for Extra-LR TrainV3"
license = "UNLICENSED"
publish = false

[lib]
name = "trainv3_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
half = "2"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
