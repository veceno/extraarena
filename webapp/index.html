<script>
// Matchmaking (outside React to keep DOM IDs for compatibility)
let matchmakingTimer = null;

window.cancelSearch = function() {
  clearTimeout(matchmakingTimer);
  document.getElementById('searchOverlay').style.display = 'none';
};

// ── Музыка ──────────────────────────────────────────────
let _musicStarted = false;
window._musicEnabled = true;

window.startBgMusic = function() {
  if (_musicStarted || !window._musicEnabled) return;
  const audio = document.getElementById('bg-music');
  if (!audio) return;
  audio.volume = 0.35;
  audio.play().then(() => {
    _musicStarted = true;
  }).catch(() => {
    // Ждём первого взаимодействия
    const tryOnInteraction = () => {
      if (_musicStarted || !window._musicEnabled) return;
      audio.play().then(() => {
        _musicStarted = true;
        ['click','touchstart','keydown'].forEach(e => document.removeEventListener(e, tryOnInteraction));
      }).catch(() => {});
    };
    ['click','touchstart','keydown'].forEach(e => document.addEventListener(e, tryOnInteraction, {once:false}));
  });
};

window.stopBgMusic = function() {
  const audio = document.getElementById('bg-music');
  if (audio) { audio.pause(); audio.currentTime = 0; _musicStarted = false; }
};

window.toggleMusic = function(enabled) {
  window._musicEnabled = enabled;
  if (enabled) window.startBgMusic();
  else window.stopBgMusic();
};
// ────────────────────────────────────────────────────────

// ── Звук кнопок ─────────────────────────────────────────
window._playSfx = function(id) {
  if (!window._musicEnabled) return;
  const el = document.getElementById(id);
  if (!el) return;
  try { el.currentTime = 0; el.volume = 0.55; el.play().catch(() => {}); } catch (e) {}
};
window.playClick = function() {
  window._playSfx('btn-sound');
};
// Глобальный обработчик — звук на каждую кнопку
document.addEventListener('pointerdown', e => {
  if (e.target.closest('button, [role="button"]')) window.playClick();
}, {passive: true});
// ────────────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', () => {
  const cancelBtn = document.getElementById('cancelSearchBtn');
  if (cancelBtn) cancelBtn.onclick = window.cancelSearch;
  window.startBgMusic();
});

window._getUserId = function() {
  const tg = window.Telegram?.WebApp;
  const urlId = new URLSearchParams(location.search).get('user_id');
  return tg?.initDataUnsafe?.user?.id || (urlId ? parseInt(urlId) : null);
};

window.startBattle = async function(profile, deckId, mode) {
  const tg = window.Telegram?.WebApp;
  const overlay = document.getElementById('searchOverlay');
  if (overlay) overlay.style.display = 'flex';

  try {
    document.getElementById('battle-sound')?.play().catch(()=>{});

    const userId = window._getUserId();
    const initData = tg?.initData || '';

    const body = { user_id: userId, trophies: profile?.trophies || 0, init_data: initData, game_mode: mode || 'classic' };
    if (deckId != null) body.selected_deck_id = parseInt(deckId);

    const res = await fetch('/api/match/find', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!res.ok) throw new Error('match find failed');
    const data = await res.json();

    if (data.match_id) {
      window.location.href = `${location.origin}/arena?id=${encodeURIComponent(data.match_id)}&user_id=${encodeURIComponent(userId)}`;
    } else {
      matchmakingTimer = setTimeout(() => window.startBattle(profile, deckId, mode), 3000);
    }
  } catch(e) {
    console.error('Battle search error:', e);
    if (overlay) overlay.style.display = 'none';
  }
};

window.startVsBot = async function(difficulty, profile, deckId) {
  const overlay = document.getElementById('searchOverlay');
  const overlayText = document.querySelector('[data-role="search-overlay-text"]');
  if (overlay) overlay.style.display = 'flex';
  if (overlayText) overlayText.textContent = 'Подготавливаем бой с ботом...';

  try {
    document.getElementById('battle-sound')?.play().catch(()=>{});
    const userId = window._getUserId();

    const body = { user_id: userId, difficulty };
    if (deckId != null) body.deck_id = parseInt(deckId);

    const res = await fetch('/api/match/vs-bot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!res.ok) throw new Error('vs-bot failed');
    const data = await res.json();

    if (data.match_id) {
      window.location.href = `${location.origin}/arena?id=${encodeURIComponent(data.match_id)}&user_id=${encodeURIComponent(userId)}`;
    } else {
      throw new Error(data.error || 'no match_id');
    }
  } catch(e) {
    console.error('VS Bot error:', e);
    if (overlay) overlay.style.display = 'none';
  }
};

window.saveNickname = async function(nick) {
  try {
    const tg = window.Telegram?.WebApp;
    const userId = window._getUserId();
    const initData = tg?.initData || '';
    let url = '/api/change-nickname';
    const params = new URLSearchParams();
    if (initData) params.set('_auth', initData);
    else if (userId) params.set('user_id', String(userId));
    if (params.toString()) url += '?' + params.toString();

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nickname: nick }),
    });
    return await res.json();
  } catch(e) {
    return { success: false, error: e.message };
  }
};

window.loadProfile = async function() {
  try {
    const tg = window.Telegram?.WebApp;
    const urlParams = new URLSearchParams(location.search);
    const urlId = urlParams.get('user_id');
    let url = '/api/profile';
    if (tg?.initData) {
      // Сервер читает initData из query param ?_auth=
      url += '?_auth=' + encodeURIComponent(tg.initData);
    } else if (tg?.initDataUnsafe?.user?.id) {
      url += '?_auth=' + encodeURIComponent(String(tg.initDataUnsafe.user.id));
    } else if (urlId) {
      url += '?user_id=' + encodeURIComponent(urlId);
    }
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.json();
  } catch(e) {
    console.warn('Profile load error:', e);
    return null;
  }
};
</script>

const formatRewardLabel = (reward) => {
  if (reward.type === "coins") return "монет";
  if (reward.type === "gems") return "гемов";
  if (reward.type === "case") {
    const n = {1:"Обычный",2:"Улучшенный",3:"Элитный",4:"Легендарный",5:"Божественный"};
    return `кейс ${reward.divine ? "Божественный" : (n[reward.tier]||"T"+reward.tier)}`;
  }
  if (reward.type === "particles") {
    const r = {rare:"Редкой",superrare:"Сверхредкой",epic:"Эпической",legendary:"Легендарной"};
    return `${reward.amount} част. ${r[reward.rarity]||reward.rarity}`;
  }
  if (reward.type === "shards") return `${reward.amount} оск.`;
  if (reward.type === "guaranteed_card") {
    const r = {rare:"Редкая",epic:"Эпическая",legendary:"Легендарная",mythic:"Мифическая"};
    return `Гар. ${r[reward.rarity]||reward.rarity}`;
  }
  if (reward.type === "cosmetic") return "Косметика";
  return reward.type;
};

// HELPERS
// ═══════════════════════════════════════════
const ADMIN_ID = 6803854304;
const isAdmin  = (profile) => profile?.user_id === ADMIN_ID;

const apiUrl = (path) => {
  const tg = window.Telegram?.WebApp;
  const urlId = new URLSearchParams(location.search).get('user_id');
  const auth = tg?.initData ? encodeURIComponent(tg.initData)
             : tg?.initDataUnsafe?.user?.id ? String(tg.initDataUnsafe.user.id)
             : urlId || '';
  return `${path}?_auth=${auth}`;
};

// ═══════════════════════════════════════════
// PROMO SECTION (в настройках)
// ═══════════════════════════════════════════
const PromoSection = ({profile}) => {
  const admin = isAdmin(profile);
  const promoRef     = React.useRef(null);
  const [promoStatus,setPromoStatus] = React.useState(null); // null|'ok'|'err'|'loading'
  const [promoMsg,   setPromoMsg]    = React.useState('');
  const [promoReward,setPromoReward] = React.useState(null);

  // Admin create form state
  const codeRef  = React.useRef(null);
  const [cType,  setCType]   = React.useState('permanent');
  const [cGems,  setCGems]   = React.useState('');
  const [cCoins, setCCoins]  = React.useState('');
  const [cKeys,  setCKeys]   = React.useState('');
  const [cStatus,setCStatus] = React.useState(null);
  const [cMsg,   setCMsg]    = React.useState('');
  const [codes,  setCodes]   = React.useState([]);
  const [codesLoaded, setCodesLoaded] = React.useState(false);

  const usePromo = async () => {
    const code = promoRef.current?.value?.trim().toUpperCase();
    if (!code) return;
    setPromoStatus('loading'); setPromoMsg(''); setPromoReward(null);
    try {
      const res = await fetch('/api/promocode/use' + apiUrl('').replace('?','&').replace(/^&/,'?'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({code}),
      });
      const d = await res.json();
      if (d.success) {
        setPromoStatus('ok');
        setPromoReward({gems: d.gems||0, coins: d.coins||0, keys: d.keys||0});
        setPromoMsg('Промокод активирован!');
        if (promoRef.current) promoRef.current.value = '';
      } else {
        const msgs = {not_found:'Промокод не найден', expired:'Промокод истёк', already_used:'Уже использован', not_eligible:'Только для новых игроков'};
        setPromoStatus('err'); setPromoMsg(msgs[d.error] || d.message || 'Ошибка');
      }
    } catch(e) { setPromoStatus('err'); setPromoMsg('Ошибка сети'); }
    setTimeout(()=>{setPromoStatus(null);setPromoMsg('');setPromoReward(null);},4000);
  };

  const createPromo = async () => {
    const code = codeRef.current?.value?.trim().toUpperCase();
    if (!code) return;
    setCStatus('loading'); setCMsg('');
    try {
      const res = await fetch(apiUrl('/api/admin/promocodes/create'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({code, type:cType, reward_gems:+cGems||0, reward_coins:+cCoins||0, reward_keys:+cKeys||0}),
      });
      const d = await res.json();
      if (d.success) { setCStatus('ok'); setCMsg('Промокод создан: '+code); if(codeRef.current) codeRef.current.value=''; loadCodes(); }
      else { setCStatus('err'); setCMsg(d.message || d.error || 'Ошибка'); }
    } catch(e) { setCStatus('err'); setCMsg('Ошибка сети'); }
    setTimeout(()=>{setCStatus(null);setCMsg('');},4000);
  };

  const loadCodes = React.useCallback(async () => {
    if (!admin) return;
    try {
      const res = await fetch(apiUrl('/api/admin/promocodes/list'));
      const d = await res.json();
      setCodes(d.promocodes || []);
      setCodesLoaded(true);
    } catch(e){}
  }, [admin]);

  React.useEffect(()=>{ if (admin) loadCodes(); }, [admin, loadCodes]);

  const T2 = T; // alias
  return (
    <div style={{marginTop:'4px'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:'8px',margin:'14px 0 8px'}}>
        <span style={{fontSize:'17px'}}>🎟️</span>
        <span style={{fontSize:'15px',fontWeight:'700',color:T2.white,fontFamily:"'Exo 2',sans-serif"}}>Промокоды</span>
        {admin && <span style={{fontSize:'10px',color:T2.orange,background:'rgba(245,146,30,0.12)',borderRadius:'5px',padding:'1px 6px',fontWeight:'600'}}>ADMIN</span>}
      </div>

      {/* Use promo */}
      <div style={{background:T2.bgCard,borderRadius:'12px',padding:'12px 14px',border:`1px solid ${T2.purple1}`,marginBottom:'6px'}}>
        <div style={{fontSize:'11px',color:T2.grey3,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'8px'}}>Ввести промокод</div>
        <div style={{display:'flex',gap:'8px'}}>
          <input ref={promoRef} placeholder="EXTRAARENA2025" maxLength={32}
            style={{flex:1,background:T2.bgDeep,border:`1px solid ${promoStatus==='err'?'#f87171':promoStatus==='ok'?'#4ade80':T2.purple2}`,borderRadius:'9px',padding:'8px 11px',color:T2.white,fontSize:'12px',fontFamily:"'Inter',sans-serif",outline:'none',textTransform:'uppercase'}}/>
          <button onClick={usePromo} style={{height:'36px',padding:'0 14px',borderRadius:'9px',background:T2.purple2,border:`1px solid ${T2.purple3}`,color:T2.white,fontSize:'12px',fontWeight:'700',cursor:'pointer',fontFamily:"'Exo 2',sans-serif",flexShrink:0}}>
            {promoStatus==='loading'?'...':'Применить'}
          </button>
        </div>
        {promoMsg && <div style={{fontSize:'11px',color:promoStatus==='ok'?'#4ade80':'#f87171',marginTop:'6px'}}>{promoMsg}</div>}
        {promoReward && (promoReward.gems>0||promoReward.coins>0||promoReward.keys>0) && (
          <div style={{display:'flex',gap:'6px',marginTop:'6px',flexWrap:'wrap'}}>
            {promoReward.gems  >0 && <span style={{fontSize:'11px',color:'#c4b5fd',background:'rgba(167,139,250,0.12)',borderRadius:'6px',padding:'2px 8px'}}>+{promoReward.gems} 💎</span>}
            {promoReward.coins >0 && <span style={{fontSize:'11px',color:T2.orange,background:`${T2.orange}12`,borderRadius:'6px',padding:'2px 8px'}}>+{promoReward.coins} 🪙</span>}
            {promoReward.keys  >0 && <span style={{fontSize:'11px',color:'#fbbf24',background:'rgba(251,191,36,0.12)',borderRadius:'6px',padding:'2px 8px'}}>+{promoReward.keys} 🗝️</span>}
          </div>
        )}
      </div>

      {/* Admin: create promo */}
      {admin && <>
        <div style={{background:T2.bgCard,borderRadius:'12px',padding:'13px 14px',border:`1px solid ${T2.orange}30`,marginBottom:'6px'}}>
          <div style={{fontSize:'11px',color:T2.orange,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'10px',fontWeight:'700'}}>⚙️ Создать промокод</div>
          <input ref={codeRef} placeholder="КОД (латиница, caps)" maxLength={32}
            style={{width:'100%',background:T2.bgDeep,border:`1px solid ${T2.purple2}`,borderRadius:'9px',padding:'8px 11px',color:T2.white,fontSize:'12px',marginBottom:'8px',fontFamily:"'Inter',sans-serif",outline:'none',textTransform:'uppercase',boxSizing:'border-box'}}/>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'6px',marginBottom:'8px'}}>
            {[['cGems','💎 Гемы',cGems,setCGems],['cCoins','🪙 Монеты',cCoins,setCCoins],['cKeys','🗝️ Ключи',cKeys,setCKeys]].map(([id,pl,val,set])=>(
              <input key={id} value={val} onChange={e=>set(e.target.value.replace(/\D/g,''))} placeholder={pl} inputMode="numeric"
                style={{background:T2.bgDeep,border:`1px solid ${T2.purple2}`,borderRadius:'9px',padding:'7px 9px',color:T2.white,fontSize:'11px',fontFamily:"'Inter',sans-serif",outline:'none',textAlign:'center',width:'100%',boxSizing:'border-box'}}/>
            ))}
          </div>
          <div style={{display:'flex',gap:'5px',marginBottom:'10px'}}>
            {['permanent','personal','welcome'].map(t=>(
              <button key={t} onClick={()=>setCType(t)} style={{flex:1,padding:'5px 4px',borderRadius:'8px',background:cType===t?T2.purple2:T2.bgDeep,border:`1px solid ${cType===t?T2.purpleHL:T2.purple1}`,color:cType===t?T2.white:T2.grey3,fontSize:'10px',fontWeight:cType===t?'700':'400',cursor:'pointer',fontFamily:"'Exo 2',sans-serif"}}>
                {t==='permanent'?'Общий':t==='personal'?'Личный':'Новичку'}
              </button>
            ))}
          </div>
          <button onClick={createPromo} style={{width:'100%',height:'38px',background:`linear-gradient(135deg,${T2.orange},${T2.orangeD})`,border:'none',borderRadius:'10px',color:'white',fontSize:'13px',fontWeight:'800',cursor:'pointer',fontFamily:"'Exo 2',sans-serif"}}>
            Создать
          </button>
          {cMsg && <div style={{fontSize:'11px',color:cStatus==='ok'?'#4ade80':'#f87171',marginTop:'6px'}}>{cMsg}</div>}
        </div>

        {/* Admin: promo list */}
        {codesLoaded && codes.length > 0 && (
          <div style={{background:T2.bgCard,borderRadius:'12px',padding:'12px 14px',border:`1px solid ${T2.purple1}`}}>
            <div style={{fontSize:'11px',color:T2.grey3,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'8px',display:'flex',justifyContent:'space-between'}}>
              <span>Созданные коды</span>
              <button onClick={loadCodes} style={{background:'none',border:'none',color:T2.purpleLt,fontSize:'11px',cursor:'pointer'}}>Обновить</button>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:'5px',maxHeight:'160px',overflowY:'auto'}}>
              {codes.map(c=>(
                <div key={c.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 8px',background:T2.bgDeep,borderRadius:'8px',border:`1px solid ${T2.purple1}`}}>
                  <span style={{fontSize:'12px',fontWeight:'700',color:T2.white,fontFamily:"'Exo 2',sans-serif",letterSpacing:'0.5px'}}>{c.code}</span>
                  <div style={{display:'flex',gap:'4px',fontSize:'11px',color:T2.grey2}}>
                    {c.reward_gems>0 && <span>{c.reward_gems}💎</span>}
                    {c.reward_coins>0 && <span>{c.reward_coins}🪙</span>}
                    {c.reward_keys>0 && <span>{c.reward_keys}🗝️</span>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </>}
    </div>
  );
};

const ShopScreen = ({profile, onKeysUpdated}) => {
  const admin = isAdmin(profile);
  const [debugLoading, setDebugLoading] = React.useState(false);
  const [debugMsg,     setDebugMsg]     = React.useState('');

  const addKey = async () => {
    setDebugLoading(true); setDebugMsg('');
    try {
      const res = await fetch(apiUrl('/api/debug/add-key'), {method:'POST', headers:{'Content-Type':'application/json'}});
      const d = await res.json();
      if (d.success) { setDebugMsg(`✅ Ключ добавлен! Всего: ${d.keys}`); onKeysUpdated?.(d.keys); }
      else setDebugMsg('❌ ' + (d.error || 'Ошибка'));
    } catch(e) { setDebugMsg('❌ Сетевая ошибка'); }
    setDebugLoading(false);
    setTimeout(()=>setDebugMsg(''),3000);
  };

  return (
    <div style={{flex:1,overflowY:'auto',padding:'16px'}}>
      <div style={{fontSize:'20px',fontWeight:'900',color:T.white,fontFamily:"'Exo 2',sans-serif",marginBottom:'16px'}}>Магазин</div>

      {/* Placeholder items */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px',marginBottom:'20px'}}>
        {[{icon:'💎',name:'100 гемов',price:'49 ⭐',color:'#a78bfa'},{icon:'🪙',name:'500 монет',price:'29 ⭐',color:T.orange},{icon:'🗝️',name:'3 ключа',price:'99 ⭐',color:'#fbbf24'},{icon:'⚡',name:'ExtraPass',price:'199 ⭐',color:T.purpleLt}].map((item,i)=>(
          <div key={i} style={{background:T.bgCard,border:`1px solid ${T.purple1}`,borderRadius:'16px',padding:'16px 14px',textAlign:'center'}}>
            <div style={{fontSize:'32px',marginBottom:'8px'}}>{item.icon}</div>
            <div style={{fontSize:'13px',fontWeight:'700',color:T.white,fontFamily:"'Exo 2',sans-serif",marginBottom:'4px'}}>{item.name}</div>
            <button style={{background:T.purple2,border:`1px solid ${T.purple3}`,borderRadius:'8px',padding:'5px 12px',color:item.color,fontSize:'12px',fontWeight:'700',cursor:'pointer',fontFamily:"'Exo 2',sans-serif"}}>{item.price}</button>
          </div>
        ))}
      </div>

      {/* Admin debug */}
      {admin && (
        <div style={{background:`rgba(245,146,30,0.08)`,border:`1.5px dashed ${T.orange}60`,borderRadius:'16px',padding:'14px'}}>
          <div style={{fontSize:'12px',fontWeight:'700',color:T.orange,marginBottom:'10px',fontFamily:"'Exo 2',sans-serif"}}>🛠️ Отладка (только для вас)</div>
          <button onClick={addKey} disabled={debugLoading} style={{width:'100%',height:'44px',background:`linear-gradient(135deg,${T.orange},${T.orangeD})`,border:'none',borderRadius:'12px',color:'white',fontSize:'14px',fontWeight:'800',fontFamily:"'Exo 2',sans-serif",cursor:'pointer',opacity:debugLoading?0.7:1}}>
            {debugLoading ? 'Добавляем...' : '🗝️ + 1 ключ (дебаг)'}
          </button>
          {debugMsg && <div style={{fontSize:'12px',color:T.grey1,marginTop:'8px',textAlign:'center'}}>{debugMsg}</div>}
        </div>
      )}
    </div>
  );
};

// CASE OPEN SCREEN
// ═══════════════════════════════════════════
const TIER_COLORS = ['','#6ee7b7','#60a5fa','#a78bfa','#f59e0b','#f43f5e'];
const TIER_NAMES  = ['','T1','T2','T3','T4','T5'];
const RARITY_COLORS = {common:'#9ca3af',rare:'#60a5fa',superrare:'#a78bfa',epic:'#f59e0b',legendary:'#f97316',mythic:'#ec4899',divine:'#fcd34d',limited:'#f43f5e',start:T.ai};
const RARITY_LABELS = {common:'Обычная',rare:'Редкая',superrare:'Суперредкая',epic:'Эпическая',legendary:'Легендарная',mythic:'Мифическая',divine:'Божественная',limited:'Лимит.',start:'Стартовая'};

const CaseOpenScreen = ({onClose, onDone, profile}) => {
  const [phase,    setPhase]    = React.useState('intro');   // intro|tapping|opening|reveal
  const [tapN,     setTapN]     = React.useState(0);         // 0-4
  const [tierSeq,  setTierSeq]  = React.useState([1,1,1,1]); // cosmetic tiers per tap
  const [upgraded, setUpgraded] = React.useState(false);
  const [result,   setResult]   = React.useState(null);
  const [skipping, setSkipping] = React.useState(false);

  // Cosmetic tier sequence for animation (independent of server result)
  const fakeRollTier = (cur) => Math.random() < 0.28 ? Math.min(cur+1,5) : cur;

  const doTap = () => {
    if (tapN >= 4 || phase !== 'tapping') return;
    window._playSfx('case-tap-sound');
    const prevTier = tapN === 0 ? 1 : tierSeq[tapN-1];
    const newTier  = fakeRollTier(prevTier);
    const wasUpgraded = newTier > prevTier;
    const newSeq = [...tierSeq]; newSeq[tapN] = newTier;
    setTierSeq(newSeq);
    setUpgraded(wasUpgraded);
    if (wasUpgraded) setTimeout(()=>setUpgraded(false), 600);
    const nextTap = tapN + 1;
    setTapN(nextTap);
    if (nextTap >= 4) { setTimeout(()=>openCase(), 600); }
  };

  const openCase = async () => {
    window._playSfx('case-open-sound');
    setPhase('opening');
    try {
      const res = await fetch(apiUrl('/api/cases/open-from-keys'), {method:'POST', headers:{'Content-Type':'application/json'}});
      const d = await res.json();
      if (d.success) { setResult(d); setPhase('reveal'); setTimeout(()=>window._playSfx('case-reward-sound'), 300); }
      else { setPhase('error'); setResult(d); }
    } catch(e) { setPhase('error'); setResult({error: 'Ошибка сети'}); }
  };

  const skip = async () => {
    if (skipping) return;
    setSkipping(true);
    const fSeq = [1,1,1,1];
    let cur=1;
    for(let i=0;i<4;i++){cur=fakeRollTier(cur);fSeq[i]=cur;}
    setTierSeq(fSeq); setTapN(4);
    await openCase();
  };

  const curTier  = tapN === 0 ? 1 : tierSeq[tapN-1];
  const tierColor = TIER_COLORS[curTier] || TIER_COLORS[1];

  return (
    <div style={{position:'absolute',inset:0,background:'rgba(5,2,12,0.97)',zIndex:50,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-start',overflow:'hidden',animation:'fadeIn 0.2s'}}>
      {/* Close/Skip */}
      <div style={{width:'100%',display:'flex',justifyContent:'space-between',padding:'14px 18px 0',flexShrink:0}}>
        <button onClick={onClose} style={{background:'none',border:`1px solid ${T.grey3}`,borderRadius:'10px',padding:'6px 12px',color:T.grey2,fontSize:'12px',cursor:'pointer',fontFamily:"'Inter',sans-serif"}}>✕ Закрыть</button>
        {phase==='tapping' && !skipping && (
          <button onClick={skip} style={{background:'none',border:`1px solid ${T.grey3}`,borderRadius:'10px',padding:'6px 12px',color:T.grey2,fontSize:'12px',cursor:'pointer',fontFamily:"'Inter',sans-serif"}}>Пропустить ⏩</button>
        )}
      </div>

      {/* INTRO */}
      {phase==='intro' && (
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px',textAlign:'center'}}>
          <div style={{fontSize:'80px',marginBottom:'20px',animation:'pulse2 2s ease-in-out infinite',filter:`drop-shadow(0 0 30px ${T.orange}66)`}}>📦</div>
          <div style={{fontSize:'22px',fontWeight:'900',color:T.white,fontFamily:"'Exo 2',sans-serif",marginBottom:'8px'}}>Открытие кейса</div>
          <div style={{fontSize:'13px',color:T.grey1,marginBottom:'32px',lineHeight:1.5}}>4 тапа — и узнаешь,<br/>что внутри</div>
          <button onClick={()=>setPhase('tapping')} style={{width:'220px',height:'56px',background:`linear-gradient(135deg,${T.orange},${T.orangeD})`,border:'none',borderRadius:'18px',color:'white',fontSize:'18px',fontWeight:'900',fontFamily:"'Exo 2',sans-serif",cursor:'pointer',boxShadow:`0 8px 28px ${T.orange}55`,letterSpacing:'1px'}}>Начать</button>
        </div>
      )}

      {/* TAPPING */}
      {phase==='tapping' && (
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'space-between',padding:'16px 24px 32px',width:'100%'}}>
          <div style={{textAlign:'center',marginTop:'8px'}}>
            <div style={{fontSize:'13px',color:T.grey2,marginBottom:'4px'}}>Тап {tapN} / 4</div>
            <div style={{display:'flex',gap:'8px',justifyContent:'center',marginBottom:'10px'}}>
              {[0,1,2,3].map(i=>(
                <div key={i} style={{width:'28px',height:'6px',borderRadius:'3px',background:i<tapN?(TIER_COLORS[tierSeq[i]]||T.purpleLt):T.purple1,transition:'background 0.3s'}}/>
              ))}
            </div>
            {tapN>0 && (
              <div style={{display:'inline-flex',alignItems:'center',gap:'6px',background:`${tierColor}20`,border:`1px solid ${tierColor}80`,borderRadius:'10px',padding:'4px 14px',animation:upgraded?'popIn 0.4s':'none'}}>
                <span style={{fontSize:'13px',fontWeight:'700',color:tierColor,fontFamily:"'Exo 2',sans-serif"}}>{TIER_NAMES[curTier]}</span>
                {upgraded && <span style={{fontSize:'11px',color:tierColor}}>↑ Апгрейд!</span>}
              </div>
            )}
          </div>

          {/* Big chest */}
          <button onClick={doTap} style={{background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'8px',padding:'0',WebkitTapHighlightColor:'transparent'}}>
            <div style={{fontSize:'100px',lineHeight:1,filter:`drop-shadow(0 0 ${tapN>0?40:20}px ${tierColor}88)`,transition:'filter 0.3s',transform:tapN>0?'scale(1.05)':'scale(1)',animation:'pulse2 1.8s ease-in-out infinite'}}>📦</div>
            <div style={{fontSize:'13px',color:T.grey1,marginTop:'4px'}}>Нажми, чтобы открыть</div>
          </button>

          <div style={{width:'100%',textAlign:'center'}}>
            <div style={{fontSize:'24px',fontWeight:'900',color:tierColor,fontFamily:"'Exo 2',sans-serif",marginBottom:'4px',transition:'color 0.3s'}}>{TIER_NAMES[curTier] || 'T1'}</div>
            <div style={{fontSize:'11px',color:T.grey3}}>Текущий тир кейса</div>
          </div>
        </div>
      )}

      {/* OPENING */}
      {phase==='opening' && (
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'18px'}}>
          <div style={{width:'48px',height:'48px',border:`3px solid ${T.purple2}`,borderTopColor:T.purpleLt,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
          <div style={{fontSize:'16px',color:T.grey1,fontWeight:'600',fontFamily:"'Exo 2',sans-serif"}}>Открываем...</div>
        </div>
      )}

      {/* REVEAL */}
      {phase==='reveal' && result && (
        <div style={{flex:1,overflowY:'auto',width:'100%',padding:'16px 18px 32px'}}>
          {/* Tier badge */}
          <div style={{textAlign:'center',marginBottom:'16px'}}>
            <div style={{display:'inline-flex',alignItems:'center',gap:'8px',background:`${TIER_COLORS[result.final_tier]||T.purpleLt}20`,border:`1px solid ${TIER_COLORS[result.final_tier]||T.purpleLt}`,borderRadius:'12px',padding:'6px 18px'}}>
              <span style={{fontSize:'14px',fontWeight:'900',color:TIER_COLORS[result.final_tier]||T.purpleLt,fontFamily:"'Exo 2',sans-serif"}}>{TIER_NAMES[result.final_tier]} — открыт!</span>
            </div>
          </div>

          {/* Coins row */}
          {result.rewards?.coins > 0 && (
            <div style={{background:`${T.orange}12`,border:`1px solid ${T.orange}40`,borderRadius:'14px',padding:'12px 16px',marginBottom:'10px',display:'flex',alignItems:'center',gap:'12px',animation:'popIn 0.3s'}}>
              <span style={{fontSize:'28px'}}>🪙</span>
              <div>
                <div style={{fontSize:'18px',fontWeight:'900',color:T.orange,fontFamily:"'Exo 2',sans-serif"}}>+{result.rewards.coins} монет</div>
                <div style={{fontSize:'11px',color:T.grey2}}>Добавлено в кошелёк</div>
              </div>
            </div>
          )}

          {/* Cards */}
          {(result.rewards?.cards||[]).map((c,i)=>(
            <div key={i} style={{background:`${RARITY_COLORS[c.rarity]||T.purpleLt}12`,border:`1px solid ${RARITY_COLORS[c.rarity]||T.purpleLt}40`,borderRadius:'14px',padding:'12px 16px',marginBottom:'8px',display:'flex',alignItems:'center',gap:'12px',animation:`popIn 0.3s ${i*0.08}s both`}}>
              <div style={{width:'44px',height:'44px',borderRadius:'10px',background:`${RARITY_COLORS[c.rarity]||T.purpleLt}20`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px',flexShrink:0}}>🃏</div>
              <div>
                <div style={{fontSize:'14px',fontWeight:'700',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>{c.card_name || 'Карта'}</div>
                <div style={{display:'flex',alignItems:'center',gap:'6px',marginTop:'2px'}}>
                  <span style={{fontSize:'10px',color:RARITY_COLORS[c.rarity]||T.purpleLt,background:`${RARITY_COLORS[c.rarity]||T.purpleLt}18`,borderRadius:'5px',padding:'1px 6px',fontWeight:'600'}}>{RARITY_LABELS[c.rarity]||c.rarity}</span>
                  <span style={{fontSize:'10px',color:'#4ade80'}}>✦ Новая!</span>
                </div>
              </div>
            </div>
          ))}

          {/* Particles */}
          {(result.rewards?.particles||[]).map((p,i)=>(
            <div key={i} style={{background:`${RARITY_COLORS[p.rarity]||T.purpleLt}10`,border:`1px solid ${RARITY_COLORS[p.rarity]||T.purpleLt}30`,borderRadius:'14px',padding:'10px 14px',marginBottom:'8px',display:'flex',alignItems:'center',gap:'12px',animation:`popIn 0.3s ${i*0.08}s both`}}>
              <div style={{width:'40px',height:'40px',borderRadius:'10px',background:`${RARITY_COLORS[p.rarity]||T.purpleLt}15`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px',flexShrink:0}}>✨</div>
              <div style={{flex:1}}>
                <div style={{fontSize:'12px',fontWeight:'600',color:T.grey1,fontFamily:"'Exo 2',sans-serif"}}>{p.card_name}</div>
                <div style={{fontSize:'11px',color:T.grey3}}>Уже есть → +{p.particles} частиц</div>
              </div>
            </div>
          ))}

          {result.rewards?.gems > 0 && (
            <div style={{background:'rgba(167,139,250,0.1)',border:'1px solid rgba(167,139,250,0.4)',borderRadius:'14px',padding:'12px 16px',marginBottom:'10px',display:'flex',alignItems:'center',gap:'12px',animation:'popIn 0.3s'}}>
              <span style={{fontSize:'28px'}}>💎</span>
              <div>
                <div style={{fontSize:'18px',fontWeight:'900',color:'#c4b5fd',fontFamily:"'Exo 2',sans-serif"}}>+{result.rewards.gems} гемов</div>
              </div>
            </div>
          )}

          {result.rewards?.jackpot && (
            <div style={{textAlign:'center',padding:'10px',marginBottom:'8px',color:'#fbbf24',fontSize:'14px',fontWeight:'700',animation:'pulse2 1.5s ease-in-out infinite'}}>⚡ ДЖЕКПОТ!</div>
          )}

          {/* Actions */}
          <div style={{display:'flex',gap:'10px',marginTop:'16px'}}>
            {(result.remaining_keys||0) > 0 ? (
              <button onClick={()=>{setPhase('intro');setTapN(0);setTierSeq([1,1,1,1]);setResult(null);setSkipping(false);}}
                style={{flex:1,height:'50px',background:`linear-gradient(135deg,${T.orange},${T.orangeD})`,border:'none',borderRadius:'14px',color:'white',fontSize:'15px',fontWeight:'900',fontFamily:"'Exo 2',sans-serif",cursor:'pointer',boxShadow:`0 5px 18px ${T.orange}44`}}>
                Открыть ещё ({result.remaining_keys} 🗝️)
              </button>
            ) : (
              <div style={{flex:1,textAlign:'center',padding:'12px',color:T.grey3,fontSize:'12px'}}>Ключей больше нет</div>
            )}
            <button onClick={()=>{onDone?.(result);onClose();}} style={{height:'50px',padding:'0 20px',background:T.bgCard,border:`1px solid ${T.purple2}`,borderRadius:'14px',color:T.grey1,fontSize:'14px',fontWeight:'700',fontFamily:"'Exo 2',sans-serif",cursor:'pointer'}}>Забрать</button>
          </div>
        </div>
      )}

      {phase==='error' && (

    </div>
  );
};

        const list = d.presets || [];

const RARITY_COLOR = {
  common:    '#94a3b8',
  rare:      '#60a5fa',
  superrare: '#2dd4bf',
  epic:      '#a78bfa',
  legendary: '#fbbf24',
  mythic:    '#f472b6',
  divine:    '#e0e7ff',
  limited:   '#f87171',
  unique:    '#c084fc',
  start:     '#94a3b8',
};
const RARITY_LABEL = {
  common:    'Обычная',  rare:      'Редкая',
  superrare: 'С.Редкая', epic:      'Эпик',
  legendary: 'Легенда',  mythic:    'Мифик',
  divine:    'Дивайн',   limited:   'Лимитед',
  unique:    'Уникум',   start:     'Базовая',
};
const RARITY_ORDER = ['divine','limited','mythic','legendary','epic','superrare','unique','rare','common','start'];

const _buildAuthUrl = (path) => {
  const tg = window.Telegram?.WebApp;
  const uid = window._getUserId?.();
  const p = new URLSearchParams();
  if (tg?.initData) p.set('_auth', tg.initData);
  else if (uid) p.set('user_id', String(uid));
  const q = p.toString();
  return q ? `${path}?${q}` : path;
};

// ─── Upgrade cost helpers (mirrors database.py / main.js formulas) ───────────
const _UP_PARTICLES = {1:5,2:10,3:20,4:40,5:80,6:160,7:320,8:640,9:2500};
const _UP_COINS     = {1:50,2:150,3:400,4:900,5:2000,6:4500,7:8000,8:13000,9:40000};
const _RARITY_PM = {common:1.0,rare:1.3,start:1.4,superrare:1.6,epic:2.0,legendary:3.0,mythic:4.0,divine:5.0,limited:6.0};
const _RARITY_CM = {common:1.0,rare:1.2,start:1.3,superrare:1.5,epic:2.0,legendary:3.0,mythic:4.0,divine:5.0,limited:6.0};
const calcUpgradeParticles = (rarity, level) =>
  Math.ceil((_UP_PARTICLES[level] || 5)  * (_RARITY_PM[rarity] || 1.0));
const calcUpgradeCoins = (rarity, level) =>
  Math.ceil((_UP_COINS[level]     || 50) * (_RARITY_CM[rarity] || 1.0));

const CardDetailScreen = ({card, onBack, onCardUpgraded}) => {
  const [imgErr,    setImgErr]    = React.useState(false);
  const [localCard, setLocalCard] = React.useState(card);
  const [upgrading, setUpgrading] = React.useState(false);
  const [upgrErr,   setUpgrErr]   = React.useState('');

  const rc       = RARITY_COLOR[localCard.rarity] || '#94a3b8';
  const mechanics = (() => { try { return Array.isArray(localCard.mechanics) ? localCard.mechanics : JSON.parse(localCard.mechanics||'[]'); } catch { return []; } })();
  const level    = localCard.level || 1;
  const isMax    = level >= 10;
  const pHave    = localCard.particles || 0;
  const pNeeded  = isMax ? calcUpgradeParticles(localCard.rarity, 9) : calcUpgradeParticles(localCard.rarity, level);
  const cNeeded  = isMax ? 0 : calcUpgradeCoins(localCard.rarity, level);
  const upgPct   = Math.min(pHave / (pNeeded || 1) * 100, 100);
  const canUp    = !isMax && pHave >= pNeeded;

  // Preview: what stats gain at next level (warriors only, mirrors scale_card_by_level logic)
  const isWarrior = localCard.card_type === 'warrior';
  const nextLevel = Math.min(level + 1, 10);
  const nextAtkBonus = isWarrior ? (Math.floor(nextLevel / 2) - Math.floor(level / 2)) : 0;
  const nextHpBonus  = isWarrior ? (Math.floor((nextLevel - 1) / 2) - Math.floor((level - 1) / 2)) : 0;

  const doUpgrade = async () => {
    if (!canUp || upgrading) return;
    setUpgrading(true);
    setUpgrErr('');
    try {
      const res = await fetch(_buildAuthUrl('/api/cards/upgrade'), {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({card_id: localCard.id}),
      });
      const data = await res.json();
      if (!res.ok || data.error) {
        setUpgrErr(data.error || 'Ошибка апгрейда');
      } else {
        // Merge server response into local card state
        setLocalCard(prev => ({
          ...prev,
          level: data.new_level ?? prev.level,
          particles: (prev.particles || 0) - (data.particles_spent || 0),
          current_attack: data.new_attack ?? prev.current_attack,
          current_hp:     data.new_hp    ?? prev.current_hp,
          power: data.new_power ?? prev.power,

              ? <img src={`/api/cards/image?card_id=${localCard.id}`} alt={localCard.name} onError={()=>setImgErr(true)} style={{width:'100%',height:'100%',objectFit:'contain',padding:'8px'}}/>

const CardPickerSheet = ({allCards, deckCardIds, onPick, onClose, heroOnly}) => {
  const [search, setSearch] = React.useState('');
  const [sort, setSort] = React.useState('rarity');
  const cards = heroOnly ? allCards.filter(c => c.card_type === 'hero') : allCards;
  const available = cards.filter(c => !deckCardIds.includes(c.id));
  const filtered = React.useMemo(() => {
    let arr = search ? available.filter(c => c.name.toLowerCase().includes(search.toLowerCase())) : [...available];
    if (sort==='rarity') arr.sort((a,b) => RARITY_ORDER.indexOf(a.rarity) - RARITY_ORDER.indexOf(b.rarity));
    else if (sort==='level') arr.sort((a,b) => (b.level||1) - (a.level||1));
    else if (sort==='power') arr.sort((a,b) => (b.power||0) - (a.power||0));
    else if (sort==='mana') arr.sort((a,b) => (a.mana_cost||0) - (b.mana_cost||0));
    else if (sort==='name') arr.sort((a,b) => (a.name||'').localeCompare(b.name||''));
    return arr;
  }, [available, search, sort]);
  const SORTS = [{id:'rarity',label:'Редк.'},{id:'level',label:'Уров.'},{id:'power',label:'Сила'},{id:'mana',label:'Мана'},{id:'name',label:'Имя'}];
  return (
    <div style={{position:'absolute',inset:0,background:'rgba(5,3,14,0.82)',backdropFilter:'blur(10px)',zIndex:40,display:'flex',flexDirection:'column',justifyContent:'flex-end'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} className="safe-pad-bottom"
        style={{background:'linear-gradient(180deg,#1c1340 0%,#130d26 100%)',borderRadius:'22px 22px 0 0',padding:'14px 16px 0',border:`1px solid ${T.purple1}`,borderBottom:'none',boxShadow:'0 -20px 60px rgba(0,0,0,0.7)',animation:'slideUp 0.26s cubic-bezier(0.32,0.72,0,1)',maxHeight:'80vh',display:'flex',flexDirection:'column'}}>
        <div style={{width:'36px',height:'4px',borderRadius:'2px',background:T.purple2,margin:'0 auto 12px'}}/>
        <div style={{fontSize:'15px',fontWeight:'800',color:T.white,fontFamily:"'Exo 2',sans-serif",marginBottom:'10px'}}>{heroOnly ? 'Выбери героя' : 'Выбери карту'}</div>
        <div style={{background:T.bgDeep,border:`1px solid ${T.purple2}`,borderRadius:'10px',padding:'7px 12px',display:'flex',gap:'8px',alignItems:'center',marginBottom:'8px',flexShrink:0}}>
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="5.5" cy="5.5" r="3.5" stroke={T.grey3} strokeWidth="1.3"/><path d="M9 9l2 2" stroke={T.grey3} strokeWidth="1.3" strokeLinecap="round"/></svg>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Поиск..." autoFocus
            style={{flex:1,background:'none',border:'none',color:T.white,fontSize:'13px',fontFamily:"'Inter',sans-serif",outline:'none'}}/>
          {search && <button onClick={()=>setSearch('')} style={{background:'none',border:'none',cursor:'pointer',color:T.grey3,fontSize:'14px',padding:'0',lineHeight:1}}>✕</button>}
        </div>
        {!heroOnly && <div style={{display:'flex',gap:'5px',overflowX:'auto',paddingBottom:'6px',flexShrink:0,scrollbarWidth:'none'}}>
          {SORTS.map(s=><button key={s.id} onClick={()=>setSort(s.id)} style={{padding:'5px 10px',borderRadius:'14px',background:sort===s.id?T.orange:T.bgCard,border:`1px solid ${sort===s.id?T.orange:T.purple1}`,color:sort===s.id?'white':T.grey2,fontSize:'10px',fontWeight:'600',cursor:'pointer',whiteSpace:'nowrap',fontFamily:"'Exo 2',sans-serif",flexShrink:0}}>{s.label}</button>)}
        </div>}
        <div style={{flex:1,overflowY:'auto',paddingBottom:'20px'}}>
          {filtered.length === 0
            ? <div style={{textAlign:'center',padding:'32px 0',color:T.grey3,fontSize:'13px'}}>{available.length===0 ? (heroOnly?'Все герои уже в колоде':'Все карты уже в колоде') : 'Нет результатов'}</div>
            : <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px'}}>{filtered.map(card => <CardTile key={card.id} card={card} onClick={()=>onPick(card.id)}/>)}</div>
          }
        </div>
      </div>
    </div>
  );
};

  const avgMana = nonHero.length ? (nonHero.reduce((s,c) => s + (c.mana_cost||0), 0) / nonHero.length).toFixed(1) : '—';
  const aggressiveness = nonHero.length ? ((nonHero.reduce((s,c) => s + (c.current_attack||c.base_attack||0) + (c.current_hp||c.base_hp||0), 0) / nonHero.length) / 2).toFixed(1) : '—';

          <DeckSlotCard cardId={heroId} allCards={allCards} isHero={true}
            onRemove={() => editing.onSlotChange(0, null)}

            <div style={{display:'flex',gap:'4px'}}>
              <button onClick={editing.onRandomFill} title="Случайная колода"

                style={{width:'26px',height:'26px',borderRadius:'7px',background:T.bgCard,border:`1px solid ${T.purple2}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'not-allowed',fontSize:'12px',padding:0,opacity:0.4}}>🤖</button>

            <span style={{fontSize:'10px',color:T.grey3}}>Механик</span>
            <span style={{fontSize:'14px',fontWeight:'900',color:'#c084fc',fontFamily:"'Exo 2',sans-serif"}}>{mechCount}</span>
          </div>
        </div>

        {/* Share */}
        <button onClick={()=>{navigator.clipboard?.writeText(`extraarena://deck/${editing.preset_number}`).catch(()=>{}); setShareMsg(true); setTimeout(()=>setShareMsg(false),2000);}}
          style={{width:'100%',padding:'9px',background:'transparent',border:`1px solid ${T.purple1}`,borderRadius:'11px',color:shareMsg?'#4ade80':T.grey2,fontSize:'11px',fontWeight:'500',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',gap:'6px'}}>
          <span style={{fontSize:'12px'}}>📋</span>

      )}
    </div>
  );
};

const DecksTab = ({presets, allCards, onReload, profile}) => {
  const [editing, setEditing] = React.useState(null);
  const [saving, setSaving]   = React.useState(false);
  const [saveMsg, setSaveMsg] = React.useState(null);
  const hasPass = profile?.extra_pass === 'active';
  const MAX_PRESETS = 5;
  const FREE_LIMIT = 3;
  const presetSlots = Array.from({length:MAX_PRESETS}, (_,i) => i+1).map(n => presets.find(p => p.preset_number===n) || {id:null, preset_number:n, preset_name:`Колода ${n}`, card_ids:[], is_primary:false});

  const savePreset = async () => {
    if (!editing || saving) return;
    const heroFilled = !!editing.slots[0];
    const filled = editing.slots.filter(Boolean).length;
    const totalCards = allCards.length;
    if (!heroFilled) { setSaveMsg('no_hero'); setTimeout(()=>setSaveMsg(null),2500); return; }
    if (totalCards >= 9 && filled < 9) { setSaveMsg('incomplete'); setTimeout(()=>setSaveMsg(null),2500); return; }
    setSaving(true);
    try {
      const slots = Array.from({length:9}, (_,i) => editing.slots[i] || null);
      const res = await fetch(_buildAuthUrl('/api/deck/presets/save'), {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({preset_number: editing.preset_number, preset_name: editing.preset_name, card_slots: slots}),
      });
      if (!res.ok) throw new Error('save failed');
      setSaveMsg('ok');
      await onReload();
      setTimeout(() => { setSaveMsg(null); setEditing(null); }, 700);
    } catch(e) { setSaveMsg('err'); setTimeout(() => setSaveMsg(null), 2200); }
    setSaving(false);
  };

  const randomFill = () => {
    const heroPool = allCards.filter(c => c.card_type === 'hero');
    const warriorPool = allCards.filter(c => c.card_type !== 'hero');
    const heroPick = heroPool.length ? heroPool[Math.floor(Math.random()*heroPool.length)].id : 1;
    const shuffled = [...warriorPool].sort(()=>Math.random()-0.5);
    const picked = shuffled.slice(0, 8).map(c => c.id);
    while (picked.length < 8) picked.push(null);
    const slots = [heroPick, ...picked];
    setEditing(p => ({...p, slots, preset_name: p.preset_name || 'Колода'}));
  };

  const createPreset = async () => {
    try {
      const res = await fetch(_buildAuthUrl('/api/deck/presets/create'), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({preset_name:'Новая колода'})});
      if (res.ok) await onReload();
    } catch(e){}
  };

  const setPrimaryDeck = async (presetNumber) => {
    try {
      const res = await fetch(_buildAuthUrl('/api/deck/presets/set-primary'), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({preset_number:presetNumber})});
      if (res.ok) await onReload();
    } catch(e){}
  };

  if (editing) {
    return <DeckEditor editing={{...editing, onNameChange:(name)=>setEditing(p=>({...p,preset_name:name})), onSlotChange:(idx,val)=>{setEditing(p=>{const s=[...p.slots];s[idx]=val;return{...p,slots:s};});}, onRandomFill:randomFill}} allCards={allCards} onBack={()=>setEditing(null)} onSave={savePreset} saving={saving} saveMsg={saveMsg}/>;
  }

  return (
    <div style={{flex:1,overflowY:'auto',padding:'8px 14px 20px',display:'flex',flexDirection:'column',gap:'10px'}}>
      {/* Create button */}
      <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'2px'}}>
        <span style={{fontSize:'13px',fontWeight:'800',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>Редактор колод</span>
        <div style={{flex:1}}/>
        <button onClick={createPreset}
          disabled={presets.length >= MAX_PRESETS}
          style={{padding:'6px 12px',borderRadius:'9px',background:presets.length>=MAX_PRESETS?T.bgDeep:T.purple2,border:`1px solid ${presets.length>=MAX_PRESETS?T.purple1:T.purple3}`,color:presets.length>=MAX_PRESETS?T.grey3:T.white,fontSize:'11px',fontWeight:'700',fontFamily:"'Exo 2',sans-serif",cursor:presets.length>=MAX_PRESETS?'not-allowed':'pointer',opacity:presets.length>=MAX_PRESETS?0.5:1}}>
          + Создать
        </button>
      </div>

      {presetSlots.map((preset, idx) => {
        const isLocked = idx >= FREE_LIMIT && !hasPass;
        const hasCards = preset.card_ids?.length > 0;
        const heroCard = allCards.find(c => c.id === preset.card_ids?.[0]);

        if (isLocked) {
          return (
            <div key={preset.preset_number} style={{background:T.bgCard,border:`1px solid ${T.purple1}`,borderRadius:'16px',padding:'13px 14px',opacity:0.6}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{display:'flex',alignItems:'center',gap:'9px'}}>
                  <div style={{width:'28px',height:'28px',borderRadius:'8px',background:`linear-gradient(135deg,${T.purple2},${T.purple3})`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'14px',fontWeight:'900',color:T.white,fontFamily:"'Exo 2',sans-serif",flexShrink:0}}>{preset.preset_number}</div>
                  <div>
                    <div style={{fontSize:'14px',fontWeight:'700',color:T.grey1,fontFamily:"'Exo 2',sans-serif"}}>{preset.preset_name || `Колода ${preset.preset_number}`}</div>
                  </div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:'6px',background:`linear-gradient(135deg,${T.orange}20,${T.orangeD}20)`,border:`1px solid ${T.orange}40`,borderRadius:'8px',padding:'5px 10px'}}>
                  <span style={{fontSize:'16px'}}>🔒</span>
                  <span style={{fontSize:'11px',fontWeight:'700',color:T.orange,fontFamily:"'Exo 2',sans-serif"}}>ExtraPass</span>
                </div>
              </div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'36px',border:`1px dashed ${T.orange}20`,borderRadius:'10px',marginTop:'8px'}}>
                <span style={{fontSize:'11px',color:T.grey3}}>Приобретите ExtraPass для доступа</span>
              </div>
            </div>
          );
        }

        return (
          <div key={preset.preset_number} style={{background:T.bgCard,border:`1px solid ${preset.is_primary?T.orange+'55':T.purple1}`,borderRadius:'16px',padding:'13px 14px',position:'relative'}}>
            {preset.is_primary && <div style={{position:'absolute',top:'-1px',left:'-1px',right:'-1px',height:'2px',background:`linear-gradient(90deg,transparent,${T.orange},transparent)`,borderRadius:'16px 16px 0 0'}}/>}
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:hasCards?'11px':'0'}}>
              <div style={{display:'flex',alignItems:'center',gap:'9px',minWidth:0}}>

const CollectionScreen = ({profile}) => {
  const [tab,          setTab]         = React.useState('decks');
  const [cards,        setCards]       = React.useState([]);
  const [presets,      setPresets]     = React.useState([]);
  const [loading,      setLoading]     = React.useState(true);
  const [sortBy,       setSortBy]      = React.useState('obtained');
  const [selectedCard, setSelectedCard]= React.useState(null);

  const userId = profile?.user_id;

  const loadCards = React.useCallback(async () => {
    setLoading(true);
    try {
      const res = await fetch(_buildAuthUrl('/api/cards/user'));
      if (!res.ok) throw new Error('failed');
      const data = await res.json();
      setCards(data.cards || []);
    } catch(e) { setCards([]); }
    setLoading(false);
  }, [userId]);

  const loadPresets = React.useCallback(async () => {
    try {
      const res = await fetch(_buildAuthUrl('/api/deck/presets'));
      if (!res.ok) throw new Error('failed');
      const data = await res.json();
      setPresets(data.presets || []);
    } catch(e) { setPresets([]); }
  }, [userId]);

  React.useEffect(() => { loadCards(); loadPresets(); }, [loadCards, loadPresets]);

  const sortedCards = React.useMemo(() => {
    const arr = [...cards];
    if      (sortBy==='rarity') arr.sort((a,b) => RARITY_ORDER.indexOf(a.rarity) - RARITY_ORDER.indexOf(b.rarity));
    else if (sortBy==='level')  arr.sort((a,b) => (b.level||1) - (a.level||1));
    else if (sortBy==='power')  arr.sort((a,b) => (b.power||0) - (a.power||0));
    return arr;
  }, [cards, sortBy]);

  // count cards ready to upgrade (for tab badge)
  const upgradeReadyCount = React.useMemo(() =>
    cards.filter(c => (c.level||1) < 10 && (c.particles||0) >= calcUpgradeParticles(c.rarity, c.level||1)).length
  , [cards]);

  // coins from profile (may be undefined for older profile shapes)
  const coins = profile?.coins ?? profile?.balance ?? null;

  const handleCardUpgraded = React.useCallback(() => {
    loadCards();
  }, [loadCards]);

  if (selectedCard) {
    return (
      <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
        <CardDetailScreen card={selectedCard} onBack={()=>setSelectedCard(null)} onCardUpgraded={handleCardUpgraded}/>
      </div>
    );
  }

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
      <div style={{display:'flex',background:T.bgDeep,margin:'10px 16px 0',borderRadius:'12px',padding:'3px',gap:'3px',flexShrink:0}}>
        {[
          {id:'decks', label:'Мои колоды'},
          {id:'cards', label:`Карты${cards.length ? ` (${cards.length})` : ''}${upgradeReadyCount > 0 ? ` ⬆️${upgradeReadyCount}` : ''}`},
        ].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{flex:1,padding:'9px 4px',borderRadius:'10px',background:tab===t.id?T.purple2:'none',border:'none',color:tab===t.id?T.white:T.grey2,fontSize:'13px',fontWeight:tab===t.id?'700':'400',fontFamily:"'Exo 2',sans-serif",cursor:'pointer',transition:'all 0.15s'}}>
            {t.label}
          </button>
        ))}
      </div>

      {tab === 'cards' && (<>
        <div style={{padding:'6px 16px 0',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div style={{display:'flex',gap:'6px',overflowX:'auto',scrollbarWidth:'none',flex:1}}>
            {[{id:'obtained',label:'Новые'},{id:'rarity',label:'Редкость'},{id:'level',label:'Уровень'},{id:'power',label:'Сила'}].map(s=>(
              <button key={s.id} onClick={()=>setSortBy(s.id)}
                style={{padding:'5px 13px',borderRadius:'16px',background:sortBy===s.id?T.orange:T.bgCard,border:`1px solid ${sortBy===s.id?T.orange:T.purple1}`,color:sortBy===s.id?'white':T.grey2,fontSize:'11px',fontWeight:'600',cursor:'pointer',whiteSpace:'nowrap',fontFamily:"'Exo 2',sans-serif",flexShrink:0,transition:'all 0.15s'}}>
                {s.label}
              </button>
            ))}
          </div>
          {coins !== null && (
            <div style={{display:'flex',alignItems:'center',gap:'4px',marginLeft:'8px',flexShrink:0,background:T.bgCard,borderRadius:'10px',padding:'4px 9px',border:`1px solid ${T.purple1}`}}>
              <span style={{fontSize:'12px'}}>🪙</span>
              <span style={{fontSize:'11px',fontWeight:'700',color:T.orange,fontFamily:"'Exo 2',sans-serif"}}>{Number(coins).toLocaleString()}</span>
            </div>
          )}
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'4px 12px 16px'}}>
          {loading
            ? <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'200px',gap:'10px'}}>
                <div style={{width:'22px',height:'22px',border:`2px solid ${T.purple2}`,borderTopColor:T.purpleLt,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
                <span style={{color:T.grey2,fontSize:'13px'}}>Загружаем коллекцию...</span>
              </div>
            : cards.length === 0
              ? <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'220px',gap:'12px'}}>
                  <div style={{width:'68px',height:'68px',borderRadius:'20px',background:T.bgCard,border:`1px solid ${T.purple1}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'32px',opacity:0.5}}>🃏</div>
                  <span style={{fontSize:'15px',fontWeight:'700',color:T.grey2,fontFamily:"'Exo 2',sans-serif"}}>Коллекция пуста</span>
                  <span style={{fontSize:'12px',color:T.grey3,textAlign:'center',lineHeight:1.6}}>Открывай кейсы в магазине,<br/>чтобы получить карты</span>
                </div>
              : <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',paddingTop:'4px'}}>
                  {sortedCards.map(card => <CardTile key={card.id} card={card} onClick={()=>setSelectedCard(card)}/>)}
                </div>
          }
        </div>
      </>)}

      {tab === 'decks' && (
        <DecksTab presets={presets} allCards={cards} onReload={loadPresets} profile={profile}/>
      )}
    </div>
  );
};

                      style={{flex:1,padding:'9px 8px',borderRadius:'10px',border:`1.5px solid ${subMod===s.id?m.color:`${m.color}33`}`,background:subMod===s.id?`${m.color}20`:'transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'4px',transition:'all 0.12s'}}>
                      <span style={{fontSize:'18px'}}>{s.icon}</span>
                      <span style={{fontSize:'12px',fontWeight:'700',color:subMod===s.id?m.color:T.grey2,fontFamily:"'Exo 2',sans-serif"}}>{s.label}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
          ))}
        </div>

        {/* Deck selector */}
        <div style={{marginBottom:'18px'}}>
          <div style={{fontSize:'11px',color:T.grey3,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'8px'}}>Колода</div>
          {presets.length === 0 ? (
            <div style={{background:T.bgCard,border:`1px solid ${T.purple1}`,borderRadius:'12px',padding:'10px 14px'}}>
              <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                <div style={{width:'20px',height:'20px',borderRadius:'50%',border:`2px solid ${T.purple2}`,borderTopColor:T.purpleLt,animation:'spin 0.8s linear infinite',flexShrink:0}}/>
                <span style={{fontSize:'12px',color:T.grey2}}>Загрузка колод...</span>
              </div>
            </div>
          ) : (
            <div style={{position:'relative'}}>
              <select value={deckId} onChange={e=>setDeckId(e.target.value)}
                style={{width:'100%',appearance:'none',background:T.bgCard,border:`1px solid ${T.purple2}`,borderRadius:'12px',padding:'11px 36px 11px 14px',color:T.white,fontSize:'13px',fontWeight:'600',fontFamily:"'Exo 2',sans-serif",outline:'none',cursor:'pointer'}}>
                {presets.map(p => {
                  const filled = (p.card_ids?.filter(Boolean)?.length || 0);
                  return <option key={p.preset_number} value={String(p.preset_number)} style={{background:T.bgDeep,color:T.white}}>{p.preset_name || `Колода ${p.preset_number}`} ({filled}/9)</option>;
                })}
              </select>
              <svg style={{position:'absolute',right:'14px',top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}} width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 5l3 3 3-3" stroke={T.grey2} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
          )}
          {presets.length > 0 && deckCount < 9 && (
            <div style={{fontSize:'10px',color:'#fbbf24',marginTop:'5px',display:'flex',alignItems:'center',gap:'4px'}}>
              <span>⚠️</span>
              <span>Колода неполная ({deckCount}/9). Соберите 9 карт в коллекции.</span>
            </div>
          )}
        </div>

        {deckCount < 9 || !selectedDeck?.card_ids?.[0] ? (
          <div style={{marginBottom:'12px'}}>
            <div style={{background:'rgba(248,113,113,0.1)',border:'1px solid rgba(248,113,113,0.3)',borderRadius:'12px',padding:'10px 14px',fontSize:'11px',color:'#f87171',lineHeight:1.5}}>
              {!selectedDeck?.card_ids?.[0] ? '⚠️ Выберите героя в колоде' : `⚠️ Колода неполная (${deckCount}/9). Соберите колоду в разделе «Мои колоды»`}
            </div>
            <button disabled style={{width:'100%',height:'54px',background:T.bgCard,border:`1px solid ${T.purple2}`,borderRadius:'16px',color:T.grey3,fontSize:'18px',fontWeight:'900',fontFamily:"'Exo 2',sans-serif",cursor:'not-allowed',marginTop:'8px'}}>
              {chosen.icon} В БОЙ — {chosen.label}
            </button>
          </div>
        ) : (
          <button onClick={()=>onConfirm(fullMode, deckId)}
            style={{width:'100%',height:'54px',background:`linear-gradient(135deg,${chosen.color},${chosen.color}cc)`,border:'none',borderRadius:'16px',color:'white',fontSize:'18px',fontWeight:'900',fontFamily:"'Exo 2',sans-serif",cursor:'pointer',boxShadow:`0 6px 24px ${chosen.color}44`,letterSpacing:'1px',transition:'all 0.15s'}}>
            {chosen.icon} В БОЙ — {mode==='extra_arena'?(chosen.subMods?.find(s=>s.id===subMod)?.label||chosen.label):chosen.label}
          </button>
        )}
      </div>
    </div>
  );
};

const MAIL_CATEGORY_ICONS = {rewards:'🎁', system:'⚙️', event:'🎉', battle:'⚔️', squad:'👥'};
const MAIL_CATEGORY_LABELS = {rewards:'Награды', system:'Система', event:'Событие', battle:'Бой', squad:'Отряд'};

const AttachmentBadge = ({attachments}) => {
  if (!attachments) return null;
  const items = [];
  if (attachments.gems)   items.push({icon:<IconGem size={12}/>,   val:attachments.gems,   color:'#c4b5fd'});
  if (attachments.coins)  items.push({icon:<IconCoin size={12}/>,  val:attachments.coins,  color:T.orange});
  if (attachments.keys)   items.push({icon:<span style={{fontSize:'12px'}}>🗝️</span>, val:attachments.keys,   color:T.orangeLt});
  if (attachments.stars)  items.push({icon:<span style={{fontSize:'12px'}}>⭐</span>, val:attachments.stars,  color:'#fbbf24'});
  if (!items.length) return null;
  return (
    <div style={{display:'flex',gap:'6px',flexWrap:'wrap',marginTop:'8px'}}>
      {items.map((it,i)=>(
        <div key={i} style={{display:'flex',alignItems:'center',gap:'4px',background:`${it.color}15`,border:`1px solid ${it.color}40`,borderRadius:'8px',padding:'3px 8px'}}>
          {it.icon}
          <span style={{fontSize:'12px',color:it.color,fontWeight:'700',fontFamily:"'Exo 2',sans-serif"}}>+{it.val}</span>
        </div>
      ))}
    </div>
  );
};

const MailScreen = ({onClose, userId}) => {
  const [mails,     setMails]     = React.useState([]);
  const [loading,   setLoading]   = React.useState(true);
  const [selected,  setSelected]  = React.useState(null);
  const [filterCat, setFilterCat] = React.useState(null);

  const loadMail = React.useCallback(async () => {
    setLoading(true);
    try {
      let url = '/api/mail';
      const p = new URLSearchParams();
      if (userId) p.set('user_id', userId);
      if (filterCat) p.set('category', filterCat);
      p.set('limit', '50');
      url += '?' + p.toString();
      const res = await fetch(url);
      if (!res.ok) throw new Error('failed');
      const data = await res.json();
      setMails(data.mail || []);
    } catch(e) { setMails([]); }
    setLoading(false);
  }, [userId, filterCat]);

  React.useEffect(() => { loadMail(); }, [loadMail]);

  const markRead = async (mail) => {
    if (mail.is_read) return;
    try {
      let url = '/api/mail/read';
      if (userId) url += '?user_id=' + userId;
      await fetch(url, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({mail_id: mail.id || mail.mail_id}),
      });
      setMails(prev => prev.map(m => m.id === mail.id ? {...m, is_read:true} : m));
    } catch(e){}
  };

  const openMail = (mail) => {
    setSelected(mail);
    markRead(mail);
  };

  const unreadCount = mails.filter(m=>!m.is_read).length;
  const categories = [...new Set(mails.map(m=>m.category))].filter(Boolean);

  const fmtDate = (iso) => {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return 'только что';
      if (diff < 3600) return Math.floor(diff/60) + ' мин назад';
      if (diff < 86400) return Math.floor(diff/3600) + ' ч назад';
      return d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
    } catch(e) { return ''; }
  };

  // Детальный вид письма
  if (selected) {
    const catIcon = MAIL_CATEGORY_ICONS[selected.category] || '📬';
    return (
      <div style={{position:'absolute',inset:0,background:T.bg,zIndex:31,display:'flex',flexDirection:'column',animation:'fadeIn 0.2s'}}>
        <div style={{height:'52px',background:'rgba(15,10,26,0.98)',display:'flex',alignItems:'center',gap:'10px',padding:'0 16px',flexShrink:0,borderBottom:`1px solid ${T.purple1}`}}>
          <button onClick={()=>setSelected(null)} style={{width:'32px',height:'32px',borderRadius:'10px',background:T.bgCard,border:`1px solid ${T.purple1}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7L9 11" stroke={T.grey2} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <span style={{fontSize:'15px',fontWeight:'700',color:T.white,fontFamily:"'Exo 2',sans-serif",overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{selected.subject}</span>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'16px'}}>
          <div style={{background:T.bgCard,borderRadius:'16px',padding:'16px',border:`1px solid ${T.purple1}`,marginBottom:'12px'}}>
            <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px'}}>
              <div style={{width:'38px',height:'38px',borderRadius:'10px',background:T.purple1,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px',flexShrink:0}}>
                {selected.icon || catIcon}
              </div>
              <div>
                <div style={{fontSize:'13px',fontWeight:'600',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>{selected.sender || 'Система'}</div>
                <div style={{fontSize:'11px',color:T.grey3,marginTop:'1px'}}>{fmtDate(selected.created_at)}</div>
              </div>
              {selected.category && (
                <div style={{marginLeft:'auto',fontSize:'10px',color:T.grey2,background:T.purple1,borderRadius:'6px',padding:'2px 8px',fontWeight:'600',fontFamily:"'Exo 2',sans-serif"}}>
                  {MAIL_CATEGORY_LABELS[selected.category] || selected.category}
                </div>
              )}
            </div>
            <div style={{height:'1px',background:T.purple1,margin:'10px 0'}}/>
            <div style={{fontSize:'13px',color:T.grey1,lineHeight:1.65,whiteSpace:'pre-wrap'}}>{selected.content || selected.text || '—'}</div>
            {selected.attachments && Object.keys(selected.attachments).length > 0 && (
              <div style={{marginTop:'14px',padding:'12px',background:`${T.orange}08`,border:`1px solid ${T.orange}30`,borderRadius:'12px'}}>
                <div style={{fontSize:'11px',color:T.orange,fontWeight:'700',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'6px'}}>Вложения</div>
                <AttachmentBadge attachments={selected.attachments}/>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div style={{position:'absolute',inset:0,background:T.bg,zIndex:31,display:'flex',flexDirection:'column',animation:'fadeIn 0.2s'}}>
      {/* Header */}
      <div style={{height:'52px',background:'rgba(15,10,26,0.98)',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 16px',flexShrink:0,borderBottom:`1px solid ${T.purple1}`}}>
        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          <button onClick={onClose} style={{width:'32px',height:'32px',borderRadius:'10px',background:T.bgCard,border:`1px solid ${T.purple1}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7L9 11" stroke={T.grey2} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <span style={{fontSize:'16px',fontWeight:'800',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>Почта</span>
          {unreadCount > 0 && (
            <div style={{background:T.orange,borderRadius:'10px',padding:'1px 7px',fontSize:'11px',fontWeight:'700',color:'white',fontFamily:"'Exo 2',sans-serif"}}>{unreadCount}</div>
          )}
        </div>
        <button onClick={loadMail} style={{width:'32px',height:'32px',borderRadius:'10px',background:T.bgCard,border:`1px solid ${T.purple1}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{animation:loading?'spin 0.8s linear infinite':undefined}}><path d="M12 7A5 5 0 1 1 7 2" stroke={T.grey1} strokeWidth="1.5" strokeLinecap="round"/><path d="M7 2l2-2M7 2l2 2" stroke={T.grey1} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
      </div>

      {/* Category filter */}
      {categories.length > 1 && (
        <div style={{padding:'8px 16px',display:'flex',gap:'6px',overflowX:'auto',scrollbarWidth:'none',flexShrink:0,borderBottom:`1px solid ${T.purple1}`}}>
          <button onClick={()=>setFilterCat(null)} style={{padding:'5px 12px',borderRadius:'16px',background:filterCat===null?T.orange:T.bgCard,border:`1px solid ${filterCat===null?T.orange:T.purple1}`,color:filterCat===null?'white':T.grey2,fontSize:'11px',fontWeight:'600',cursor:'pointer',whiteSpace:'nowrap',fontFamily:"'Exo 2',sans-serif"}}>Все</button>
          {categories.map(cat=>(
            <button key={cat} onClick={()=>setFilterCat(cat===filterCat?null:cat)} style={{padding:'5px 12px',borderRadius:'16px',background:filterCat===cat?T.orange:T.bgCard,border:`1px solid ${filterCat===cat?T.orange:T.purple1}`,color:filterCat===cat?'white':T.grey2,fontSize:'11px',fontWeight:'600',cursor:'pointer',whiteSpace:'nowrap',fontFamily:"'Exo 2',sans-serif"}}>
              {MAIL_CATEGORY_ICONS[cat]||'📬'} {MAIL_CATEGORY_LABELS[cat]||cat}
            </button>
          ))}
        </div>
      )}

      {/* List */}
      <div style={{flex:1,overflowY:'auto',padding:'8px 16px',display:'flex',flexDirection:'column',gap:'6px'}}>
        {loading ? (
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',flex:1,gap:'10px'}}>
            <div style={{width:'22px',height:'22px',border:`2px solid ${T.purple2}`,borderTopColor:T.purpleLt,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
            <span style={{color:T.grey2,fontSize:'13px'}}>Загружаем письма...</span>
          </div>
        ) : mails.length === 0 ? (
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flex:1,gap:'10px',padding:'40px 0'}}>
            <div style={{fontSize:'40px',opacity:0.4}}>📭</div>
            <span style={{fontSize:'15px',fontWeight:'700',color:T.grey2,fontFamily:"'Exo 2',sans-serif"}}>Писем нет</span>
            <span style={{fontSize:'12px',color:T.grey3,textAlign:'center'}}>Здесь будут награды и сообщения от системы</span>
          </div>
        ) : mails.map(mail => (
          <button key={mail.id} onClick={()=>openMail(mail)}
            style={{display:'flex',gap:'11px',padding:'12px 14px',background:mail.is_read?T.bgCard:`linear-gradient(135deg,${T.purple1},${T.bgCard})`,border:`1px solid ${mail.is_read?T.purple1:T.purpleHL}`,borderRadius:'14px',cursor:'pointer',textAlign:'left',transition:'all 0.15s',position:'relative',overflow:'hidden'}}>
            {!mail.is_read && <div style={{position:'absolute',top:0,left:0,bottom:0,width:'3px',background:T.purpleLt,borderRadius:'3px 0 0 3px'}}/>}
            <div style={{width:'40px',height:'40px',borderRadius:'10px',background:mail.is_read?T.purple1:`linear-gradient(135deg,${T.purple2},${T.purple3})`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px',flexShrink:0}}>{mail.icon||MAIL_CATEGORY_ICONS[mail.category]||'📬'}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'2px'}}>
                <span style={{fontSize:'13px',fontWeight:mail.is_read?'500':'700',color:T.white,fontFamily:"'Exo 2',sans-serif",overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{mail.subject}</span>
                <span style={{fontSize:'10px',color:T.grey3,flexShrink:0,marginLeft:'6px'}}>{fmtDate(mail.created_at)}</span>
              </div>
              <div style={{fontSize:'11px',color:T.grey2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{mail.sender || 'Система'}</div>
              {mail.attachments && <AttachmentBadge attachments={mail.attachments}/>}
            </div>
          </button>
        ))}
      </div>
    </div>
  );
};

const App = () => {
  const [navTab,         setNavTab]         = React.useState(2);
  const [showMenu,       setShowMenu]       = React.useState(false);
  const [showSettings,   setShowSettings]   = React.useState(false);
  const [showAI,         setShowAI]         = React.useState(false);
  const [showBattlePick, setShowBattlePick] = React.useState(false);
  const [showGameMode,   setShowGameMode]   = React.useState(false);
  const [showMail,       setShowMail]       = React.useState(false);
  const [showCaseOpen,   setShowCaseOpen]   = React.useState(false);
  const [showInfo,       setShowInfo]       = React.useState(false);
  const [showGloryPath,  setShowGloryPath]  = React.useState(false);
  const [showLeagueInfo, setShowLeagueInfo] = React.useState(false);
  const [profile,        setProfile]        = React.useState(null);

  const hasOverlay = showAI || showMenu || showSettings || showBattlePick || showGameMode || showMail || showCaseOpen || showInfo || showGloryPath || showLeagueInfo;

  React.useEffect(()=>{
    const anyOpen = showMenu || showSettings || showBattlePick || showGameMode || showMail || showCaseOpen || showInfo || showGloryPath || showLeagueInfo;
    if (anyOpen) window._playSfx('menu-open-sound');
  }, [showMenu, showSettings, showBattlePick, showGameMode, showMail, showCaseOpen, showInfo, showGloryPath, showLeagueInfo]);

  const swipeRef = React.useRef(null);
  const swipeStartX = React.useRef(0);
  const onTouchStart = (e) => { if(!hasOverlay && e.touches.length===1) swipeStartX.current=e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if(hasOverlay) return;
    const dx = (e.changedTouches[0]?.clientX||0) - swipeStartX.current;
    if(Math.abs(dx)>50){ if(dx<0)setNavTab(t=>(t+1)%NAV_ITEMS.length); else setNavTab(t=>(t-1+NAV_ITEMS.length)%NAV_ITEMS.length); }
  };

  React.useEffect(()=>{
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor?.('#0f0a1a'); } catch(e){}
      try { tg.setBackgroundColor?.('#0f0a1a'); } catch(e){}
    }
    // Запуск музыки (с автозапуском или по первому тапу)
    window.startBgMusic();
    window.loadProfile().then(data => {
      if (data) {
        setProfile(data);
        // Синхронизируем настройку музыки из профиля
        const musicOn = data?.settings?.sound_music ?? true;
        window._musicEnabled = musicOn;
        if (musicOn) window.startBgMusic(); else window.stopBgMusic();
      }
    });
  },[]);

  const displayName = profile?.custom_nickname || profile?.first_name || profile?.username || 'ExtraArena';
  const openSettings = () => { setShowMenu(false); setTimeout(()=>setShowSettings(true),120); };

  return (
    <div style={{width:'100%',height:'100%',background:T.bg,display:'flex',flexDirection:'column',position:'relative',overflow:'hidden',touchAction:'pan-y',overscrollBehavior:'none'}}>
      <TopBar
        title={showAI ? 'ИИ Аналитика' : displayName}
        showBack={showAI}
        onBack={()=>setShowAI(false)}
        onMenu={!showAI ? ()=>setShowMenu(true) : null}
        profile={profile}
        extra={showAI ? (
          <div style={{width:'28px',height:'28px',borderRadius:'8px',background:T.aiBg,border:`1px solid ${T.aiBorder}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="2.5" fill={T.ai}/><path d="M7 1v2M7 11v2M1 7h2M11 7h2" stroke={T.ai} strokeWidth="1.2" strokeLinecap="round"/></svg>
          </div>
        ) : null}
      />

      {/* Main content */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}
        onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
        {showAI ? (
          <AIScreen onBack={()=>setShowAI(false)}/>
        ) : navTab===2 ? (
          <ArenaScreen onMenu={()=>setShowMenu(true)} onAI={()=>setShowAI(true)} onBattlePick={()=>setShowBattlePick(true)} onStartBattle={()=>setShowGameMode(true)} onOpenCase={()=>setShowCaseOpen(true)} onOpenGloryPath={()=>setShowGloryPath(true)} onOpenLeagueInfo={()=>setShowLeagueInfo(true)} profile={profile}/>
        ) : navTab===0 ? (
          <ShopScreen profile={profile} onKeysUpdated={(k)=>setProfile(p=>({...p,keys:k}))}/>
        ) : navTab===1 ? (
          <CollectionScreen profile={profile}/>
        ) : (
          <PlaceholderScreen label={['Магазин','','Коллекция','Сквады','Коммьюнити'][navTab]}/>
        )}
      </div>

      {!showAI && <BottomNav active={navTab} onChange={setNavTab}/>}

      {showMenu       && <MenuSheet       onClose={()=>setShowMenu(false)} onSettings={openSettings} onMail={()=>{setShowMenu(false);setTimeout(()=>setShowMail(true),120);}} onInfo={()=>{setShowMenu(false);setTimeout(()=>setShowInfo(true),120);}} profile={profile}/>}
      {showSettings   && <SettingsScreen  onClose={()=>setShowSettings(false)} profile={profile}/>}
      {showBattlePick && <BattlePickSheet onClose={()=>setShowBattlePick(false)} profile={profile}/>}
      {showGameMode   && <GameModeSheet   onClose={()=>setShowGameMode(false)} onConfirm={(mode, deckId)=>{setShowGameMode(false);window.startBattle(profile, deckId, mode);}}/>}
      {showMail       && <MailScreen      onClose={()=>setShowMail(false)} userId={profile?.user_id}/>}
      {showCaseOpen   && <CaseOpenScreen onClose={()=>setShowCaseOpen(false)} onDone={()=>{setShowCaseOpen(false);window.loadProfile().then(d=>{if(d)setProfile(d);});}} profile={profile}/>}
      {showInfo       && <InfoSheet      onClose={()=>setShowInfo(false)}/>}
      {showGloryPath  && <TrophyRoadSheet onClose={()=>setShowGloryPath(false)} profile={profile}/>}
      {showLeagueInfo && <LeagueInfoSheet onClose={()=>setShowLeagueInfo(false)} profile={profile}/>}
    </div>
  );
};
