const GeneratorScreen = ({onBack, profile}) => {
  const [status,  setStatus]  = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [error,   setError]   = React.useState(null);

  const fetchStatus = async () => {
    setLoading(true); setError(null);
    try {
      const res = await fetch(apiUrl('/api/generator/status'));
      const data = await res.json();
      if (data.error) { setError(data.error); } else { setStatus(data); }
    } catch(e) { setError('Ошибка загрузки'); }
    finally { setLoading(false); }
  };

  React.useEffect(() => { fetchStatus(); const iv = setInterval(fetchStatus, 5000); return () => clearInterval(iv); }, []);

  const doClaim = async () => {
    setLoading(true); setError(null);
    try {
      const res = await fetch(apiUrl('/api/generator/claim'), {method:'POST'});
      const data = await res.json();
      if (data.error) { setError(data.error); setLoading(false); return; }
      if (data.success && window.loadProfile) {
        window.loadProfile().then(d => { if (d) { if (window.__updateProfile) window.__updateProfile(d); } });
      }
      fetchStatus();
    } catch(e) { setError('Ошибка claim'); setLoading(false); }
  };

  const doUpgrade = async (currency) => {
    setLoading(true); setError(null);
    try {
      const res = await fetch(apiUrl('/api/generator/upgrade'), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({currency})});
      const data = await res.json();
      if (data.error) { setError(data.message || data.error); setLoading(false); return; }
      if (window.loadProfile) {
        window.loadProfile().then(d => { if (d) { if (window.__updateProfile) window.__updateProfile(d); } });
      }
      fetchStatus();
    } catch(e) { setError('Ошибка upgrade'); setLoading(false); }
  };

  const fmtTimer = (sec) => {
    if (sec == null) return '—';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    return `${h}ч ${m}м ${s}с`;
  };

  const level = status?.level || 1;
  const acc   = status?.accumulated_keys || 0;
  const cap   = status?.cap || 0;
  const ivH   = status?.interval_hours || '—';
  const nextS = status?.next_key_seconds;
  const uc    = status?.upgrade_cost;
  const canClaim = status?.can_claim;
  const isMax = status?.level === status?.max_level;

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'auto',animation:'fadeIn 0.2s',minHeight:0}}>
      <div style={{padding:'16px 16px 0'}}>
        <div style={{background:`linear-gradient(135deg,${T.aiDeep},#1a1050)`,border:`1px solid ${T.aiBorder}`,borderRadius:'16px',padding:'16px',marginBottom:'12px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
            <span style={{fontSize:'10px',color:T.ai,textTransform:'uppercase',letterSpacing:'0.5px',fontWeight:'600'}}>Генератор ключей</span>
            <span style={{fontSize:'12px',fontWeight:'700',color:T.white,background:`${T.orange}22`,borderRadius:'8px',padding:'2px 10px',fontFamily:"'Exo 2',sans-serif"}}>Уровень {level}</span>
          </div>
          <div style={{display:'flex',gap:'12px'}}>
            <div style={{flex:1,background:`${T.purple1}44`,borderRadius:'12px',padding:'12px',textAlign:'center'}}>
              <div style={{fontSize:'32px',fontWeight:'900',color:canClaim?T.orange:T.white,fontFamily:"'Exo 2',sans-serif"}}>{acc}</div>
              <div style={{fontSize:'11px',color:T.grey2}}>из {cap} ключей</div>
            </div>
            <div style={{flex:1,background:`${T.purple1}44`,borderRadius:'12px',padding:'12px',textAlign:'center'}}>
              <div style={{fontSize:'14px',fontWeight:'700',color:T.grey1,fontFamily:"'Exo 2',sans-serif",marginBottom:'2px'}}>{ivH}ч / ключ</div>
              <div style={{fontSize:'12px',color:nextS?T.orange:T.grey2,fontWeight:'600',marginTop:'2px',minHeight:'16px'}}>
                {nextS ? `⚡ ${fmtTimer(nextS)}` : (acc >= cap ? 'Полный!' : 'Расчёт...')}
              </div>
            </div>
          </div>
        </div>

        {error && (
          <div style={{background:'#7f1d1d44',border:'1px solid #ef444455',borderRadius:'10px',padding:'8px 14px',marginBottom:'12px',color:'#f87171',fontSize:'12px',fontWeight:'600'}}>
            {error}
          </div>
        )}

        <button onClick={doClaim} disabled={!canClaim || loading}
          style={{
            width:'100%',padding:'12px',borderRadius:'14px',border:'none',cursor:canClaim?'pointer':'default',
            background:canClaim?`linear-gradient(135deg,${T.orange},${T.orangeLt})`:'rgba(255,255,255,0.08)',
            color:canClaim?'#1a0a00':'#666',fontSize:'15px',fontWeight:'800',
            fontFamily:"'Exo 2',sans-serif",marginBottom:'14px',opacity:canClaim?1:0.5,transition:'all 0.15s'
          }}
        >
          {loading ? 'Загрузка...' : canClaim ? `🔑 Забрать ${acc} ключ(ей)` : 'Нет ключей для сбора'}
        </button>

        {/* Upgrade block */}
        {!isMax && uc && (
          <div style={{background:T.bgCard,borderRadius:'14px',padding:'14px',border:`1px solid ${T.purple1}`,marginBottom:'12px'}}>
            <div style={{fontSize:'13px',fontWeight:'700',color:T.white,marginBottom:'10px',fontFamily:"'Exo 2',sans-serif"}}>

            <div style={{display:'flex',gap:'8px'}}>
              {uc.coins && (
                <button onClick={()=>doUpgrade('coins')} disabled={loading || (profile?.coins||0)<uc.coins}
                  style={{
                    flex:1,padding:'10px',borderRadius:'10px',border:`1px solid ${T.orange}44`,
                    background:`${T.orange}11`,color:T.orange,cursor:'pointer',fontSize:'13px',fontWeight:'700',
                    fontFamily:"'Exo 2',sans-serif",opacity:(profile?.coins||0)>=uc.coins?1:0.5
                  }}

                </button>
              )}
              {uc.gems && (
                <button onClick={()=>doUpgrade('gems')} disabled={loading || (profile?.gems||0)<uc.gems}

                    flex:1,padding:'10px',borderRadius:'10px',border:`1px solid ${T.purpleLt}44`,
                    background:`${T.purpleLt}11`,color:T.purpleLt,cursor:'pointer',fontSize:'13px',fontWeight:'700',

            {upgrErr && <div style={{marginTop:'6px',fontSize:'11px',color:'#f87171',textAlign:'center'}}>{upgrErr}</div>}

        {/* mechanics */}
        {mechanics.length > 0 && (
          <div style={{background:T.bgCard,borderRadius:'14px',padding:'12px 14px',border:`1px solid ${T.purple1}`,marginBottom:'10px'}}>
            <div style={{fontSize:'10px',color:T.grey3,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'8px'}}>Механики</div>
            <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
              {mechanics.map((m,i) => <div key={i} style={{background:`${T.purpleHL}18`,border:`1px solid ${T.purpleHL}35`,borderRadius:'8px',padding:'3px 10px',fontSize:'11px',color:T.purpleLt,fontWeight:'600',fontFamily:"'Exo 2',sans-serif"}}>{m}</div>)}

            <div style={{fontSize:'10px',color:T.grey3,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'6px'}}>Описание</div>

    </div>
  );
};

const CardPickerSheet = ({allCards, deckCardIds, onPick, onClose, heroOnly}) => {
  const [search, setSearch] = React.useState('');
  const [sort, setSort] = React.useState('rarity');
  const cards = heroOnly ? allCards.filter(c => c.card_type === 'hero') : allCards;
  const available = cards.filter(c => !deckCardIds.includes(c.id));
  const filtered = React.useMemo(() => {
    let arr = search ? available.filter(c => c.name.toLowerCase().includes(search.toLowerCase())) : [...available];
    if (sort==='rarity') arr.sort((a,b) => RARITY_ORDER.indexOf(a.rarity) - RARITY_ORDER.indexOf(b.rarity));
    else if (sort==='level') arr.sort((a,b) => (b.level||1) - (a.level||1));
    else if (sort==='power') arr.sort((a,b) => (b.power||0) - (a.power||0));
    else if (sort==='mana') arr.sort((a,b) => (a.mana_cost||0) - (b.mana_cost||0));
    else if (sort==='name') arr.sort((a,b) => (a.name||'').localeCompare(b.name||''));
    return arr;
  }, [available, search, sort]);
  const SORTS = [{id:'rarity',label:'Редк.'},{id:'level',label:'Уров.'},{id:'power',label:'Сила'},{id:'mana',label:'Мана'},{id:'name',label:'Имя'}];
  return (
    <div style={{position:'absolute',inset:0,background:'rgba(5,3,14,0.82)',backdropFilter:'blur(10px)',zIndex:40,display:'flex',flexDirection:'column',justifyContent:'flex-end'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} className="safe-pad-bottom"
        style={{background:'linear-gradient(180deg,#1c1340 0%,#130d26 100%)',borderRadius:'22px 22px 0 0',padding:'14px 16px 0',border:`1px solid ${T.purple1}`,borderBottom:'none',boxShadow:'0 -20px 60px rgba(0,0,0,0.7)',animation:'slideUp 0.26s cubic-bezier(0.32,0.72,0,1)',maxHeight:'80vh',display:'flex',flexDirection:'column'}}>
        <div style={{width:'36px',height:'4px',borderRadius:'2px',background:T.purple2,margin:'0 auto 12px'}}/>
        <div style={{fontSize:'15px',fontWeight:'800',color:T.white,fontFamily:"'Exo 2',sans-serif",marginBottom:'10px'}}>{heroOnly ? 'Выбери героя' : 'Выбери карту'}</div>
        <div style={{background:T.bgDeep,border:`1px solid ${T.purple2}`,borderRadius:'10px',padding:'7px 12px',display:'flex',gap:'8px',alignItems:'center',marginBottom:'8px',flexShrink:0}}>
          <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><circle cx="5.5" cy="5.5" r="3.5" stroke={T.grey3} strokeWidth="1.3"/><path d="M9 9l2 2" stroke={T.grey3} strokeWidth="1.3" strokeLinecap="round"/></svg>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Поиск..." autoFocus
            style={{flex:1,background:'none',border:'none',color:T.white,fontSize:'13px',fontFamily:"'Inter',sans-serif",outline:'none'}}/>
          {search && <button onClick={()=>setSearch('')} style={{background:'none',border:'none',cursor:'pointer',color:T.grey3,fontSize:'14px',padding:'0',lineHeight:1}}>✕</button>}
        </div>
        {!heroOnly && <div style={{display:'flex',gap:'5px',overflowX:'auto',paddingBottom:'6px',flexShrink:0,scrollbarWidth:'none'}}>
          {SORTS.map(s=><button key={s.id} onClick={()=>setSort(s.id)} style={{padding:'5px 10px',borderRadius:'14px',background:sort===s.id?T.orange:T.bgCard,border:`1px solid ${sort===s.id?T.orange:T.purple1}`,color:sort===s.id?'white':T.grey2,fontSize:'10px',fontWeight:'600',cursor:'pointer',whiteSpace:'nowrap',fontFamily:"'Exo 2',sans-serif",flexShrink:0}}>{s.label}</button>)}
        </div>}
        <div style={{flex:1,overflowY:'auto',paddingBottom:'20px'}}>
          {filtered.length === 0
            ? <div style={{textAlign:'center',padding:'32px 0',color:T.grey3,fontSize:'13px'}}>{available.length===0 ? (heroOnly?'Все герои уже в колоде':'Все карты уже в колоде') : 'Нет результатов'}</div>
            : <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:'8px'}}>{filtered.map(card => <CardTile key={card.id} card={card} onClick={()=>onPick(card.id)}/>)}</div>
          }
        </div>
      </div>
    </div>
  );
};

        ) : (
          <><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 4v8M4 8h8" stroke={T.grey3} strokeWidth="1.5" strokeLinecap="round"/></svg><span style={{fontSize:'7px',color:T.grey3,fontFamily:"'Exo 2',sans-serif",fontWeight:'600'}}>Добавить</span></>

        </div>
        <div style={{flex:1,minWidth:0,textAlign:'left'}}>
          <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'2px'}}>
            <span style={{fontSize:'13px',fontWeight:'800',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>{card.name}</span>
            <span style={{fontSize:'10px',color:T.orange,background:`${T.orange}18`,borderRadius:'5px',padding:'1px 6px',fontWeight:'700',fontFamily:"'Exo 2',sans-serif"}}>ГЕРОЙ</span>

const DecksTab = ({presets, allCards, onReload, profile}) => {
  const [editing, setEditing] = React.useState(null);
  const [saving, setSaving]   = React.useState(false);
  const [saveMsg, setSaveMsg] = React.useState(null);
  const hasPass = profile?.extra_pass === 'active' || profile?.extra_pass === 'ultra';
  const MAX_PRESETS = 5;
  const FREE_LIMIT = 3;
  const presetSlots = Array.from({length:MAX_PRESETS}, (_,i) => i+1).map(n => presets.find(p => p.preset_number===n) || {id:null, preset_number:n, preset_name:`Колода ${n}`, card_ids:[], is_primary:false});

  const savePreset = async () => {
    if (!editing || saving) return;
    const heroFilled = !!editing.slots[0];
    const filled = editing.slots.filter(Boolean).length;
    const totalCards = allCards.length;
    if (!heroFilled) { setSaveMsg('no_hero'); setTimeout(()=>setSaveMsg(null),2500); return; }
    if (totalCards >= 9 && filled < 9) { setSaveMsg('incomplete'); setTimeout(()=>setSaveMsg(null),2500); return; }
    setSaving(true);
    try {
      const slots = Array.from({length:9}, (_,i) => editing.slots[i] || null);
      const res = await fetch(_buildAuthUrl('/api/deck/presets/save'), {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({preset_number: editing.preset_number, preset_name: editing.preset_name, card_slots: slots}),
      });
      if (!res.ok) throw new Error('save failed');
      setSaveMsg('ok');
      await onReload();
      setTimeout(() => { setSaveMsg(null); setEditing(null); }, 700);
    } catch(e) { setSaveMsg('err'); setTimeout(() => setSaveMsg(null), 2200); }
    setSaving(false);
  };

  const randomFill = () => {
    const heroPool = allCards.filter(c => c.card_type === 'hero');
    const warriorPool = allCards.filter(c => c.card_type !== 'hero');
    const heroPick = heroPool.length ? heroPool[Math.floor(Math.random()*heroPool.length)].id : 1;
    const shuffled = [...warriorPool].sort(()=>Math.random()-0.5);
    const picked = shuffled.slice(0, 8).map(c => c.id);
    while (picked.length < 8) picked.push(null);
    const slots = [heroPick, ...picked];
    setEditing(p => ({...p, slots, preset_name: p.preset_name || 'Колода'}));
  };

  const createPreset = async () => {
    try {
      const res = await fetch(_buildAuthUrl('/api/deck/presets/create'), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({preset_name:'Новая колода'})});
      if (res.ok) await onReload();
    } catch(e){}
  };

  const setPrimaryDeck = async (presetNumber) => {
    try {
      const res = await fetch(_buildAuthUrl('/api/deck/presets/set-primary'), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({preset_number:presetNumber})});
      if (res.ok) await onReload();
    } catch(e){}
  };

  if (editing) {
    return <DeckEditor editing={{...editing, onNameChange:(name)=>setEditing(p=>({...p,preset_name:name})), onSlotChange:(idx,val)=>{setEditing(p=>{const s=[...p.slots];s[idx]=val;return{...p,slots:s};});}, onRandomFill:randomFill}} allCards={allCards} onBack={()=>setEditing(null)} onSave={savePreset} saving={saving} saveMsg={saveMsg}/>;
  }

  return (
    <div style={{flex:1,overflowY:'auto',padding:'8px 14px 20px',display:'flex',flexDirection:'column',gap:'10px'}}>
      {/* Create button */}
      <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'2px'}}>
        <span style={{fontSize:'13px',fontWeight:'800',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>Редактор колод</span>
        <div style={{flex:1}}/>
        <button onClick={createPreset}
          disabled={presets.length >= MAX_PRESETS}
          style={{padding:'6px 12px',borderRadius:'9px',background:presets.length>=MAX_PRESETS?T.bgDeep:T.purple2,border:`1px solid ${presets.length>=MAX_PRESETS?T.purple1:T.purple3}`,color:presets.length>=MAX_PRESETS?T.grey3:T.white,fontSize:'11px',fontWeight:'700',fontFamily:"'Exo 2',sans-serif",cursor:presets.length>=MAX_PRESETS?'not-allowed':'pointer',opacity:presets.length>=MAX_PRESETS?0.5:1}}>
          + Создать
        </button>
      </div>

      {presetSlots.map((preset, idx) => {
        const isLocked = idx >= FREE_LIMIT && !hasPass;
        const hasCards = preset.card_ids?.length > 0;
        const heroCard = allCards.find(c => c.id === preset.card_ids?.[0]);

        if (isLocked) {
          return (
            <div key={preset.preset_number} style={{background:T.bgCard,border:`1px solid ${T.purple1}`,borderRadius:'16px',padding:'13px 14px',opacity:0.6}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{display:'flex',alignItems:'center',gap:'9px'}}>
                  <div style={{width:'28px',height:'28px',borderRadius:'8px',background:`linear-gradient(135deg,${T.purple2},${T.purple3})`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'14px',fontWeight:'900',color:T.white,fontFamily:"'Exo 2',sans-serif",flexShrink:0}}>{preset.preset_number}</div>
                  <div>
                    <div style={{fontSize:'14px',fontWeight:'700',color:T.grey1,fontFamily:"'Exo 2',sans-serif"}}>{preset.preset_name || `Колода ${preset.preset_number}`}</div>
                  </div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:'6px',background:`linear-gradient(135deg,${T.orange}20,${T.orangeD}20)`,border:`1px solid ${T.orange}40`,borderRadius:'8px',padding:'5px 10px'}}>
                  <span style={{fontSize:'16px'}}>🔒</span>
                  <span style={{fontSize:'11px',fontWeight:'700',color:T.orange,fontFamily:"'Exo 2',sans-serif"}}>ExtraPass</span>
                </div>
              </div>
              <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'36px',border:`1px dashed ${T.orange}20`,borderRadius:'10px',marginTop:'8px'}}>
                <span style={{fontSize:'11px',color:T.grey3}}>Приобретите ExtraPass для доступа</span>
              </div>
            </div>
          );
        }

        return (
          <div key={preset.preset_number} style={{background:T.bgCard,border:`1px solid ${preset.is_primary?T.orange+'55':T.purple1}`,borderRadius:'16px',padding:'13px 14px',position:'relative'}}>
            {preset.is_primary && <div style={{position:'absolute',top:'-1px',left:'-1px',right:'-1px',height:'2px',background:`linear-gradient(90deg,transparent,${T.orange},transparent)`,borderRadius:'16px 16px 0 0'}}/>}
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:hasCards?'11px':'0'}}>
              <div style={{display:'flex',alignItems:'center',gap:'9px',minWidth:0}}>
                <div style={{width:'28px',height:'28px',borderRadius:'8px',background:preset.is_primary?`linear-gradient(135deg,${T.orange},${T.orangeD})`:`linear-gradient(135deg,${T.purple2},${T.purple3})`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'14px',fontWeight:'900',color:'white',fontFamily:"'Exo 2',sans-serif",flexShrink:0}}>{preset.preset_number}</div>
                <div style={{minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
                    <span style={{fontSize:'14px',fontWeight:'700',color:T.white,fontFamily:"'Exo 2',sans-serif",lineHeight:1.2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{preset.preset_name || `Колода ${preset.preset_number}`}</span>
                    {preset.is_primary && <span style={{fontSize:'11px',color:T.orange}}>★</span>}
                  </div>
                  {hasCards && <div style={{fontSize:'10px',color:T.grey3,marginTop:'1px'}}>{(preset.card_ids?.filter(Boolean)?.length||0)} / 9 карт</div>}
                </div>
              </div>
              <div style={{display:'flex',gap:'5px',flexShrink:0}}>
                {hasCards && !preset.is_primary && (
                  <button onClick={()=>setPrimaryDeck(preset.preset_number)} title="Сделать основной"
                    style={{padding:'5px 8px',borderRadius:'7px',background:`${T.orange}15`,border:`1px solid ${T.orange}30`,color:T.orange,fontSize:'14px',cursor:'pointer',lineHeight:1}}>☆</button>
                )}
                <button onClick={() => setEditing({...preset, slots:Array.from({length:9},(_,i)=>preset.card_ids?.[i]||null)})}
                  style={{padding:'6px 12px',background:hasCards?T.purple2:`linear-gradient(135deg,${T.orange},${T.orangeD})`,border:`1px solid ${hasCards?T.purple3:T.orange}`,borderRadius:'9px',color:'white',fontSize:'11px',fontWeight:'700',fontFamily:"'Exo 2',sans-serif",cursor:'pointer',flexShrink:0}}>
                  {hasCards ? 'Ред.' : 'Собрать'}
                </button>
              </div>
            </div>
            {hasCards ? (
              <div style={{display:'grid',gridTemplateColumns:'repeat(9,1fr)',gap:'4px'}}>
                {Array.from({length:9}, (_,i) => <DeckPreviewSlot key={i} cardId={preset.card_ids?.[i]} allCards={allCards}/>)}
              </div>
            ) : (
              <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'42px',border:`1px dashed ${T.grey3}25`,borderRadius:'10px',marginTop:'8px'}}>
                <span style={{fontSize:'12px',color:T.grey3}}>Колода не собрана</span>
              </div>

          </div>
        );
      })}
    </div>
  );
};

const CollectionScreen = ({profile}) => {
  const [tab,          setTab]         = React.useState('decks');
  const [cards,        setCards]       = React.useState([]);
  const [presets,      setPresets]     = React.useState([]);
  const [loading,      setLoading]     = React.useState(true);
  const [sortBy,       setSortBy]      = React.useState('obtained');
  const [selectedCard, setSelectedCard]= React.useState(null);

  const userId = profile?.user_id;

  const loadCards = React.useCallback(async () => {
    setLoading(true);
    try {
      const res = await fetch(_buildAuthUrl('/api/cards/user'));
      if (!res.ok) throw new Error('failed');
      const data = await res.json();
      setCards(data.cards || []);
    } catch(e) { setCards([]); }
    setLoading(false);
  }, [userId]);

  const loadPresets = React.useCallback(async () => {
    try {
      const res = await fetch(_buildAuthUrl('/api/deck/presets'));
      if (!res.ok) throw new Error('failed');
      const data = await res.json();
      setPresets(data.presets || []);
    } catch(e) { setPresets([]); }
  }, [userId]);

  React.useEffect(() => { loadCards(); loadPresets(); }, [loadCards, loadPresets]);

  const sortedCards = React.useMemo(() => {
    const arr = [...cards];
    if      (sortBy==='rarity') arr.sort((a,b) => RARITY_ORDER.indexOf(a.rarity) - RARITY_ORDER.indexOf(b.rarity));
    else if (sortBy==='level')  arr.sort((a,b) => (b.level||1) - (a.level||1));
    else if (sortBy==='power')  arr.sort((a,b) => (b.power||0) - (a.power||0));
    return arr;
  }, [cards, sortBy]);

  // count cards ready to upgrade (for tab badge)
  const upgradeReadyCount = React.useMemo(() =>
    cards.filter(c => (c.level||1) < 10 && (c.particles||0) >= calcUpgradeParticles(c.rarity, c.level||1)).length
  , [cards]);

  // coins from profile (may be undefined for older profile shapes)
  const coins = profile?.coins ?? profile?.balance ?? null;

  const handleCardUpgraded = React.useCallback(() => {
    loadCards();
  }, [loadCards]);

  if (selectedCard) {
    return (
      <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
        <CardDetailScreen card={selectedCard} onBack={()=>setSelectedCard(null)} onCardUpgraded={handleCardUpgraded}/>
      </div>
    );
  }

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden'}}>
      <div style={{display:'flex',background:T.bgDeep,margin:'10px 16px 0',borderRadius:'12px',padding:'3px',gap:'3px',flexShrink:0}}>
        {[
          {id:'decks', label:'Мои колоды'},
          {id:'cards', label:null},
        ].map(t=>{
          const isCards = t.id === 'cards';
          const hasUpgrades = isCards && upgradeReadyCount > 0;
          return (
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{
              flex:1, padding:'9px 4px', borderRadius:'10px',
              background: tab===t.id ? T.purple2 : 'none',
              border: hasUpgrades && tab!==t.id ? '1px solid rgba(245,146,30,0.5)' : 'none',
              color: tab===t.id ? T.white : T.grey2,
              fontSize:'13px', fontWeight: tab===t.id ? '700' : '400',
              fontFamily: "'Exo 2',sans-serif", cursor:'pointer',
              transition:'all 0.15s',
              animation: hasUpgrades && tab!==t.id ? 'yellowPulse 2s ease-in-out infinite' : 'none',
              position:'relative', display:'flex', alignItems:'center', justifyContent:'center',
            }}>
            {isCards ? (
              <span style={{display:'flex',alignItems:'center',gap:'6px'}}>
                <span>Карты{cards.length ? ` (${cards.length})` : ''}</span>
                {hasUpgrades && (
                  <span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',width:'18px',height:'18px',borderRadius:'50%',background:'#ef4444',color:'white',fontSize:'10px',fontWeight:'800',lineHeight:1}}>
                    {upgradeReadyCount}
                  </span>
                )}
              </span>
            ) : t.label}
          </button>
        )})}
      </div>

      {tab === 'cards' && (<>
        <div style={{padding:'6px 16px 0',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div style={{display:'flex',gap:'6px',overflowX:'auto',scrollbarWidth:'none',flex:1}}>
            {[{id:'obtained',label:'Новые'},{id:'rarity',label:'Редкость'},{id:'level',label:'Уровень'},{id:'power',label:'Сила'}].map(s=>(
              <button key={s.id} onClick={()=>setSortBy(s.id)}
                style={{padding:'5px 13px',borderRadius:'16px',background:sortBy===s.id?T.orange:T.bgCard,border:`1px solid ${sortBy===s.id?T.orange:T.purple1}`,color:sortBy===s.id?'white':T.grey2,fontSize:'11px',fontWeight:'600',cursor:'pointer',whiteSpace:'nowrap',fontFamily:"'Exo 2',sans-serif",flexShrink:0,transition:'all 0.15s'}}>
                {s.label}
              </button>
            ))}
          </div>
          {coins !== null && (
            <div style={{display:'flex',alignItems:'center',gap:'4px',marginLeft:'8px',flexShrink:0,background:T.bgCard,borderRadius:'10px',padding:'4px 9px',border:`1px solid ${T.purple1}`}}>
              <span style={{fontSize:'12px'}}>🪙</span>
              <span style={{fontSize:'11px',fontWeight:'700',color:T.orange,fontFamily:"'Exo 2',sans-serif"}}>{Number(coins).toLocaleString()}</span>
            </div>
          )}
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'4px 12px 16px'}}>
          {loading
            ? <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'200px',gap:'10px'}}>
                <div style={{width:'22px',height:'22px',border:`2px solid ${T.purple2}`,borderTopColor:T.purpleLt,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
                <span style={{color:T.grey2,fontSize:'13px'}}>Загружаем коллекцию...</span>
              </div>
            : cards.length === 0
              ? <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'220px',gap:'12px'}}>
                  <div style={{width:'68px',height:'68px',borderRadius:'20px',background:T.bgCard,border:`1px solid ${T.purple1}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'32px',opacity:0.5}}>🃏</div>
                  <span style={{fontSize:'15px',fontWeight:'700',color:T.grey2,fontFamily:"'Exo 2',sans-serif"}}>Коллекция пуста</span>
                  <span style={{fontSize:'12px',color:T.grey3,textAlign:'center',lineHeight:1.6}}>Открывай кейсы в магазине,<br/>чтобы получить карты</span>
                </div>
              : <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',paddingTop:'4px'}}>
                  {sortedCards.map(card => <CardTile key={card.id} card={card} onClick={()=>setSelectedCard(card)}/>)}
                </div>
          }
        </div>
      </>)}

      {tab === 'decks' && (
        <DecksTab presets={presets} allCards={cards} onReload={loadPresets} profile={profile}/>
      )}
    </div>
  );
};

const FriendsScreen = ({onClose, profile}) => {
  const [tab, setTab] = React.useState('friends');
  const [friends, setFriends] = React.useState([]);
  const [friendsLoaded, setFriendsLoaded] = React.useState(false);
  const [opponents, setOpponents] = React.useState([]);
  const [oppLoaded, setOppLoaded] = React.useState(false);
  const [incoming, setIncoming] = React.useState([]);
  const [outgoing, setOutgoing] = React.useState([]);
  const [reqLoaded, setReqLoaded] = React.useState(false);
  const [inviteId, setInviteId] = React.useState(null);
  const [sending, setSending] = React.useState(false);
  const [error, setError] = React.useState(null);
  const [frTargetId, setFrTargetId] = React.useState('');

  const loadAll = () => {
    setFriendsLoaded(false);
    fetch(_buildAuthUrl('/api/friends/list')).then(r=>r.json()).then(d=>{
      setFriends(d.friends||[]);
    }).catch(()=>{}).finally(()=>setFriendsLoaded(true));

    setOppLoaded(false);
    fetch(_buildAuthUrl('/api/recent-opponents')).then(r=>r.json()).then(d=>{
      setOpponents(d.opponents||[]);
    }).catch(()=>{}).finally(()=>setOppLoaded(true));

    setReqLoaded(false);
    fetch(_buildAuthUrl('/api/friends/requests')).then(r=>r.json()).then(d=>{
      setIncoming(d.incoming||[]);
      setOutgoing(d.outgoing||[]);
    }).catch(()=>{}).finally(()=>setReqLoaded(true));
  };

  React.useEffect(()=>{ loadAll(); }, [profile]);

  const sendInvite = async (targetId) => {
    setSending(true); setError(null);
    try {
      const r = await fetch(_buildAuthUrl('/api/friends/invite'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({to_user_id: targetId}),
      });
      const d = await r.json();
      if (d.success) {
        setInviteId(d.invite_id);
        window.showToast('Вызов отправлен! Ожидаем ответа...');
      } else {
        setError(d.error || 'Ошибка');
      }
    } catch(e) { setError('Ошибка сети'); }
    setSending(false);
  };

  const cancelInvite = async () => {
    try {
      await fetch(_buildAuthUrl('/api/friends/invite/cancel'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({invite_id: inviteId}),
      });
      setInviteId(null);
      window.showToast('Вызов отозван');
    } catch(e) {}
  };

  const addFriend = async (addresseeId) => {
    setSending(true); setError(null);
    try {
      const r = await fetch(_buildAuthUrl('/api/friends/request'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({addressee_id: addresseeId}),
      });
      const d = await r.json();
      if (d.success) {
        window.showToast('Заявка отправлена!');
        loadAll();
      } else {
        setError(d.error||'Ошибка');
      }
    } catch(e) { setError('Ошибка сети'); }
    setSending(false);
  };

  const respondToRequest = async (requestId, action) => {
    try {
      const r = await fetch(_buildAuthUrl('/api/friends/request/respond'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({request_id: requestId, action: action}),
      });
      const d = await r.json();
      if (d.success) {
        window.showToast(action==='accept'?'Добавлен в друзья!':'Заявка отклонена');
        loadAll();
      }
    } catch(e) {}
  };

  const cancelRequest = async (requestId) => {
    try {
      await fetch(_buildAuthUrl('/api/friends/request/cancel'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({request_id: requestId}),
      });
      window.showToast('Заявка отозвана');
      loadAll();
    } catch(e) {}
  };

  const removeFriend = async (friendId) => {
    try {

  const [opponents, setOpponents] = React.useState([]);
  const [oppLoaded, setOppLoaded] = React.useState(false);
  const [inviteId,   setInviteId]   = React.useState(null);
  const [sending,    setSending]    = React.useState(false);
  const [error,      setError]      = React.useState(null);

  const loadOpponents = async () => {
    setOppLoaded(false);
    try {
      const r = await fetch(_buildAuthUrl('/api/recent-opponents'));
      const d = await r.json();
      setOpponents(d.opponents || []);
    } catch(e) {}
    setOppLoaded(true);
  };

  React.useEffect(()=>{ loadOpponents(); }, [profile]);

  const sendInvite = async (targetId) => {
    setSending(true); setError(null);
    try {
      const r = await fetch(_buildAuthUrl('/api/friends/invite'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({to_user_id: targetId}),

      if (d.success) {

        setError(d.error || 'Ошибка');

  const cancelInvite = async () => {
    try {
      await fetch(_buildAuthUrl('/api/friends/invite/cancel'), {

        body: JSON.stringify({invite_id: inviteId}),
      });
      setInviteId(null);
      window.showToast('Вызов отозван');

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
      <div style={{flex:1,overflowY:'auto',padding:'16px'}}>
        <div style={{fontSize:'20px',fontWeight:'900',color:T.white,marginBottom:'16px',fontFamily:"'Exo 2',sans-serif"}}>Коммьюнити</div>

        <div style={{fontSize:'15px',fontWeight:'700',color:T.white,marginBottom:'10px'}}>Недавние соперники</div>
        {!oppLoaded ? (
          <div style={{fontSize:'13px',color:T.grey1,textAlign:'center',padding:'20px'}}>Загрузка...</div>
        ) : opponents.length === 0 ? (
          <div style={{fontSize:'13px',color:T.grey2,textAlign:'center',padding:'20px'}}>Пока нет соперников</div>

            <div key={i} style={{display:'flex',alignItems:'center',gap:'10px',background:T.bgCard,border:`1px solid ${T.purple1}22`,borderRadius:'14px',padding:'10px 14px',marginBottom:'8px'}}>

var InviteInput = ({onSend, sending}) => {
  const [targetId, setTargetId] = React.useState('');
  const submit = () => {
    const id = parseInt(targetId.trim(), 10);
    if (!id || id <= 0) return;
    onSend(id);
    setTargetId('');
  };
  return (
    <div style={{display:'flex',gap:'8px'}}>
      <input type="number" value={targetId} onChange={e=>setTargetId(e.target.value)} onKeyDown={e=>e.key==='Enter'&&submit()}

      />
      <button onClick={submit} disabled={sending}
        style={{height:'44px',padding:'0 20px',background:T.orange,border:'none',borderRadius:'12px',color:'white',fontSize:'14px',fontWeight:'700',cursor:sending?'default':'pointer',fontFamily:"'Exo 2',sans-serif",whiteSpace:'nowrap',opacity:sending?0.5:1}}>
        {sending ? '...' : '⚔️ Вызвать на бой'}
      </button>
    </div>
  );
};

var IncomingInviteModal = ({invite, profile, onClose, onStart}) => {
  const [timeLeft, setTimeLeft] = React.useState(300);
  const timerRef = React.useRef(null);

  React.useEffect(()=>{
    const expires = invite.expires_at ? new Date(invite.expires_at).getTime() : Date.now() + 300000;
    const tick = () => {
      const left = Math.max(0, Math.floor((expires - Date.now()) / 1000));
      setTimeLeft(left);
      if (left <= 0) { onClose(); }
      else { timerRef.current = setTimeout(tick, 1000); }
    };
    tick();
    return () => clearTimeout(timerRef.current);
  }, []);

  var respond = async (action) => {
    try {
      const r = await fetch(_buildAuthUrl('/api/friends/invite/respond'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({invite_id: invite.id, action: action}),
      });
      const d = await r.json();
      if (action === 'accept' && d.success && d.match_id) {
        onStart();
        onClose();
        window._playSfx('battle-sound');
        document.getElementById('battle-sound')?.play().catch(function(){});
        window._openPreBattle({
          matchId: d.match_id, userId: profile?.user_id || window._getUserId?.(),
          authData: window.Telegram?.WebApp?.initData || '',
          profile: profile, gameMode: 'friendly',
          opponentName: d.opponent_name, opponentAvatar: d.opponent_avatar_url,
          opponentTrophies: d.opponent_trophies, opponentClan: d.opponent_clan,
        });
      } else {
        onClose();
      }
    } catch(e) {}
  };

  const minutes = Math.floor(timeLeft / 60);
  const seconds = timeLeft % 60;

  return (
    <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.9)',zIndex:400,display:'flex',alignItems:'center',justifyContent:'center',animation:'fadeIn 0.25s'}}>
      <div style={{background:`linear-gradient(180deg,${T.purple2},${T.bgCard})`,border:`2px solid ${T.purple1}`,borderRadius:'24px',padding:'32px 24px 24px',maxWidth:'340px',width:'85%',textAlign:'center',animation:'scaleIn 0.3s cubic-bezier(0.32,0.72,0,1)'}}>
        <div style={{fontSize:'48px',marginBottom:'8px'}}>⚔️</div>
        <div style={{fontSize:'20px',fontWeight:'900',color:T.white,fontFamily:"'Exo 2',sans-serif",marginBottom:'4px'}}>
          {invite.from_username}
        </div>
        <div style={{fontSize:'14px',color:T.grey1,marginBottom:'20px'}}>вызывает тебя на бой!</div>

        <div style={{display:'flex',gap:'10px',marginBottom:'16px'}}>
          <button onClick={()=>respond('accept')}
            style={{flex:1,height:'48px',background:`linear-gradient(135deg,${T.green},#059669)`,border:'none',borderRadius:'14px',color:'white',fontSize:'16px',fontWeight:'900',cursor:'pointer',fontFamily:"'Exo 2',sans-serif"}}>
            Принять
          </button>
          <button onClick={()=>respond('decline')}
            style={{flex:1,height:'48px',background:T.bgCard,border:`1px solid ${T.red}66`,borderRadius:'14px',color:T.red,fontSize:'16px',fontWeight:'700',cursor:'pointer',fontFamily:"'Exo 2',sans-serif"}}>
            Отклонить
          </button>
        </div>

        <div style={{fontSize:'13px',color:T.grey2}}>Истекает через {minutes}:{String(seconds).padStart(2,'0')}</div>
      </div>
    </div>
  );
};

const MailScreen = ({onClose, userId}) => {
  const [mails,     setMails]     = React.useState([]);
  const [loading,   setLoading]   = React.useState(true);
  const [selected,  setSelected]  = React.useState(null);
  const [filterCat, setFilterCat] = React.useState(null);

  const initData = window.Telegram?.WebApp?.initData || '';

  const loadMail = React.useCallback(async () => {
    setLoading(true);
    try {
      let url = '/api/mail';
      const p = new URLSearchParams();
      if (initData) p.set('_auth', initData);
      else if (userId) p.set('user_id', userId);
      if (filterCat) p.set('category', filterCat);
      p.set('limit', '50');
      url += '?' + p.toString();
      const res = await fetch(url);
      if (!res.ok) throw new Error('failed');
      const data = await res.json();
      setMails(data.mail || []);
    } catch(e) { setMails([]); }
    setLoading(false);
  }, [userId, filterCat, initData]);

  React.useEffect(() => { loadMail(); }, [loadMail]);

  const markRead = async (mail) => {
    if (mail.is_read) return;
    try {
      let url = '/api/mail/read';
      if (initData) url += '?_auth=' + encodeURIComponent(initData);
      else if (userId) url += '?user_id=' + userId;
      await fetch(url, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({mail_id: mail.id || mail.mail_id}),
      });
      setMails(prev => prev.map(m => m.id === mail.id ? {...m, is_read:true} : m));
    } catch(e){}
  };

  const openMail = (mail) => {
    setSelected(mail);
    markRead(mail);
  };

  const unreadCount = mails.filter(m=>!m.is_read).length;
  const categories = [...new Set(mails.map(m=>m.category))].filter(Boolean);

  const fmtDate = (iso) => {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return 'только что';
      if (diff < 3600) return Math.floor(diff/60) + ' мин назад';
      if (diff < 86400) return Math.floor(diff/3600) + ' ч назад';
      return d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'});
    } catch(e) { return ''; }
  };

  // Детальный вид письма
  if (selected) {
    const catIcon = MAIL_CATEGORY_ICONS[selected.category] || '📬';
    return (
      <div style={{position:'absolute',inset:0,background:T.bg,zIndex:31,display:'flex',flexDirection:'column',animation:'fadeIn 0.2s'}}>
        <div style={{height:'52px',background:'rgba(15,10,26,0.98)',display:'flex',alignItems:'center',gap:'10px',padding:'0 16px',flexShrink:0,borderBottom:`1px solid ${T.purple1}`}}>
          <button onClick={()=>setSelected(null)} style={{width:'32px',height:'32px',borderRadius:'10px',background:T.bgCard,border:`1px solid ${T.purple1}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7L9 11" stroke={T.grey2} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <span style={{fontSize:'15px',fontWeight:'700',color:T.white,fontFamily:"'Exo 2',sans-serif",overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{selected.subject}</span>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'16px'}}>
          <div style={{background:T.bgCard,borderRadius:'16px',padding:'16px',border:`1px solid ${T.purple1}`,marginBottom:'12px'}}>
            <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'10px'}}>
              <div style={{width:'38px',height:'38px',borderRadius:'10px',background:T.purple1,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px',flexShrink:0}}>
                {selected.icon || catIcon}
              </div>
              <div>
                <div style={{fontSize:'13px',fontWeight:'600',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>{selected.sender || 'Система'}</div>
                <div style={{fontSize:'11px',color:T.grey3,marginTop:'1px'}}>{fmtDate(selected.created_at)}</div>
              </div>
              {selected.category && (
                <div style={{marginLeft:'auto',fontSize:'10px',color:T.grey2,background:T.purple1,borderRadius:'6px',padding:'2px 8px',fontWeight:'600',fontFamily:"'Exo 2',sans-serif"}}>
                  {MAIL_CATEGORY_LABELS[selected.category] || selected.category}
                </div>
              )}
            </div>
            <div style={{height:'1px',background:T.purple1,margin:'10px 0'}}/>
            <div style={{fontSize:'13px',color:T.grey1,lineHeight:1.65,whiteSpace:'pre-wrap'}}>{selected.content || selected.text || '—'}</div>
            {selected.attachments && Object.keys(selected.attachments).length > 0 && (
              <div style={{marginTop:'14px',padding:'12px',background:`${T.orange}08`,border:`1px solid ${T.orange}30`,borderRadius:'12px'}}>
                <div style={{fontSize:'11px',color:T.orange,fontWeight:'700',textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'6px'}}>Вложения</div>

              </div>
            )}

        </div>

    );
  }

  return (
    <div style={{position:'absolute',inset:0,background:T.bg,zIndex:31,display:'flex',flexDirection:'column',animation:'fadeIn 0.2s'}}>
      {/* Header */}
      <div style={{height:'52px',background:'rgba(15,10,26,0.98)',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 16px',flexShrink:0,borderBottom:`1px solid ${T.purple1}`}}>
        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          <button onClick={onClose} style={{width:'32px',height:'32px',borderRadius:'10px',background:T.bgCard,border:`1px solid ${T.purple1}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7L9 11" stroke={T.grey2} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <span style={{fontSize:'16px',fontWeight:'800',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>Почта</span>
          {unreadCount > 0 && (
            <div style={{background:T.orange,borderRadius:'10px',padding:'1px 7px',fontSize:'11px',fontWeight:'700',color:'white',fontFamily:"'Exo 2',sans-serif"}}>{unreadCount}</div>
          )}
        </div>
        <button onClick={loadMail} style={{width:'32px',height:'32px',borderRadius:'10px',background:T.bgCard,border:`1px solid ${T.purple1}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer'}}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" style={{animation:loading?'spin 0.8s linear infinite':undefined}}><path d="M12 7A5 5 0 1 1 7 2" stroke={T.grey1} strokeWidth="1.5" strokeLinecap="round"/><path d="M7 2l2-2M7 2l2 2" stroke={T.grey1} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
      </div>

      {/* Category filter */}
      {categories.length > 1 && (
        <div style={{padding:'8px 16px',display:'flex',gap:'6px',overflowX:'auto',scrollbarWidth:'none',flexShrink:0,borderBottom:`1px solid ${T.purple1}`}}>
          <button onClick={()=>setFilterCat(null)} style={{padding:'5px 12px',borderRadius:'16px',background:filterCat===null?T.orange:T.bgCard,border:`1px solid ${filterCat===null?T.orange:T.purple1}`,color:filterCat===null?'white':T.grey2,fontSize:'11px',fontWeight:'600',cursor:'pointer',whiteSpace:'nowrap',fontFamily:"'Exo 2',sans-serif"}}>Все</button>
          {categories.map(cat=>(
            <button key={cat} onClick={()=>setFilterCat(cat===filterCat?null:cat)} style={{padding:'5px 12px',borderRadius:'16px',background:filterCat===cat?T.orange:T.bgCard,border:`1px solid ${filterCat===cat?T.orange:T.purple1}`,color:filterCat===cat?'white':T.grey2,fontSize:'11px',fontWeight:'600',cursor:'pointer',whiteSpace:'nowrap',fontFamily:"'Exo 2',sans-serif"}}>
              {MAIL_CATEGORY_ICONS[cat]||'📬'} {MAIL_CATEGORY_LABELS[cat]||cat}
            </button>
          ))}
        </div>
      )}

      {/* List */}
      <div style={{flex:1,overflowY:'auto',padding:'8px 16px',display:'flex',flexDirection:'column',gap:'6px'}}>
        {loading ? (
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',flex:1,gap:'10px'}}>
            <div style={{width:'22px',height:'22px',border:`2px solid ${T.purple2}`,borderTopColor:T.purpleLt,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
            <span style={{color:T.grey2,fontSize:'13px'}}>Загружаем письма...</span>
          </div>
        ) : mails.length === 0 ? (
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',flex:1,gap:'10px',padding:'40px 0'}}>
            <div style={{fontSize:'40px',opacity:0.4}}>📭</div>
            <span style={{fontSize:'15px',fontWeight:'700',color:T.grey2,fontFamily:"'Exo 2',sans-serif"}}>Писем нет</span>
            <span style={{fontSize:'12px',color:T.grey3,textAlign:'center'}}>Здесь будут награды и сообщения от системы</span>
          </div>
        ) : mails.map(mail => (
          <button key={mail.id} onClick={()=>openMail(mail)}
            style={{display:'flex',gap:'11px',padding:'12px 14px',background:mail.is_read?T.bgCard:`linear-gradient(135deg,${T.purple1},${T.bgCard})`,border:`1px solid ${mail.is_read?T.purple1:T.purpleHL}`,borderRadius:'14px',cursor:'pointer',textAlign:'left',transition:'all 0.15s',position:'relative',overflow:'hidden'}}>
            {!mail.is_read && <div style={{position:'absolute',top:0,left:0,bottom:0,width:'3px',background:T.purpleLt,borderRadius:'3px 0 0 3px'}}/>}
            <div style={{width:'40px',height:'40px',borderRadius:'10px',background:mail.is_read?T.purple1:`linear-gradient(135deg,${T.purple2},${T.purple3})`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px',flexShrink:0}}>{mail.icon||MAIL_CATEGORY_ICONS[mail.category]||'📬'}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'2px'}}>
                <span style={{fontSize:'13px',fontWeight:mail.is_read?'500':'700',color:T.white,fontFamily:"'Exo 2',sans-serif",overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{mail.subject}</span>
                <span style={{fontSize:'10px',color:T.grey3,flexShrink:0,marginLeft:'6px'}}>{fmtDate(mail.created_at)}</span>
              </div>
              <div style={{fontSize:'11px',color:T.grey2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{mail.sender || 'Система'}</div>
              {mail.attachments && <AttachmentBadge attachments={mail.attachments}/>}
            </div>
          </button>
        ))}
      </div>
    </div>
  );
};

// PRE-BATTLE VS SCREEN

const PreBattleScreen = ({data, onClose}) => {
  const [countdown, setCountdown] = React.useState(3);
  const timerRef = React.useRef(null);

  React.useEffect(() => {
    timerRef.current = setInterval(() => {
      setCountdown(c => {
        if (c <= 1) { clearInterval(timerRef.current); return 0; }
        return c - 1;
      });
    }, 1000);
    return () => clearInterval(timerRef.current);
  }, []);

  React.useEffect(() => {
    if (countdown <= 0 && data) {
      const authParam = data.authData ? '&_auth=' + encodeURIComponent(data.authData) : '';
      window.location.href = location.origin + '/arena?id=' + encodeURIComponent(data.matchId) + authParam;
    }
  }, [countdown, data]);

  const profile = data?.profile || {};
  const playerName = profile?.custom_nickname || profile?.display_name || profile?.nickname || profile?.first_name || profile?.username || 'Вы';
  const playerAvatar = profile?.avatar_url || profile?.img || profile?.photo_url;
  const playerTrophies = profile?.trophies || 0;
  const playerClan = profile?.clan || profile?.clan_name || '';

  const opponentName = data?.opponentName || 'Соперник';
  const opponentAvatar = data?.opponentAvatar;
  const opponentTrophies = data?.opponentTrophies || 0;
  const opponentClan = data?.opponentClan || '';

  const gameMode = data?.gameMode || 'classic';
  const modifierLabel = gameMode === 'extra_arena:blitz' ? {icon:'⚡', text:'Блиц'} : gameMode === 'extra_arena:draft' ? {icon:'🃏', text:'Драфт'} : null;
  const isBlitz = gameMode === 'extra_arena:blitz';
  const isExtra = gameMode.startsWith('extra_arena');

  const handleTap = () => {
    clearInterval(timerRef.current);
    if (data) {
      const authParam = data.authData ? '&_auth=' + encodeURIComponent(data.authData) : '';
      window.location.href = location.origin + '/arena?id=' + encodeURIComponent(data.matchId) + authParam;
    }
  };

  const vsAccent = isBlitz ? T.orange : isExtra ? '#c084fc' : T.purpleHL;
  const vsAccentBg = isBlitz ? T.orangeD : T.purple3;
  const vsAccentBorder = isBlitz ? T.orangeLt : T.purpleLt;

  const PlayerCard = ({name, avatar, trophies, clan, accentColor, accentBg}) => (
    <div style={{display:'flex',alignItems:'center',gap:'14px',padding:'10px 20px',background:'linear-gradient(135deg,rgba(26,16,48,0.8),rgba(19,13,38,0.6))',border:'1px solid ' + accentColor + '22',borderRadius:'16px',minWidth:'200px',animation:'fadeIn 0.4s ease'}}>
      <div style={{position:'relative',flexShrink:0}}>
        <div style={{position:'absolute',inset:'-4px',borderRadius:'50%',background:'radial-gradient(circle,' + accentColor + '30,transparent 70%)',animation:'preBattleBgPulse 2.5s ease-in-out infinite'}}/>
        {avatar ? (
          <div style={{width:'52px',height:'52px',borderRadius:'50%',border:'2px solid ' + accentColor,overflow:'hidden',backgroundImage:'url(' + avatar + ')',backgroundSize:'cover',backgroundPosition:'center',boxShadow:'0 0 16px ' + accentColor + '22',flexShrink:0}}/>
        ) : (
          <div style={{width:'52px',height:'52px',borderRadius:'50%',border:'2px solid ' + accentColor,background:'linear-gradient(135deg,' + accentColor + '20,' + accentColor + '08)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px',fontWeight:'900',color:accentColor,fontFamily:"'Exo 2',sans-serif",boxShadow:'0 0 16px ' + accentColor + '22',flexShrink:0}}>{name.charAt(0).toUpperCase()}</div>
        )}
      </div>
      <div style={{textAlign:'left',overflow:'hidden',flex:1}}>
        <div style={{fontSize:'15px',fontWeight:'900',color:T.white,fontFamily:"'Exo 2',sans-serif",whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis',maxWidth:'140px'}}>{name}</div>
        {clan && <div style={{fontSize:'10px',color:accentColor,fontWeight:'700',padding:'1px 8px',background:accentBg + '15',borderRadius:'4px',display:'inline-block',marginTop:'3px',maxWidth:'120px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{clan}</div>}
        <div style={{display:'flex',alignItems:'center',gap:'3px',fontSize:'11px',fontWeight:'800',color:T.orange,fontFamily:"'Exo 2',sans-serif",marginTop:'4px'}}><span style={{fontSize:'12px'}}>🏆</span> {trophies.toLocaleString()}</div>
      </div>
    </div>
  );

  return (
    <div onClick={handleTap} style={{position:'fixed',inset:0,zIndex:21000,background:'linear-gradient(180deg,rgba(4,2,12,0.98) 0%,rgba(10,7,20,0.97) 50%,rgba(16,10,28,0.96) 100%)',backdropFilter:'blur(28px)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px',animation:'fadeIn 0.3s ease',cursor:'pointer'}}>
      {/* Animated orbs */}
      <div style={{position:'absolute',inset:0,pointerEvents:'none',overflow:'hidden'}}>
        <div style={{position:'absolute',top:'10%',left:'5%',width:'200px',height:'200px',borderRadius:'50%',background:'radial-gradient(circle,' + vsAccent + '12,transparent 70%)',animation:'preBattleBgPulse 3.5s ease-in-out infinite'}}/>
        <div style={{position:'absolute',bottom:'18%',right:'5%',width:'180px',height:'180px',borderRadius:'50%',background:'radial-gradient(circle,' + vsAccent + '0a,transparent 70%)',animation:'preBattleBgPulse 4s ease-in-out infinite',animationDelay:'1s'}}/>
        <div style={{position:'absolute',top:'45%',left:'50%',width:'280px',height:'280px',borderRadius:'50%',background:'radial-gradient(circle,' + vsAccent + '06,transparent 70%)',transform:'translate(-50%,-50%)',animation:'preBattleBgPulse 5s ease-in-out infinite',animationDelay:'2s'}}/>
      </div>

      {/* Player */}
      <div style={{position:'relative',zIndex:1,marginBottom:'12px'}}>
        <PlayerCard name={playerName} avatar={playerAvatar} trophies={playerTrophies} clan={playerClan} accentColor={T.purpleHL} accentBg={T.purpleHL}/>
      </div>

      {/* VS + modifier */}
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'10px',position:'relative',zIndex:1,margin:'8px 0 12px'}}>
        <div style={{position:'relative'}}>
          <div style={{position:'absolute',inset:'-10px',borderRadius:'50%',background:vsAccent,opacity:0.15,filter:'blur(18px)',animation:'preBattleVsGlow 2s ease-in-out infinite'}}/>
          <div style={{position:'absolute',inset:'-5px',borderRadius:'50%',background:vsAccent,opacity:0.25,filter:'blur(10px)',animation:'pulse 1.8s ease-in-out infinite'}}/>
          <div style={{width:'68px',height:'68px',borderRadius:'50%',background:'linear-gradient(135deg,' + vsAccentBg + ',' + vsAccent + ')',border:'2px solid ' + vsAccentBorder,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px',fontWeight:'900',color:'white',fontFamily:"'Exo 2',sans-serif",boxShadow:'0 0 24px ' + vsAccent + '44',position:'relative',zIndex:1}}>VS</div>
          {/* Orbit ring 1 — clockwise */}
          <svg style={{position:'absolute',top:'-12px',left:'-12px',width:'92px',height:'92px',pointerEvents:'none',animation:'rotateSlow 9s linear infinite'}} viewBox="0 0 92 92" fill="none">
            <circle cx="46" cy="46" r="42" stroke={vsAccent} strokeWidth="0.6" strokeDasharray="5 7" opacity="0.35"/>
          </svg>
          {/* Orbit ring 2 — counter-clockwise */}
          <svg style={{position:'absolute',top:'-18px',left:'-18px',width:'104px',height:'104px',pointerEvents:'none',animation:'rotateSlow 13s linear infinite reverse'}} viewBox="0 0 104 104" fill="none">
            <circle cx="52" cy="52" r="47" stroke={vsAccent} strokeWidth="0.4" strokeDasharray="3 9" opacity="0.22"/>
          </svg>
        </div>
        {modifierLabel && (
          <div style={{background:isBlitz ? T.orange + '15' : 'rgba(192,132,252,0.15)',border:'1px solid ' + (isBlitz ? T.orange : '#c084fc') + '44',borderRadius:'10px',padding:'4px 12px',fontSize:'12px',fontWeight:'700',color:isBlitz ? T.orangeLt : '#c084fc',fontFamily:"'Exo 2',sans-serif",display:'flex',alignItems:'center',gap:'5px'}}>
            <span style={{fontSize:'14px'}}>{modifierLabel.icon}</span>
            <span>{modifierLabel.text}</span>
          </div>
        )}
      </div>

      {/* Opponent */}
      <div style={{position:'relative',zIndex:1,marginBottom:'20px'}}>
        <PlayerCard name={opponentName} avatar={opponentAvatar} trophies={opponentTrophies} clan={opponentClan} accentColor={T.orange} accentBg={T.orange}/>
      </div>

      {/* Countdown */}
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:'8px',position:'relative',zIndex:1}}>
        <div key={countdown} style={{
          fontSize:'60px',fontWeight:'900',
          color:countdown===0?T.orange:T.white,
          fontFamily:"'Exo 2',sans-serif",
          textShadow:countdown===0?'0 0 36px ' + T.orange + '88, 0 0 72px ' + T.orange + '22':'0 0 20px ' + T.purpleHL + '18',
          animation: countdown>0?'countBounce 0.5s cubic-bezier(0.32,0.72,0,1)':'popIn 0.45s cubic-bezier(0.32,0.72,0,1)',
          lineHeight:1,
          display:'flex',alignItems:'center',justifyContent:'center'
        }}>
          {countdown > 0 ? countdown : <img src={ICONS.battle} alt="" style={{width:'50px',height:'50px',filter:'brightness(0) saturate(100%) invert(63%) sepia(83%) saturate(4559%) hue-rotate(1deg) brightness(103%)'}}/>}
        </div>
        <div style={{fontSize:'14px',fontWeight:'600',color:T.grey1,fontFamily:'Inter,sans-serif',letterSpacing:'0.6px'}}>
          {countdown > 0 ? 'Бой начнётся через' : 'В бой!'}
        </div>
        <div style={{fontSize:'11px',color:T.grey3,fontFamily:'Inter,sans-serif',marginTop:'2px'}}>
          Нажмите чтобы начать сейчас
        </div>
      </div>

      {/* Cancel */}
      <div onClick={e=>{e.stopPropagation(); clearInterval(timerRef.current); onClose();}} style={{position:'absolute',bottom:'42px',left:0,right:0,textAlign:'center',fontSize:'13px',color:T.grey2,cursor:'pointer',fontFamily:'Inter,sans-serif',zIndex:1}}>Отмена</div>
    </div>
  );
};

// BATTLE HISTORY SHEET
// ═══════════════════════════════════════════
const BattleHistorySheet = ({onClose, profile}) => {
  const [battles, setBattles] = React.useState([]);
  const [limit, setLimit] = React.useState(10);
  const [isLimited, setIsLimited] = React.useState(true);
  const [loading, setLoading] = React.useState(true);
  const [filter, setFilter] = React.useState('all');
  const [showTraining, setShowTraining] = React.useState(false);

  const load = async () => {
    setLoading(true);
    try {
      const r = await fetch(_buildAuthUrl('/api/battles/history'));
      const d = await r.json();
      setBattles(d.battles || []);
      setLimit(d.limit || 10);
      setIsLimited(d.is_limited !== undefined ? d.is_limited : true);
    } catch(e) {}
    setLoading(false);
  };

  React.useEffect(()=>{ load(); }, [profile]);

  const modeLabels = {
    classic: 'Classic',
    'extra_arena:blitz': 'ExtraArena · Blitz',
    'extra_arena:draft': 'ExtraArena · Draft',
    friendly: 'Friendly',
    training: 'Тренировка',
    pvp: 'Classic',
    blitz: 'ExtraArena · Blitz',
    draft: 'ExtraArena · Draft',
  };

  const formatDuration = (seconds) => {
    if (!seconds || seconds <= 0) return null;
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}:${s.toString().padStart(2,'0')}`;
  };

  const formatDate = (iso) => {
    try {
      const d = new Date(iso);
      const dd = d.toLocaleDateString('ru-RU', {day:'2-digit',month:'2-digit',year:'2-digit'});
      const tt = d.toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
      return `${dd} ${tt}`;
    } catch(e) { return iso; }
  };

  const now = Date.now();
  const sevenDaysAgo = now - 7 * 24 * 3600 * 1000;
  const weeklyDelta = battles
    .filter(b => new Date(b.created_at).getTime() >= sevenDaysAgo
                 && b.mode !== 'friendly' && b.mode !== 'training')
    .reduce((sum, b) => sum + (b.trophies_change || 0), 0);
  const maxTrophies = profile?.max_trophies ?? null;
  const parseTs = s => { if (!s) return 0; return new Date(String(s).replace(' ','T')).getTime() || 0; };
  const sortedBattles = [...battles].sort((a, b) => parseTs(b.created_at) - parseTs(a.created_at));
  let visibleBattles = filter === 'all'
    ? sortedBattles
    : sortedBattles.filter(b => b.result === filter);
  if (!showTraining) visibleBattles = visibleBattles.filter(b => b.mode !== 'training' && b.mode !== 'friendly');

  return (
    <div style={{position:'absolute',inset:0,background:T.bg,zIndex:200,display:'flex',flexDirection:'column',animation:'fadeIn 0.25s'}}>
      <div style={{height:'52px',background:'rgba(15,10,26,0.98)',display:'flex',alignItems:'center',gap:'10px',padding:'0 16px',flexShrink:0,borderBottom:`1px solid ${T.purple1}`}}>
        <button onClick={onClose} style={{width:'32px',height:'32px',borderRadius:'10px',background:T.bgCard,border:`1px solid ${T.purple1}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7L9 11" stroke={T.grey2} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
        <span style={{fontSize:'15px',fontWeight:'700',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>История боёв</span>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'12px 16px 20px'}}>
        {loading ? (
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'200px',gap:'10px'}}>
            <div style={{width:'22px',height:'22px',border:`2px solid ${T.purple2}`,borderTopColor:T.purpleLt,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
            <span style={{color:T.grey2,fontSize:'13px'}}>Загружаем историю...</span>
          </div>
        ) : (
          <>
            {isLimited && (
              <div style={{background:`linear-gradient(135deg,${T.orangeD}22,${T.orange}33)`,border:`1px solid ${T.orange}44`,borderRadius:'14px',padding:'12px 14px',marginBottom:'14px',display:'flex',alignItems:'center',gap:'10px'}}>
                <span style={{fontSize:'16px',flexShrink:0}}>🔒</span>
                <span style={{fontSize:'12px',color:T.orangeLt,fontWeight:'600',lineHeight:1.5}}>ExtraPass Ultra открывает полную историю (50 боёв)</span>
              </div>
            )}

            {battles.length > 0 && (
              <>
                <div style={{display:'flex',gap:'8px',marginBottom:'12px'}}>
                  {maxTrophies != null && (
                    <div style={{flex:1,background:T.bgCard,border:`1px solid ${T.purple1}`,
                                 borderRadius:'12px',padding:'8px 12px',textAlign:'center'}}>
                      <div style={{fontSize:'10px',color:T.grey2,marginBottom:'2px'}}>Рекорд</div>
                      <div style={{fontSize:'15px',fontWeight:'800',color:T.orange,fontFamily:"'Exo 2',sans-serif"}}>
                        {maxTrophies} 🏆
                      </div>
                    </div>
                  )}
                  {battles.length > 0 && (
                    <div style={{flex:1,background:T.bgCard,border:`1px solid ${T.purple1}`,
                                 borderRadius:'12px',padding:'8px 12px',textAlign:'center'}}>
                      <div style={{fontSize:'10px',color:T.grey2,marginBottom:'2px'}}>За 7 дней</div>
                      <div style={{fontSize:'15px',fontWeight:'800',
                                   color:weeklyDelta>=0?'#22c55e':'#ef4444',
                                   fontFamily:"'Exo 2',sans-serif"}}>
                        {weeklyDelta>0?'+':''}{weeklyDelta} 🏆
                      </div>
                    </div>
                  )}
                </div>

                <div style={{display:'flex',gap:'6px',marginBottom:'10px'}}>
                  {[['all','Все'],['win','Победы'],['lose','Поражения'],['draw','Ничья']].map(([val,lbl])=>(
                    <button key={val} onClick={()=>setFilter(val)} style={{
                      flex:1,padding:'5px 4px',borderRadius:'10px',border:'none',cursor:'pointer',
                      fontSize:'10px',fontWeight:'600',
                      background: filter===val ? T.purple3 : T.bgCard,
                      color: filter===val ? T.white : T.grey2,
                      transition:'all 0.15s'

// ── Analytics Controller ──
const AnalyticsController = (() => {
  let _sessionId = null;
  let _screens = [];
  let _battlesPlayed = 0;
  let _casesOpened = 0;
  let _lastUpdate = 0;
  let _updateTimer = null;
  let _ended = false;

  const _getSessionId = () => {
    if (_sessionId) return _sessionId;
    try { _sessionId = sessionStorage.getItem('ea_session_id'); } catch(e) {}
    if (!_sessionId) {
      _sessionId = (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : (Date.now() + '_' + Math.random().toString(36).slice(2, 10));
      try { sessionStorage.setItem('ea_session_id', _sessionId); } catch(e) {}
    }
    return _sessionId;
  };

  const _apiUrl = (path) => {
    const tg = window.Telegram?.WebApp;
    if (tg?.initData) return path + '?_auth=' + encodeURIComponent(tg.initData);
    const uid = window._getUserId?.() || (window.Telegram?.WebApp?.initDataUnsafe?.user?.id);
    if (uid) return path + '?user_id=' + uid;
    return path;
  };

  const _postJSON = (path, body) => {
    const url = _apiUrl(path);
    if (!url) return;
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive: true }).catch(() => {});
  };

  const _flushUpdate = () => {
    if (_ended) return;
    _lastUpdate = Date.now();
    _postJSON('/api/analytics/session/update', {
      session_id: _getSessionId(),
      screens_visited: _screens.slice(-200),
      battles_played: _battlesPlayed,
      cases_opened: _casesOpened
    });
  };

  const _scheduleUpdate = () => {
    if (_ended) return;
    const now = Date.now();
    if (_updateTimer) clearTimeout(_updateTimer);
    if (now - _lastUpdate > 25000) { _flushUpdate(); return; }
    _updateTimer = setTimeout(_flushUpdate, 3000);
  };

  const _sendEnd = () => {
    if (_ended) return;
    _ended = true;
    if (_updateTimer) clearTimeout(_updateTimer);
    const body = JSON.stringify({
      session_id: _getSessionId(),
      screens_visited: _screens.slice(-200),
      battles_played: _battlesPlayed,
      cases_opened: _casesOpened
    });
    const url = _apiUrl('/api/analytics/session/end');
    if (!url) return;
    try {
      const blob = new Blob([body], { type: 'application/json' });
      navigator.sendBeacon(url, blob);
    } catch(e) {
      _postJSON('/api/analytics/session/end', body);
    }
  };

  // lifecycle
  if (typeof window !== 'undefined') {
    window.addEventListener('pagehide', _sendEnd);
    window.addEventListener('beforeunload', _sendEnd);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') _sendEnd();
    });
    setInterval(() => {
      if (!_ended && document.visibilityState === 'visible' && Date.now() - _lastUpdate > 25000) _flushUpdate();
    }, 30000);
  }

  return {
    start: () => {
      _postJSON('/api/analytics/session/start', { session_id: _getSessionId(), source: 'telegram_webapp' });
    },

    screen: (name) => {
      if (!name || (_screens.length && _screens[_screens.length - 1].screen === name)) return;
      _screens.push({ screen: name, ts: Date.now() });
      if (_screens.length > 250) _screens = _screens.slice(-200);
      _scheduleUpdate();
    },

    battlePlayed: () => { _battlesPlayed++; _scheduleUpdate(); },
    caseOpened: () => { _casesOpened++; _scheduleUpdate(); },

    onboarding: (step, completed, timeSpentSeconds, meta) => {
      _postJSON('/api/analytics/onboarding', { step, completed, time_spent_seconds: timeSpentSeconds, metadata: meta || {} });
    },

    end: _sendEnd,
  };
})();

window.__analytics = AnalyticsController;
