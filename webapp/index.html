  const isUltra = profile?.extra_pass === 'ultra';

  const canHideId = hasExtraPass || isUltra;

  React.useEffect(() => {
    setCosmeticsLoading(true);
    fetch(apiUrl('/api/cosmetics/owned'))
      .then(r => r.json())
      .then(data => {
        setCosmeticsData(data);
        if (data.equipped?.avatar)             setSelectedAvatar(String(data.equipped.avatar.id));
        if (data.equipped?.profile_background) setSelectedBackground(String(data.equipped.profile_background.id));
        if (data.equipped?.title)              setSelectedTitle(String(data.equipped.title.id));
      })
      .catch(() => {})
      .finally(() => setCosmeticsLoading(false));
  }, [profile?.user_id]);

  // itemsByType: API first, MOCK fallback
  const itemsByType = (type) => {
    if (cosmeticsData?.items) {
      return cosmeticsData.items
        .filter(c => c.item_type === type)
        .map(c => ({
          id: String(c.id),
          type: c.item_type,
          class: c.class,
          name: c.name,
          owned: true,
          asset_path: c.asset_path,
          media_type: c.media_type,
          has_sound: c.has_sound,
          animated: c.media_type === 'gif' || c.media_type === 'video',
        }));
    }
    return MOCK_COSMETICS.filter(c => c.type === type);
  };

  const selectedItem = (type) => {
    const id = type==='avatar'?selectedAvatar:type==='profile_background'?selectedBackground:selectedTitle;
    return itemsByType(type).find(c => String(c.id) === String(id)) || null;
  };

  const handleSelect = (item) => {
    if (item.type === 'avatar') setSelectedAvatar(String(item.id));
    else if (item.type === 'profile_background') {
      setSelectedBackground(String(item.id));
      setIsMuted(true);
    }
    else setSelectedTitle(String(item.id));
    setPickerType(null);

    if (!item.owned) return;

    // Реальный предмет из API (числовой id) — сохранить на бэк
    if (cosmeticsData && !isNaN(Number(item.id))) {
      fetch(apiUrl('/api/cosmetics/equip'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({cosmetic_id: Number(item.id)}),
      })
      .then(r => r.json())
      .then(d => {
        if (d.success) window.showToast(`"${item.name}" надет`, 'success', 2000);
        else window.showToast(d.error || 'Ошибка', 'error');
      })
      .catch(() => window.showToast('Ошибка сети', 'error'));
    } else {
      window.showToast(`"${item.name}" надет`, 'success', 2000);
    }
  };

  const handleRandom = () => {
    const pick = (type) => {
      const allOwned = itemsByType(type).filter(c => c.owned);
      const nonStarter = allOwned.filter(c => c.class !== 'starter');
      const pool = randomIgnoreStarters && nonStarter.length > 0 ? nonStarter : allOwned;
      return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
    };
    const equip = (item) => {
      if (cosmeticsData && !isNaN(Number(item.id))) {
        fetch(apiUrl('/api/cosmetics/equip'), {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cosmetic_id:Number(item.id)})}).catch(()=>{});
      }
    };
    const av = pick('avatar'), bg = pick('profile_background'), ti = pick('title');
    if (av) { setSelectedAvatar(String(av.id)); equip(av); }
    if (bg) { setSelectedBackground(String(bg.id)); setIsMuted(true); equip(bg); }
    if (ti) { setSelectedTitle(String(ti.id)); equip(ti); }
    window.showToast('Случайный образ!', 'success', 2000);
  };

  // True если у игрока есть хотя бы 1 нестартовый предмет хотя бы в одной категории
  const hasAnyNonStarter = ['avatar','profile_background','title'].some(type =>
    itemsByType(type).filter(c => c.owned && c.class !== 'starter').length > 0
  );

  const slotMeta = (type) => {
    const sel = selectedItem(type);
    const meta = sel ? COSMETIC_CLASS_META[sel.class] : COSMETIC_CLASS_META.starter;
    return {name: sel?.name||'Базовый', classLabel: meta.label, color: meta.color, bg: meta.bg, border: meta.border};
  };

  const bgItem = selectedItem('profile_background');
  const bgClass = bgItem ? COSMETIC_CLASS_META[bgItem.class] : COSMETIC_CLASS_META.starter;
  const titleItem = selectedItem('title');
  const titleMeta = titleItem ? COSMETIC_CLASS_META[titleItem.class] : COSMETIC_CLASS_META.starter;
  const equippedAvatarItem = selectedItem('avatar');

  const getTitleDisplayStyle = () => {
    if (!titleItem) return {color: T.grey2};
    switch (titleItem.class) {
      case 'mythic':
        return {color:'#ef4444', textShadow:'0 0 18px #ef444499, 0 0 6px #ef444466'};
      case 'limited':
        return {
          background:'linear-gradient(90deg,#22d3ee,#f0abfc,#22d3ee)',
          backgroundSize:'200% auto',
          WebkitBackgroundClip:'text',
          WebkitTextFillColor:'transparent',
          backgroundClip:'text',
          animation:'titleShimmer 3s linear infinite',
        };
      default:
        return {color: T.white};
    }
  };

  const getCardNicknameStyle = () => {
    if (glowDisabled) return {color: T.white};
    if (isUltra) return {
      background:'linear-gradient(90deg,#22d3ee,#f0abfc,#22d3ee)',
      backgroundSize:'200% auto',
      WebkitBackgroundClip:'text',
      WebkitTextFillColor:'transparent',
      backgroundClip:'text',
      animation:'titleShimmer 3s linear infinite',
    };
    if (hasExtraPass) return {color:'#fbbf24', textShadow:'0 0 12px #fbbf2455'};
    return {color: T.white};
  };

  const formatMemberSince = (isoDate) => {
    if (!isoDate) return null;
    const reg = new Date(isoDate);
    const now = new Date();
    let years = now.getFullYear() - reg.getFullYear();
    let months = now.getMonth() - reg.getMonth();
    if (months < 0) { years--; months += 12; }
    if (years === 0 && months === 0) return 'Ты с нами меньше месяца';
    const yStr = years > 0 ? `${years} ${years===1?'год':years<5?'года':'лет'}` : '';
    const mStr = months > 0 ? `${months} ${months===1?'месяц':months<5?'месяца':'месяцев'}` : '';
    return `Ты с нами уже ${[yStr,mStr].filter(Boolean).join(' ')}`;
  };

  const doSaveNick = async () => {
    const val = nickRef.current?.value?.trim() || '';
    if (!val || nickStatus === 'saving') return;
    setNickStatus('saving');
    const res = await window.saveNickname(val);
    if (res?.success) {
      setNickStatus('ok');
      setTimeout(() => setNickStatus(null), 2000);
    } else {
      setNickStatus('err');
      setTimeout(() => setNickStatus(null), 2500);
    }
  };

  const handleNickSave = () => {
    const val = nickRef.current?.value?.trim() || '';
    if (!val) return;
    if (!nickChanged) {
      setShowNickWarning(true);
    } else {
      doSaveNick();
    }
  };

  const toggleGlow = () => {
    const next = !glowDisabled;
    setGlowDisabled(next);
    localStorage.setItem('extraGlowDisabled', String(next));
  };

  React.useEffect(() => {
    if (videoRef.current) {
      videoRef.current.muted = isMuted;
    }
  }, [isMuted]);

  return (
    <div style={{position:'absolute',inset:0,background:'rgba(8,5,16,0.92)',backdropFilter:'blur(14px)',zIndex:30,display:'flex',flexDirection:'column',animation:'profileFadeIn 0.25s'}}>
      {/* Header */}
      <div style={{height:'52px',background:'rgba(15,10,26,0.98)',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 14px',flexShrink:0,borderBottom:`1px solid ${T.purple1}`}}>
        <div style={{display:'flex',alignItems:'center',gap:'9px'}}>
          <button onClick={onClose} style={{width:'32px',height:'32px',borderRadius:'10px',background:T.bgCard,border:`1px solid ${T.purple1}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7L9 11" stroke={T.grey2} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
          </button>
          <span style={{fontSize:'16px',fontWeight:'800',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>Профиль</span>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          <span style={{fontSize:'11px',color:league.color,fontWeight:'700',fontFamily:"'Exo 2',sans-serif"}}>{league.emoji} {league.name}</span>
        </div>
      </div>

      {/* Scrollable content */}
      <div style={{flex:1,overflowY:'auto',padding:'12px 10px 20px',display:'flex',flexDirection:'column',alignItems:'center'}}>

        {/* ═══════ ID Card ═══════ */}
        {/* Wrapper — relative so avatar can overflow bottom */}
        <div style={{position:'relative',width:'100%',maxWidth:'380px',marginBottom:'14px'}}>

          {/* Card — full background, no overlay */}
          <div style={{height:'190px',borderRadius:'18px',overflow:'hidden',position:'relative',background:`linear-gradient(135deg,${bgClass.color}44 0%,#1a1030 100%)`}}>

            {/* Background media */}
            {(bgItem?.asset_path && bgItem.media_type !== 'video' && bgItem.media_type !== 'gif') ? (
              <img src={bgItem.asset_path} alt="" style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',pointerEvents:'none'}}/>
            ) : (bgItem?.mediaUrl || bgItem?.asset_path) && (bgItem?.mediaType==='video' || bgItem?.media_type==='video') ? (
              <video ref={videoRef} src={bgItem.mediaUrl||bgItem.asset_path} autoPlay loop playsInline muted={isMuted}
                style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',pointerEvents:'none'}}/>
            ) : (bgItem?.mediaUrl || bgItem?.asset_path) && (bgItem?.mediaType==='gif' || bgItem?.media_type==='gif') ? (
              <img src={bgItem.mediaUrl||bgItem.asset_path} alt="" style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',pointerEvents:'none'}}/>
            ) : bgItem?.animated ? (
              <div style={{position:'absolute',inset:0,background:'linear-gradient(105deg,transparent 40%,rgba(251,191,36,0.08) 50%,transparent 60%)',backgroundSize:'200% 100%',animation:'shimmer 3s ease-in-out infinite',pointerEvents:'none'}}/>
            ) : null}

              {/* Bottom vignette — covers last ~60px so text is readable */}
            <div style={{position:'absolute',bottom:0,left:0,right:0,height:'70px',background:'linear-gradient(to bottom,transparent,rgba(0,0,0,0.72))',pointerEvents:'none'}}/>

            {/* Trophies — bottom right */}
            <div style={{position:'absolute',bottom:'10px',right:'12px',display:'flex',alignItems:'center',gap:'4px',zIndex:2}}>
              <span style={{fontSize:'13px',fontWeight:'800',color:T.orange,fontFamily:"'Exo 2',sans-serif",textShadow:'0 0 10px rgba(245,146,30,0.6)'}}>🏆 {trophies.toLocaleString()}</span>
            </div>

            {/* Title — right of avatar upper 50%, inside card */}
            <div onClick={()=>setPickerType('title')} style={{position:'absolute',bottom:'33px',left:'82px',right:'56px',cursor:'pointer',zIndex:2}}>
              <div style={{fontSize:'15px',fontWeight:'900',fontFamily:"'Exo 2',sans-serif",lineHeight:1.1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',...getTitleDisplayStyle()}}>
                {titleItem?.name || 'Игрок ExtraArena'}
              </div>
            </div>

            {/* Nickname · Clan — right of avatar lower 50%, inside card */}
            <div style={{position:'absolute',bottom:'16px',left:'82px',right:'56px',display:'flex',alignItems:'center',gap:'4px',zIndex:2,overflow:'hidden'}}>
              <span style={{fontSize:'12px',fontWeight:'700',fontFamily:"'Exo 2',sans-serif",overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',...getCardNicknameStyle()}}>
                {displayName}
              </span>
              <span style={{fontSize:'12px',color:'rgba(255,255,255,0.35)',flexShrink:0}}>·</span>
              <span style={{fontSize:'11px',color:'rgba(255,255,255,0.5)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
                {profile?.squad_id ? `Squad #${profile.squad_id}` : 'Не в клане'}
              </span>
            </div>

            {/* Mute button */}
            {bgItem && (bgItem.hasSound || bgItem.has_sound) && (
              <button onClick={e=>{e.stopPropagation();setIsMuted(v=>!v);}} style={{position:'absolute',top:'8px',left:'10px',width:'26px',height:'26px',borderRadius:'8px',background:'rgba(0,0,0,0.45)',backdropFilter:'blur(4px)',border:'1px solid rgba(255,255,255,0.15)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',zIndex:5}}>
                {isMuted
                  ? <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 4.5H4L7 2v9L4 8.5H2V4.5z" fill="white" opacity="0.7"/><path d="M10 5L12 7M12 5L10 7" stroke="white" strokeWidth="1.4" strokeLinecap="round" opacity="0.7"/></svg>
                  : <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 4.5H4L7 2v9L4 8.5H2V4.5z" fill="white"/><path d="M9 4.5c.8.6 1.3 1.5 1.3 2.5s-.5 1.9-1.3 2.5" stroke="white" strokeWidth="1.4" strokeLinecap="round"/></svg>
                }
              </button>
            )}

            {/* PlayerID chip — top right, copyable */}
            {!hideId && (
              <div onClick={()=>{ navigator.clipboard?.writeText(String(profile?.user_id)).catch(()=>{}); window.showToast('ID скопирован','success',1500); }} style={{position:'absolute',top:'10px',right:'12px',background:'rgba(0,0,0,0.35)',backdropFilter:'blur(4px)',borderRadius:'6px',padding:'2px 8px',fontSize:'10px',color:'rgba(255,255,255,0.5)',fontFamily:"'Exo 2',sans-serif",zIndex:2,cursor:'pointer'}}>
                #{profile?.user_id}
              </div>
            )}
            {hideId && canHideId && (
              <div style={{position:'absolute',top:'10px',right:'12px',background:'rgba(0,0,0,0.3)',borderRadius:'6px',padding:'2px 8px',fontSize:'10px',color:'rgba(255,255,255,0.25)',zIndex:2}}>🙈</div>
            )}

            {/* Avatar — bottom-left, inside card */}
            <div
              onClick={()=>setPickerType('avatar')}
              style={{
                position:'absolute',
                bottom:'8px',
                left:'14px',
                width:'56px',height:'56px',
                borderRadius:'13px',
                background:`linear-gradient(135deg,${slotMeta('avatar').bg},${T.purple2})`,
                border:`2px solid ${slotMeta('avatar').color}`,
                boxShadow:`0 0 16px ${slotMeta('avatar').color}66, 0 4px 14px rgba(0,0,0,0.7)`,
                overflow:'hidden',
                zIndex:3,
                cursor:'pointer',
              }}
            >
              {equippedAvatarItem?.asset_path
                ? <img src={equippedAvatarItem.asset_path} alt="" style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                : <span style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px',fontWeight:'900',color:'white',fontFamily:"'Exo 2',sans-serif"}}>{displayName[0].toUpperCase()}</span>
              }
            </div>

            {/* ExtraPass bar — bottom of card */}
            {(hasExtraPass || isUltra) && (
              <div style={{position:'absolute',bottom:0,left:0,right:0,height:'20px',display:'flex',alignItems:'center',justifyContent:'center',background:isUltra?'linear-gradient(90deg,rgba(124,58,237,0.88),rgba(67,56,202,0.88),rgba(96,165,250,0.65))':`linear-gradient(90deg,${T.orange}cc,${T.orangeD}cc)`,zIndex:2}}>
                <span style={{fontSize:'9px',fontWeight:'800',color:'rgba(255,255,255,0.95)',fontFamily:"'Exo 2',sans-serif",letterSpacing:'0.3px'}}>
                  {isUltra ? '💫 ExtraPass ULTRA' : '⭐ ExtraPass'}
                </span>
              </div>
            )}
          </div>
        </div>

        {/* ═══════ Cosmetic slots ═══════ */}
        <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginTop:'0px',width:'100%',maxWidth:'380px'}}>
          <SlotChip type="avatar"
            meta={slotMeta('avatar')}
            hasAlternatives={itemsByType('avatar').filter(c=>c.owned).length > 1}
            onClick={()=>setPickerType('avatar')}
            style={{flex:1,minWidth:'90px'}}
          />
          <SlotChip type="profile_background"
            meta={slotMeta('profile_background')}
            hasAlternatives={itemsByType('profile_background').filter(c=>c.owned).length > 1}
            onClick={()=>setPickerType('profile_background')}
            style={{flex:1,minWidth:'90px'}}
          />
          <SlotChip type="title"
            meta={slotMeta('title')}
            hasAlternatives={itemsByType('title').filter(c=>c.owned).length > 1}
            onClick={()=>setPickerType('title')}
            style={{flex:1,minWidth:'90px'}}
          />
        </div>

        <button
          onClick={handleRandom}
          style={{
            width:'100%',maxWidth:'380px',marginTop:'8px',
            padding:'10px',borderRadius:'13px 13px 0 0',
            background:'linear-gradient(135deg,rgba(139,92,246,0.2),rgba(96,165,250,0.15))',
            border:`1px solid ${T.purple2}`,
            color:T.grey1,fontSize:'13px',fontWeight:'700',
            fontFamily:"'Exo 2',sans-serif",
            cursor:'pointer',
            display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',
            transition:'all 0.15s',
          }}
        >
          🎲 Случайный образ
        </button>

        <div style={{
          width:'100%',maxWidth:'380px',
          display:'flex',alignItems:'center',justifyContent:'space-between',
          padding:'8px 12px',
          background:'rgba(255,255,255,0.02)',
          border:`1px solid ${T.purple1}`,
          borderTop:'none',
          borderRadius:'0 0 13px 13px',
          marginTop:'-1px',
        }}>
          <span style={{fontSize:'11px',color: hasAnyNonStarter ? T.grey1 : T.grey3,fontFamily:"'Inter',sans-serif"}}>
            Игнорировать стартовые предметы
          </span>
          <div
            onClick={hasAnyNonStarter ? () => setRandomIgnoreStarters(v => !v) : undefined}
            style={{
              width:'36px',height:'20px',borderRadius:'10px',
              background: randomIgnoreStarters && hasAnyNonStarter ? T.purple3 : T.purple2,
              border:`1px solid ${randomIgnoreStarters && hasAnyNonStarter ? T.purple3 : T.purple1}`,
              position:'relative',
              cursor: hasAnyNonStarter ? 'pointer' : 'not-allowed',
              opacity: hasAnyNonStarter ? 1 : 0.4,
              transition:'background 0.2s',
              flexShrink:0,
            }}>
            <div style={{
              position:'absolute',top:'2px',
              left: randomIgnoreStarters && hasAnyNonStarter ? '18px' : '2px',
              width:'16px',height:'16px',borderRadius:'8px',
              background:'white',transition:'left 0.2s',
              boxShadow:'0 1px 3px rgba(0,0,0,0.3)'
            }}/>
          </div>
        </div>

        {/* ═══════ Nickname block ═══════ */}
        <div style={{width:'100%',maxWidth:'380px',marginTop:'16px',background:T.bgCard,border:`1px solid ${T.purple1}`,borderRadius:'14px',padding:'14px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'10px'}}>
            <span style={{fontSize:'13px',fontWeight:'700',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>✏️ Никнейм</span>
            <span style={{fontSize:'11px',color:nickChanged?T.grey2:T.orange,fontWeight:'600'}}>
              {nickChanged ? '500 💎' : 'Бесплатно'}
            </span>
          </div>
          <div style={{display:'flex',gap:'8px'}}>
            <input ref={nickRef}
              defaultValue={profile?.custom_nickname || ''}
              onKeyDown={e=>e.key==='Enter'&&handleNickSave()}
              maxLength={20}
              placeholder="Твой никнейм..."
              style={{flex:1,background:T.bgDeep,border:`1px solid ${nickStatus==='err'?'#f87171':T.purple2}`,borderRadius:'9px',padding:'8px 11px',color:T.white,fontSize:'12px',fontFamily:"'Inter',sans-serif",outline:'none'}}/>
            <button onClick={handleNickSave} disabled={nickStatus==='saving'}
              style={{width:'38px',height:'38px',borderRadius:'9px',background:nickStatus==='ok'?'#166534':nickStatus==='err'?'#7f1d1d':T.purple2,border:`1px solid ${T.purple3}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',transition:'background 0.2s',opacity:nickStatus==='saving'?0.6:1}}>
              {nickStatus==='saving' ? <div style={{width:'14px',height:'14px',border:'2px solid rgba(255,255,255,0.3)',borderTopColor:T.purpleLt,borderRadius:'50%',animation:'spin 0.7s linear infinite'}}/> :
               nickStatus==='ok'     ? <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l4 4 6-7" stroke="#4ade80" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg> :
               nickStatus==='err'    ? <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2L12 12M12 2L2 12" stroke="#f87171" strokeWidth="1.8" strokeLinecap="round"/></svg> :
               <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 14l3-1 8-8-2-2-8 8-1 3z" fill={T.purpleLt}/><path d="M10 3l2 2" stroke={T.purpleLt} strokeWidth="1.2"/></svg>}
            </button>
          </div>
          {nickStatus==='err' && <div style={{fontSize:'11px',color:'#f87171',marginTop:'5px'}}>Не удалось сохранить. Недостаточно гемов?</div>}
        </div>

        {/* ═══════ Hide ID — always visible, toggle only for subscribers ═══════ */}
        <div style={{width:'100%',maxWidth:'380px',marginTop:'10px',background:T.bgCard,border:`1px solid ${T.purple1}`,borderRadius:'14px',padding:'12px 14px'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px'}}>
            <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
              <span style={{fontSize:'13px',fontWeight:'700',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>🙈 Скрыть ID</span>
              {!canHideId && (
                <span style={{fontSize:'10px',color:T.orange,background:'rgba(245,146,30,0.12)',borderRadius:'5px',padding:'1px 7px',fontWeight:'600',fontFamily:"'Exo 2',sans-serif"}}>⭐ ExtraPass</span>
              )}
            </div>
            {/* Toggle — clickable only with subscription */}
            <div onClick={canHideId ? ()=>setHideId(v=>!v) : undefined}
              style={{
                width:'44px',height:'24px',borderRadius:'12px',
                background: hideId&&canHideId ? T.orange : T.purple2,
                border:`1px solid ${hideId&&canHideId ? T.orange : T.purple3}`,
                position:'relative',
                cursor: canHideId ? 'pointer' : 'not-allowed',
                opacity: canHideId ? 1 : 0.4,
                transition:'background 0.2s,border 0.2s',
                flexShrink:0
              }}>
              <div style={{
                position:'absolute',top:'2px',
                left: hideId&&canHideId ? '22px' : '2px',
                width:'20px',height:'20px',borderRadius:'10px',
                background:'white',transition:'left 0.2s',
                boxShadow:'0 1px 4px rgba(0,0,0,0.3)'
              }}/>
            </div>
          </div>
          {/* Disclaimer text */}
          <div style={{fontSize:'10px',color:T.grey3,lineHeight:1.5,fontFamily:"'Inter',sans-serif"}}>
            Мы скрываем ID только из твоей карточки игрока. В истории боёв и списке игроков он всё равно будет виден.

        {/* ═══════ Registration date ═══════ */}
        {profile?.reg_date && (

            🗓 {formatMemberSince(profile.reg_date)}

      </div>

      {/* Picker drawer */}
      {pickerType && (
        <CosmeticPickerSheet
          type={pickerType}
          ownedItems={itemsByType(pickerType)}
          selectedItem={pickerType==='avatar'?selectedAvatar:pickerType==='profile_background'?selectedBackground:selectedTitle}
          onSelect={handleSelect}
          onClose={()=>setPickerType(null)}
        />
      )}

      {/* Nickname change warning modal */}
      {showNickWarning && (
        <div onClick={()=>setShowNickWarning(false)} style={{position:'absolute',inset:0,background:'rgba(5,2,12,0.92)',zIndex:50,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}}>
          <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:'320px',background:T.bgDeep,border:`1px solid ${T.purple1}`,borderRadius:'20px',padding:'24px 20px 20px',animation:'popIn 0.2s',boxShadow:'0 20px 60px rgba(0,0,0,0.7)'}}>
            <div style={{textAlign:'center',marginBottom:'16px'}}>
              <div style={{fontSize:'28px',marginBottom:'8px'}}>⚠️</div>
              <div style={{fontSize:'14px',fontWeight:'700',color:T.white,fontFamily:"'Exo 2',sans-serif",marginBottom:'8px'}}>Смена никнейма</div>
              <div style={{fontSize:'12px',color:T.grey1,lineHeight:1.6}}>
                Первая смена никнейма бесплатна.<br/>
                Все последующие смены стоят 500 💎.
              </div>
            </div>
            <div style={{display:'flex',gap:'8px'}}>
              <button onClick={()=>setShowNickWarning(false)}
                style={{flex:1,height:'40px',background:T.bgCard,border:`1px solid ${T.purple2}`,borderRadius:'10px',color:T.grey1,fontSize:'13px',fontWeight:'700',fontFamily:"'Exo 2',sans-serif",cursor:'pointer'}}>
                Отмена
              </button>
              <button onClick={()=>{setShowNickWarning(false);doSaveNick();}}
                style={{flex:1,height:'40px',background:`linear-gradient(135deg,${T.orange},${T.orangeD})`,border:'none',borderRadius:'10px',color:'white',fontSize:'13px',fontWeight:'800',fontFamily:"'Exo 2',sans-serif",cursor:'pointer'}}>
                Сохранить
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

const App = () => {
  const [navTab,         setNavTab]         = React.useState(2);
  const [showMenu,       setShowMenu]       = React.useState(false);
  const [showSettings,   setShowSettings]   = React.useState(false);
  const [showAI,         setShowAI]         = React.useState(false);
  const [showGenerator,  setShowGenerator]  = React.useState(false);
  const [showBattlePick, setShowBattlePick] = React.useState(false);
  const [showGameMode,   setShowGameMode]   = React.useState(false);
  const [showMail,       setShowMail]       = React.useState(false);
  const [showCaseOpen,   setShowCaseOpen]   = React.useState(false);
  const [showInfo,       setShowInfo]       = React.useState(false);
  const [showGloryPath,  setShowGloryPath]  = React.useState(false);
  const [showLeagueInfo, setShowLeagueInfo] = React.useState(false);
  const [showBattlePass, setShowBattlePass] = React.useState(false);
  const [showPreBattle, setShowPreBattle]  = React.useState(false);
  const [showSupport,   setShowSupport]    = React.useState(false);
  const [showBattles,   setShowBattles]    = React.useState(false);
  const [leagueUp,      setLeagueUp]       = React.useState(null);
  const [profile,        setProfile]        = React.useState(null);
  const [toast,          setToast]          = React.useState(null);
  const [incomingInvite, setIncomingInvite] = React.useState(null);
  const [showInvite,     setShowInvite]     = React.useState(false);
  const [showFriends,    setShowFriends]    = React.useState(false);
  const [frPendingCount, setFrPendingCount] = React.useState(0);
  const [inBattle,       setInBattle]       = React.useState(false);
  const [showProfile,    setShowProfile]    = React.useState(false);

  window.showToast = (msg, type, ms) => {
    type = type || 'success'; ms = ms || 3000;
    const id = Date.now();
    setToast({message: msg, type: type, id: id});
    setTimeout(function(){ setToast(function(t){ return t && t.id === id ? null : t; }); }, ms);
  };

  const hasOverlay = showAI || showGenerator || showMenu || showSettings || showBattlePick || showGameMode || showMail || showCaseOpen || showInfo || showGloryPath || showLeagueInfo || showBattlePass || showPreBattle || showSupport || showInvite || showBattles || showFriends || showProfile;

  React.useEffect(()=>{ window.__rootSetPreBattle = setShowPreBattle; window.__updateProfile = setProfile; return ()=>window.__rootSetPreBattle=null; }, []);

  React.useEffect(()=>{
    const anyOpen = showAI || showGenerator || showMenu || showSettings || showBattlePick || showGameMode || showMail || showCaseOpen || showInfo || showGloryPath || showLeagueInfo || showBattlePass || showSupport || showBattles;
    if (anyOpen) window._playSfx('menu-open-sound');
  }, [showMenu, showSettings, showBattlePick, showGameMode, showMail, showCaseOpen, showInfo, showGloryPath, showLeagueInfo, showSupport, showBattles]);

  // ── Analytics: screen tracking ──
  React.useEffect(() => { window.__analytics?.screen(navTab===0?'shop':navTab===1?'collection':navTab===2?'arena':navTab===3?'squads':navTab===4?'community':'unknown'); }, [navTab]);
  React.useEffect(() => { if(showMenu)       window.__analytics?.screen('menu'); }, [showMenu]);
  React.useEffect(() => { if(showSettings)   window.__analytics?.screen('settings'); }, [showSettings]);
  React.useEffect(() => { if(showMail)       window.__analytics?.screen('mail'); }, [showMail]);
  React.useEffect(() => { if(showCaseOpen)   window.__analytics?.screen('case_open'); }, [showCaseOpen]);
  React.useEffect(() => { if(showGloryPath)  window.__analytics?.screen('glory_path'); }, [showGloryPath]);
  React.useEffect(() => { if(showLeagueInfo) window.__analytics?.screen('league_info'); }, [showLeagueInfo]);
  React.useEffect(() => { if(showBattlePass) window.__analytics?.screen('battle_pass'); }, [showBattlePass]);
  React.useEffect(() => { if(showBattles)    window.__analytics?.screen('battle_history'); }, [showBattles]);
  React.useEffect(() => { if(showSupport)    window.__analytics?.screen('support'); }, [showSupport]);
  React.useEffect(() => { if(showAI)         window.__analytics?.screen('ai'); }, [showAI]);
  React.useEffect(() => { if(showGenerator)  window.__analytics?.screen('generator'); }, [showGenerator]);
  React.useEffect(() => { if(showBattlePick) window.__analytics?.screen('battle_pick'); }, [showBattlePick]);
  React.useEffect(() => { if(showGameMode)   window.__analytics?.screen('game_mode'); }, [showGameMode]);
  React.useEffect(() => { if(showPreBattle)  window.__analytics?.screen('pre_battle'); }, [showPreBattle]);
  React.useEffect(() => { if(showFriends)    window.__analytics?.screen('friends'); }, [showFriends]);
  React.useEffect(() => { if(showInvite)    window.__analytics?.screen('invite'); }, [showInvite]);
  React.useEffect(() => { if(showProfile)  window.__analytics?.screen('profile'); }, [showProfile]);

  const swipeRef = React.useRef(null);
  const swipeStartX = React.useRef(0);
  const onTouchStart = (e) => { if(!hasOverlay && e.touches.length===1) swipeStartX.current=e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if(hasOverlay) return;
    const dx = (e.changedTouches[0]?.clientX||0) - swipeStartX.current;
    if(Math.abs(dx)>100){ if(dx<0)setNavTab(t=>(t+1)%NAV_ITEMS.length); else setNavTab(t=>(t-1+NAV_ITEMS.length)%NAV_ITEMS.length); }
  };

  React.useEffect(()=>{
    window.setLoadingProgress?.(10, 'Запускаем арену…');

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor?.('#0f0a1a'); } catch(e){}
      try { tg.setBackgroundColor?.('#0f0a1a'); } catch(e){}
    }

    window.setLoadingProgress?.(25, 'Синхронизируем профиль…');
    window.startBgMusic();

    window.loadProfile().then(data => {
      if (data) {
        window.__analytics?.start();
        window.setLoadingProgress?.(70, 'Готовим карты…');
        setProfile(data);
        const musicOn = data?.settings?.sound_music ?? true;
        window._musicEnabled = musicOn;
        if (musicOn) window.startBgMusic(); else window.stopBgMusic();
        window.setLoadingProgress?.(90, 'Почти готово…');
      } else {
        window.setLoadingProgress?.(80, 'Загружаем кейсы…');
      }
      setTimeout(() => window.finishLoading?.(), 300);
    }).catch(() => {
      window.setLoadingProgress?.(90, 'Запускаем арену…');
      setTimeout(() => window.finishLoading?.(), 400);
    });

    // Проверка league_up из arena
    const stored = sessionStorage.getItem('arena_league_up');
    if (stored) {
      try { setLeagueUp(JSON.parse(stored)); } catch(e) {}
      sessionStorage.removeItem('arena_league_up');
    }
  },[]);

  React.useEffect(()=>{
    const pollInvites = async () => {
      try {
        const r = await fetch(_buildAuthUrl('/api/friends/invite/pending'));
        if (!r.ok) return;
        const data = await r.json();
        if (data.invite) {
          setIncomingInvite(data.invite);
          setShowInvite(true);
        }
      } catch(e) {}
    };
    const pollFrReqs = async () => {
      try {
        const r = await fetch(_buildAuthUrl('/api/friends/requests'));
        if (!r.ok) return;
        const d = await r.json();
        setFrPendingCount((d.incoming||[]).length + (d.outgoing||[]).length);
      } catch(e) {}
    };
    const interval = setInterval(pollInvites, 5000);
    const frInterval = setInterval(pollFrReqs, 10000);
    pollFrReqs();
    return () => { clearInterval(interval); clearInterval(frInterval); };
  }, []);

  const displayName = profile?.custom_nickname || profile?.first_name || profile?.username || 'ExtraArena';
  const openSettings = () => { setShowMenu(false); setTimeout(()=>setShowSettings(true),120); };

  return (
    <div style={{width:'100%',height:'100%',background:T.bg,display:'flex',flexDirection:'column',position:'relative',overflow:'hidden',touchAction:'pan-y',overscrollBehavior:'none'}}>
      <TopBar
        title={showAI ? 'ИИ Аналитика' : showGenerator ? 'Генератор' : displayName}
        showBack={showAI || showGenerator}
        onBack={()=>{setShowAI(false);setShowGenerator(false);}}
        onMenu={!showAI && !showGenerator ? ()=>setShowMenu(true) : null}
        profile={profile}
        onProfileClick={!showAI && !showGenerator ? ()=>setShowProfile(true) : null}
        extra={showAI ? (
          <div style={{width:'28px',height:'28px',borderRadius:'8px',background:T.aiBg,border:`1px solid ${T.aiBorder}`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="2.5" fill={T.ai}/><path d="M7 1v2M7 11v2M1 7h2M11 7h2" stroke={T.ai} strokeWidth="1.2" strokeLinecap="round"/></svg>
          </div>
        ) : showGenerator ? (
          <span style={{fontSize:'20px'}}>🔑</span>
        ) : null}
      />

      {toast && (
        <div style={{position:'fixed',top:'64px',left:'16px',right:'16px',zIndex:300,
          background: toast.type==='error'?'#7f1d1d':'#064e3b',
          border: '1px solid ' + (toast.type==='error'?'#ef4444':'#10b981') + '55',
          borderRadius:'14px',padding:'14px 16px',
          color:'white',fontSize:'13px',fontWeight:700,
          fontFamily:"'Exo 2',sans-serif",
          boxShadow:'0 8px 30px rgba(0,0,0,0.6)',
          animation:'slideDown 0.2s'}}>
          {toast.message}
        </div>
      )}

      {/* Main content */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minHeight:0}}
        onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
        {showAI ? (
          <AIScreen onBack={()=>setShowAI(false)}/>
        ) : showGenerator ? (
          <GeneratorScreen onBack={()=>setShowGenerator(false)} profile={profile}/>
        ) : navTab===2 ? (
          <ArenaScreen onMenu={()=>setShowMenu(true)} onAI={()=>setShowAI(true)} onGenerator={()=>setShowGenerator(true)} onOpenBattles={()=>setShowBattles(true)} onBattlePick={()=>setShowBattlePick(true)} onStartBattle={()=>setShowGameMode(true)} onOpenCase={()=>setShowCaseOpen(true)} onOpenGloryPath={()=>setShowGloryPath(true)} onOpenLeagueInfo={()=>setShowLeagueInfo(true)} onOpenBattlePass={()=>setShowBattlePass(true)} onGoToShop={()=>setNavTab(0)} profile={profile}/>
        ) : navTab===0 ? (
          <ShopScreen profile={profile} onProfileUpdate={function(p){ setProfile(p); }}/>
        ) : navTab===1 ? (
          <CollectionScreen profile={profile}/>
        ) : navTab===4 ? (
          <CommunityScreen profile={profile}/>
        ) : (
          <PlaceholderScreen label={['Магазин','','Коллекция','Сквады','Коммьюнити'][navTab]}/>
        )}
      </div>

      {!showAI && !showGenerator && <BottomNav active={navTab} onChange={setNavTab}/>}

      {showMenu       && <MenuSheet       onClose={()=>setShowMenu(false)} onSettings={openSettings} onMail={()=>{setShowMenu(false);setTimeout(()=>setShowMail(true),120);}} onSupport={()=>{setShowMenu(false);setTimeout(()=>setShowSupport(true),120);}} onInfo={()=>{setShowMenu(false);setTimeout(()=>setShowInfo(true),120);}} onFriends={()=>{setShowMenu(false);setTimeout(()=>setShowFriends(true),120);}} profile={profile} frPending={frPendingCount}/>}
      {showSettings   && <SettingsScreen  onClose={()=>setShowSettings(false)} profile={profile}/>}
      {showBattlePick && <BattlePickSheet onClose={()=>setShowBattlePick(false)} profile={profile}/>}

      {showInfo       && <InfoSheet      onClose={()=>setShowInfo(false)}/>}
      {showGloryPath  && <TrophyRoadSheet onClose={()=>setShowGloryPath(false)} profile={profile}/>}
      {showLeagueInfo && <LeagueInfoSheet onClose={()=>setShowLeagueInfo(false)} profile={profile}/>}
      {showPreBattle  && <PreBattleScreen  data={window.__preBattleData} onClose={()=>{setShowPreBattle(false);window.__preBattleData=null;}}/>}
      {showSupport    && <SupportSheet    onClose={()=>setShowSupport(false)}/>}
      {showBattlePass && <BattlePassSheet onClose={()=>setShowBattlePass(false)} profile={profile}/>}
      {showBattles   && <BattleHistorySheet onClose={()=>setShowBattles(false)} profile={profile}/>}
      {showInvite   && incomingInvite && <IncomingInviteModal invite={incomingInvite} profile={profile} onClose={()=>{setShowInvite(false);setIncomingInvite(null);}} onStart={()=>setInBattle(true)}/>}
      {showFriends && <FriendsScreen onClose={()=>{setShowFriends(false);setTimeout(async()=>{try{const r=await fetch(_buildAuthUrl('/api/friends/requests'));const d=await r.json();setFrPendingCount((d.incoming||[]).length+(d.outgoing||[]).length);}catch(e){}},300);}} profile={profile}/>}
      {showProfile && <ProfileScreen profile={profile} onClose={()=>setShowProfile(false)}/>}

      {/* League Up Modal */}
      {leagueUp && (()=>{
        const newLeagueId = leagueUp.league_id;
        const leagueInfo = LEAGUE_LIST.find(l => l.id === newLeagueId);
        const leagueMilestones = leagueInfo ? GLORY_PATH_MILESTONES.filter(m => m.trophies >= leagueInfo.min && m.trophies <= leagueInfo.max) : [];
        return (
        <div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.85)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',animation:'fadeIn 0.3s'}} onClick={()=>{setLeagueUp(null);window._playSfx('menu-open-sound');}}>
          <div onClick={e=>e.stopPropagation()} style={{background:`linear-gradient(180deg,#1a1238,#130d26)`,border:`2px solid ${leagueUp.color||T.orange}`,borderRadius:'24px',padding:'28px 24px 24px',textAlign:'center',maxWidth:'360px',width:'90%',maxHeight:'80vh',overflowY:'auto',animation:'scaleIn 0.35s cubic-bezier(0.32,0.72,0,1)',boxShadow:`0 0 60px ${(leagueUp.color||T.orange)}44`}}>
            <div style={{fontSize:'56px',marginBottom:'8px',animation:'bounce 0.6s ease-out'}}>{leagueUp.emoji}</div>
            <div style={{fontSize:'26px',fontWeight:'900',color:'white',fontFamily:"'Exo 2',sans-serif",marginBottom:'4px'}}>{leagueUp.name}</div>
            <div style={{fontSize:'14px',color:T.grey1,marginBottom:'20px',lineHeight:1.5}}>Ты достиг новой лиги! Продолжай в том же духе.</div>
            {leagueMilestones.length > 0 && (
              <div style={{textAlign:'left',marginBottom:'20px'}}>
                <div style={{fontSize:'11px',color:T.grey2,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'8px'}}>Награды Glory Path этой лиги</div>
                {leagueMilestones.map((m, i) => (
                  <div key={i} style={{display:'flex',alignItems:'center',gap:'10px',background:`${T.purple1}44`,borderRadius:'10px',padding:'8px 12px',marginBottom:'6px'}}>
                    <span style={{fontSize:'12px',fontWeight:'900',color:T.orange,fontFamily:"'Exo 2'",flexShrink:0}}>{m.trophies}</span>
                    <div style={{display:'flex',gap:'5px',flexWrap:'wrap'}}>
                      {m.rewards.map((r,j) => {
                        const rIcon = r.icon || (r.type==='coins'?'💰':r.type==='gems'?'💎':r.type==='case'?'📦':r.type==='particles'?'✨':r.type==='shards'?'🔮':r.type==='guaranteed_card'?'🃏':r.type==='cosmetic'?'🎨':'🎁');
                        return (
                          <span key={j} style={{display:'inline-flex',alignItems:'center',gap:'2px',fontSize:'10px',color:T.grey1,background:`${T.purple1}88`,borderRadius:'6px',padding:'2px 6px',fontFamily:"'Exo 2'"}}>
                            <span>{rIcon}</span><span style={{fontWeight:'600'}}>{r.amount||''}</span>
                          </span>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            )}
            <button onClick={()=>setLeagueUp(null)} style={{width:'100%',height:'50px',background:`linear-gradient(135deg,${leagueUp.color||T.orange},${T.orange})`,border:'none',borderRadius:'14px',color:'white',fontSize:'17px',fontWeight:'900',fontFamily:"'Exo 2',sans-serif",cursor:'pointer',boxShadow:`0 5px 24px ${(leagueUp.color||T.orange)}55`}}>Отлично!</button>
          </div>
        </div>
        );
      })()}
    </div>
  );
};

// ═══════════════════════════════════════════
// TROPHY ROAD SHEET (API-connected)
// ═══════════════════════════════════════════
const TrophyRoadSheet = ({onClose, profile}) => {
  const [tiers,   setTiers]   = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [claiming, setClaiming] = React.useState({});
  const [seasonDays, setSeasonDays] = React.useState(null);

  const trophies = profile?.trophies || 0;
  const leagueId = profile?.league ?? 1;
  const league = LEAGUE_MAP[leagueId] || LEAGUE_LIST[0];
  const maxTrophies = 10000;
  const overallProgress = Math.min(100, (trophies / maxTrophies) * 100);

  const load = async () => {
    setLoading(true);
    try {
      const uid = profile?.user_id || window._userId || 0;
      const r = await fetch("/api/rewards/track/glory?user_id=" + uid);
      const d = await r.json();
      setTiers(d.tiers || []);
    } catch(e){}
    setLoading(false);
  };

  React.useEffect(()=>{ load(); }, [profile]);

  React.useEffect(()=>{
    fetch("/api/season/current").then(r=>r.json()).then(d=>{
      if (d.days_left != null) setSeasonDays(d.days_left);
    }).catch(()=>{});
  }, []);

  const handleClaim = async (pos) => {
    if (claiming[pos]) return;
    setClaiming(c => ({...c, [pos]: true}));
    try {
      const uid = profile?.user_id || window._userId || 0;
      const r = await fetch("/api/rewards/claim?user_id=" + uid, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({track_type:"glory", position: pos})
      });
      const d = await r.json();
      if (d.success) {
        window._playSfx('menu-open-sound');
        setTiers(prev => prev.map(t => t.position === pos ? {...t, claimed:true, available:false} : t));
        window.loadProfile().then(p => { if (p && window.__updateProfile) window.__updateProfile(p); });
      }
    } catch(e) {}
    setClaiming(c => ({...c, [pos]: false}));
  };

  return (
    <div style={{position:'absolute',inset:0,background:T.bg,zIndex:200,display:'flex',flexDirection:'column',animation:'fadeIn 0.25s'}}>
      <div style={{height:'52px',background:'rgba(15,10,26,0.98)',display:'flex',alignItems:'center',gap:'10px',padding:'0 16px',flexShrink:0,borderBottom:`1px solid ${T.purple1}`}}>
        <button onClick={onClose} style={{width:'32px',height:'32px',borderRadius:'10px',background:T.bgCard,border:`1px solid ${T.purple1}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7L9 11" stroke={T.grey2} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
        <span style={{fontSize:'15px',fontWeight:'700',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>Трофейная дорога</span>
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'12px 16px 20px'}}>
        {loading ? (
          <div style={{textAlign:'center',padding:'40px',color:T.grey1}}>Загрузка...</div>
        ) : (
          <>
            <div style={{background:`linear-gradient(135deg,${league.color}22,${T.bgCard})`,border:`1px solid ${league.color}44`,borderRadius:'18px',padding:'18px',marginBottom:'16px'}}>
              <div style={{display:'flex',alignItems:'center',gap:'14px',marginBottom:'14px'}}>
                <div style={{width:'52px',height:'52px',borderRadius:'14px',background:`${league.color}22`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'28px',border:`1px solid ${league.color}33`,flexShrink:0}}>{league.emoji}</div>
                <div>
                  <div style={{fontSize:'18px',fontWeight:'900',color:T.white,fontFamily:"'Exo 2',sans-serif",lineHeight:1.1}}>{league.name}</div>
                  <div style={{fontSize:'11px',color:T.grey1,marginTop:'3px'}}>Лига {league.id} · {trophies.toLocaleString()} 🏆</div>
                </div>
              </div>
              <div>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:'5px'}}>
                  <span style={{fontSize:'10px',color:T.grey2,textTransform:'uppercase',letterSpacing:'0.5px'}}>Общий прогресс</span>
                  <span style={{fontSize:'11px',color:T.orange,fontWeight:'700',fontFamily:"'Exo 2',sans-serif"}}>{overallProgress.toFixed(1)}%</span>
                </div>
                <div style={{height:'6px',background:T.purple1,borderRadius:'3px',overflow:'hidden'}}>
                  <div style={{width:`${overallProgress}%`,height:'100%',background:`linear-gradient(90deg,${T.orange},${T.orangeLt})`,borderRadius:'3px',boxShadow:`0 0 10px ${T.orange}55`,transition:'width 0.5s'}}/>
                </div>
              </div>
            </div>

            <div style={{background:`linear-gradient(135deg,${T.purple1}33,${T.bgCard})`,border:`1px solid ${T.purple1}44`,borderRadius:'14px',padding:'14px 14px',marginBottom:'14px',display:'flex',alignItems:'center',position:'relative',overflow:'hidden',minHeight:'90px'}}>
              <div style={{position:'absolute',left:'-25px',top:'50%',transform:'translateY(-50%) rotate(-30deg)',flexShrink:0}}>
                <img src={ICONS.trophyPath.seasonalCut} alt="" style={{width:'90px',height:'90px',filter:iconWhite,opacity:0.45,display:'block'}}/>
              </div>
              <div style={{flex:1,minWidth:0,paddingLeft:'55px'}}>
                <div style={{fontSize:'11px',fontWeight:'600',color:T.white,fontFamily:"'Exo 2'",lineHeight:1.6}}>В конце сезона трофеи срезаются до нижней границы твоей лиги — всё, что заработал сверх, конвертируется в ключи и монеты. Прокачивайся пока есть время!</div>
                {seasonDays != null && (
                  <div style={{fontSize:'11px',color:T.grey2,marginTop:'3px',fontFamily:"'Exo 2'"}}>
                    Следующий сезон: через {seasonDays} {seasonDays === 1 ? 'день' : seasonDays >= 2 && seasonDays <= 4 ? 'дня' : 'дней'}
                  </div>
                )}
              </div>
            </div>

            <div style={{display:'flex',flexDirection:'column'}}>
              {tiers.map((tier, i) => {
                const completed = tier.claimed;
                const isNext = tier.available;
                const locked = tier.locked;
                const segProgress = isNext ? Math.min(100, ((trophies - (i>0 ? tiers[i-1].position : 0)) / (tier.position - (i>0 ? tiers[i-1].position : 0))) * 100) : 0;
                const lineFilled = completed || (isNext && segProgress > 0);
                const remaining = tier.position - trophies;
                const tierLeague = LEAGUE_LIST.find(l => l.min === tier.position);

                return (
                  <div key={i} style={{display:'flex',flexDirection:'column',alignItems:'stretch'}}>
                    {i > 0 && (
                      <div style={{width:'4px',height:'40px',marginLeft:'17px',background:T.purple1,borderRadius:'2px',position:'relative',overflow:'hidden'}}>
                        {lineFilled && (
                          <div style={{position:'absolute',bottom:0,left:0,right:0,height:isNext ? `${segProgress}%` : '100%',background:`linear-gradient(to top,${T.orange},${T.purple3})`,borderRadius:'2px',boxShadow:completed ? `0 0 8px ${T.orange}55` : 'none',transition:'height 0.4s'}}/>
                        )}
                      </div>
                    )}

                    <div style={{
                      background: tierLeague
                        ? (completed ? `linear-gradient(135deg,${tierLeague.color}18,${T.bgCard})` : locked ? `rgba(26,16,48,0.5)` : `linear-gradient(135deg,${tierLeague.color}15,${T.bgCard})`)
                        : (completed ? `linear-gradient(135deg,${T.bgCard},#1a3a1a)` : locked ? 'rgba(26,16,48,0.5)' : T.bgCard),
                      border: tierLeague
                        ? (completed ? `1px solid ${tierLeague.color}44` : isNext ? `1px solid ${tierLeague.color}88` : `1px solid ${tierLeague.color}22`)
                        : (completed ? '1px solid #2ecc7144' : isNext ? `1px solid ${T.orange}55` : `1px solid ${T.purple1}`),
                      borderRadius:'14px',padding:'12px 14px',opacity:locked?0.45:1,
                      position:'relative',overflow:'hidden',transition:'all 0.2s'
                    }}>
                      {tierLeague && (
                        <div style={{marginBottom:'8px',display:'flex',alignItems:'center',gap:'6px'}}>
                          <div style={{background:`${tierLeague.color}22`,border:`1px solid ${tierLeague.color}44`,borderRadius:'8px',padding:'3px 9px',display:'flex',alignItems:'center',gap:'5px'}}>
                            <span style={{fontSize:'15px'}}>{tierLeague.emoji}</span>
                            <span style={{fontSize:'12px',fontWeight:'800',color:tierLeague.color,fontFamily:"'Exo 2',sans-serif"}}>{tierLeague.name}</span>
                          </div>
                          <span style={{fontSize:'9px',color:tierLeague.color,fontWeight:'700',textTransform:'uppercase',letterSpacing:'0.5px',animation:'pulse 1.5s ease-in-out infinite'}}>Новая лига!</span>
                        </div>
                      )}
                      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px'}}>
                        <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
                          <span style={{fontSize:'10px',color:T.grey2}}>🏆</span>
                          <span style={{fontSize:'15px',fontWeight:'900',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>{tier.position.toLocaleString()}</span>
                        </div>
                        {isNext && (<span style={{fontSize:'10px',color:T.orange,fontWeight:'600'}}>ещё {remaining.toLocaleString()}</span>)}
                        {completed && (<span style={{fontSize:'14px',color:'#2ecc71'}}>✓</span>)}
                      </div>

                      <div style={{display:'flex',gap:'6px',flexWrap:'wrap',alignItems:'center'}}>
                        {(tier.rewards||[]).map((r,j) => {
                          const icon = r.reward_type === 'coins' ? '💰' : r.reward_type === 'gems' ? '💎' : r.reward_type === 'keys' ? '🔑' : r.reward_type === 'card' ? '🃏' : '🎁';
                          const label = r.reward_type === 'coins' ? 'монет' : r.reward_type === 'gems' ? 'гемов' : r.reward_type === 'keys' ? 'ключ' : r.reward_type === 'card' ? 'карта' : '';
                          return (
                            <div key={j} style={{display:'flex',alignItems:'center',gap:'3px',background:`${T.purple1}88`,borderRadius:'8px',padding:'4px 8px'}}>
                              <span style={{fontSize:'12px'}}>{icon}</span>
                              <span style={{fontSize:'11px',color:T.grey1,fontWeight:'600',fontFamily:"'Exo 2',sans-serif"}}>{r.reward_amount.toLocaleString()} {label}</span>
                            </div>
                          );
                        })}
                        {isNext && (
                          <button onClick={()=>handleClaim(tier.position)} disabled={claiming[tier.position]}
                            style={{marginLeft:'auto',background:`linear-gradient(135deg,${T.orange},${T.orangeLt})`,border:'none',borderRadius:'10px',padding:'8px 16px',color:'white',fontSize:'13px',fontWeight:'800',fontFamily:"'Exo 2',sans-serif",cursor:'pointer',boxShadow:`0 3px 12px ${T.orange}66`,flexShrink:0}}>
                            {claiming[tier.position] ? '...' : 'Забрать'}
                          </button>
                        )}
                      </div>

                      {locked && (
                        <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',borderRadius:'14px'}}>
                          <span style={{fontSize:'22px',opacity:0.5}}>🔒</span>
                        </div>
                      )}

                      {isNext && (
                        <div style={{position:'absolute',right:'10px',top:'-6px',background:T.orange,borderRadius:'6px',padding:'1px 8px'}}>
                          <span style={{fontSize:'9px',color:'white',fontWeight:'800',fontFamily:"'Exo 2',sans-serif"}}>СЕЙЧАС</span>
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>
    </div>
  );
};

// BATTLE PASS SHEET
// ═══════════════════════════════════════════
const BattlePassSheet = ({onClose, profile}) => {
  const [tiers,    setTiers]    = React.useState([]);
  const [loading,  setLoading]  = React.useState(true);
  const [claiming, setClaiming] = React.useState({});

  const stars = profile?.stars || 0;
  const hasEP = profile?.extra_pass === 'active';
  const season = profile?.season || 1;
  const maxStars = 45;
  const progressPercent = Math.min(100, (stars / maxStars) * 100);

  const load = async () => {
    setLoading(true);
    const uid = profile?.user_id || window._userId || 0;
    try {
      const [freeR, premR, ultraR] = await Promise.all([
        fetch("/api/rewards/track/bp_free?user_id="+uid).then(r=>r.json()),
        fetch("/api/rewards/track/bp_premium?user_id="+uid).then(r=>r.json()),
        fetch("/api/rewards/track/bp_ultra?user_id="+uid).then(r=>r.json()),
      ]);

      const freeTiers   = freeR.tiers  || [];
      const premTiers   = premR.tiers  || [];
      const ultraTiers  = ultraR.tiers || [];

      // Merge by position: collect all rewards per position
      const posMap = {};
      const addToMap = (arr, source) => {
        arr.forEach(t => {
          if (!posMap[t.position]) posMap[t.position] = { position:t.position, free:[], premium:[], ultra:[], claimed:false, available:false, locked:true };
          const entry = posMap[t.position];
          if (source === 'free') {
            entry.free = t.rewards || [];
            entry.claimed = t.claimed;
            entry.available = t.available;
            entry.locked = t.locked;
          } else if (source === 'premium') {
            entry.premium = t.rewards || [];
          } else if (source === 'ultra') {
            entry.ultra = t.rewards || [];
          }
        });
      };
      addToMap(freeTiers, 'free');
      addToMap(premTiers, 'premium');
      addToMap(ultraTiers, 'ultra');

      const merged = Object.values(posMap).sort((a,b) => a.position - b.position);
      const fullTiers = [];
      for (let pos = 1; pos <= 45; pos++) {
        const existing = posMap[pos];
        if (existing) {
          fullTiers.push(existing);
        } else {
          fullTiers.push({
            position: pos, free: [], premium: [], ultra: [],
            claimed: false, available: false, locked: true, empty: true
          });
        }
      }
      setTiers(fullTiers);
    } catch(e) {
      console.error('BP load error', e);
    }
    setLoading(false);
  };

  React.useEffect(()=>{ load(); }, [profile]);

  const handleClaim = async (pos) => {
    if (claiming[pos]) return;
    setClaiming(c => ({...c, [pos]: true}));
    try {
      const uid = profile?.user_id || window._userId || 0;
      const r = await fetch("/api/rewards/claim?user_id="+uid, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({track_type:"bp_free", position: pos})
      });
      const d = await r.json();
      if (d.success) {
        window._playSfx('menu-open-sound');
        setTiers(prev => prev.map(t => t.position === pos ? {...t, claimed:true, available:false} : t));
        window.loadProfile().then(p => { if (p && window.__updateProfile) window.__updateProfile(p); });
      }
    } catch(e) {}
    setClaiming(c => ({...c, [pos]: false}));
  };

  const renderRewardBadge = (r, mini) => {
    const icon = r.reward_type === 'coins' ? '💰' : r.reward_type === 'gems' ? '💎' : r.reward_type === 'keys' ? '🔑' : r.reward_type === 'card' ? '🃏' : '🎁';
    const label = r.reward_type === 'coins' ? 'монет' : r.reward_type === 'gems' ? 'гемов' : r.reward_type === 'keys' ? 'ключ' : r.reward_type === 'card' ? 'карта' : '';
    return (
      <div style={{display:'flex',alignItems:'center',gap:'3px',background:`${T.purple1}88`,borderRadius:'7px',padding: mini ? '3px 6px' : '4px 8px'}}>
        <span style={{fontSize:mini?'11px':'12px'}}>{icon}</span>
        <span style={{fontSize:mini?'10px':'11px',color:T.grey1,fontWeight:'600',fontFamily:"'Exo 2',sans-serif"}}>{r.reward_amount.toLocaleString()} {label}</span>
      </div>
    );
  };

  return (
    <div style={{position:'absolute',inset:0,background:T.bg,zIndex:200,display:'flex',flexDirection:'column',animation:'fadeIn 0.25s'}}>
      <div style={{height:'52px',background:'rgba(15,10,26,0.98)',display:'flex',alignItems:'center',gap:'10px',padding:'0 16px',flexShrink:0,borderBottom:`1px solid ${T.purple1}`}}>
        <button onClick={onClose} style={{width:'32px',height:'32px',borderRadius:'10px',background:T.bgCard,border:`1px solid ${T.purple1}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7L9 11" stroke={T.grey2} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
        <span style={{fontSize:'15px',fontWeight:'700',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>ExtraPass · Сезон {season}</span>
        {hasEP && (<span style={{fontSize:'9px',background:'#FFD700',color:'#000',borderRadius:'5px',padding:'2px 7px',fontWeight:'700',fontFamily:"'Exo 2'"}}>ExtraPass</span>)}
      </div>

      <div style={{flex:1,overflowY:'auto',padding:'12px 16px 20px'}}>
        {loading ? (
          <div style={{textAlign:'center',padding:'40px',color:T.grey1}}>Загрузка...</div>
        ) : (
          <>
            {/* Progress bar card */}
            <div style={{background:'linear-gradient(135deg,#2d1460,#4a2090)',borderRadius:'16px',padding:'16px',marginBottom:'16px',position:'sticky',top:0,zIndex:2}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px'}}>
                <span style={{fontSize:'11px',color:T.grey1,textTransform:'uppercase',letterSpacing:'0.6px'}}>Прогресс сезона</span>
                <span style={{fontSize:'16px',fontWeight:'900',color:T.white,fontFamily:"'Exo 2'"}}>{stars} / {maxStars} ⭐</span>
              </div>
              <div style={{height:'8px',background:T.purple1,borderRadius:'4px',overflow:'hidden'}}>
                <div style={{width:`${progressPercent}%`,height:'100%',background:`linear-gradient(90deg,${T.orange},${T.orangeLt})`,borderRadius:'4px',boxShadow:`0 0 10px ${T.orange}55`,transition:'width 0.5s'}}/>
              </div>
              {!hasEP && (
                <div style={{marginTop:'10px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontSize:'11px',color:T.grey1}}>⚡ ExtraPass открывает премиум награды</span>
                  <span style={{fontSize:'11px',color:T.orange,fontWeight:'700'}}>Премиум 🔒</span>
                </div>
              )}
            </div>

            {/* Tier list */}
            <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
              {tiers.map((tier, i) => {
                const isEmpty = tier.empty === true;
                if (isEmpty) {
                  return (
                    <div key={i} style={{
                      background: 'rgba(26,16,48,0.35)', border: '1px solid rgba(124,92,191,0.15)',
                      borderRadius:'12px', padding:'8px 12px', opacity: 0.25,
                      display:'flex', alignItems:'center', gap:'8px'
                    }}>
                      <span style={{fontSize:'13px',fontWeight:'700',color:T.purple1,fontFamily:"'Exo 2'"}}>#{tier.position}</span>
                    </div>
                  );
                }
                const isUltra = tier.ultra.length > 0;
                const hasPremium = tier.premium.length > 0;
                const canClaim = tier.available;
                const isClaimed = tier.claimed;
                const showPremLock = hasPremium && !hasEP;

                const renderLockedBadge = (r) => {
                  const icon = r.reward_type === 'coins' ? '💰' : r.reward_type === 'gems' ? '💎' : r.reward_type === 'keys' ? '🔑' : r.reward_type === 'card' ? '🃏' : '🎁';
                  return (
                    <span style={{display:'inline-flex',alignItems:'center',gap:'2px',fontSize:'10px',color:T.grey1,opacity:0.65}}>
                      <span style={{fontSize:'10px'}}>🔒</span><span>{icon}</span><span style={{fontFamily:"'Exo 2'",fontWeight:'600'}}>{r.reward_amount.toLocaleString()}</span>
                    </span>
                  );
  };

  return (
                  <div key={i} onClick={canClaim ? (()=>handleClaim(tier.position)) : undefined} style={{
                    background: isUltra ? 'linear-gradient(135deg,#3d1a6e,#5b2daa)' : isClaimed ? `linear-gradient(135deg,${T.bgCard},#1a3a1a)` : T.bgCard,
                    border: isUltra ? '1px solid #FFD70055' : isClaimed ? '1px solid #2ecc7144' : canClaim ? `1px solid ${T.orange}55` : `1px solid ${T.purple1}`,
                    borderRadius:'12px',padding:'8px 12px',opacity: tier.locked && !canClaim ? 0.45 : 1,
                    cursor: canClaim ? 'pointer' : 'default',
                    display:'flex',alignItems:'center',gap:'8px',position:'relative',transition:'all 0.2s'
                  }}>
                    <span style={{fontSize:'14px',fontWeight:'900',color:T.white,fontFamily:"'Exo 2'",flexShrink:0,minWidth:'28px'}}>#{tier.position}</span>
                    <div style={{display:'flex',alignItems:'center',gap:'6px',flex:1,flexWrap:'wrap'}}>
                      {tier.free.map((r,j) => renderRewardBadge(r, true))}
                      {hasPremium && <div style={{width:'1px',height:'18px',background:T.purple1,borderRadius:'1px',flexShrink:0}}/>}
                      {hasPremium && tier.premium.map((r,j) => showPremLock ? renderLockedBadge(r) : renderRewardBadge(r, true))}
                      {isUltra && tier.ultra.length > 0 && <div style={{width:'1px',height:'18px',background:'#FFD70044',borderRadius:'1px',flexShrink:0}}/>}
                      {isUltra && tier.ultra.map((r,j) => showPremLock ? renderLockedBadge(r) : renderRewardBadge(r, true))}
                    </div>
                    {isUltra && <span style={{fontSize:'8px',background:'#FFD700',color:'#000',borderRadius:'4px',padding:'1px 5px',fontWeight:'700',flexShrink:0}}>ULTRA</span>}
                    {isClaimed && <span style={{fontSize:'14px',color:'#2ecc71',flexShrink:0}}>✓</span>}
                    {canClaim && (
                      <span style={{flexShrink:0,background:`linear-gradient(135deg,${T.orange},${T.orangeLt})`,border:'none',borderRadius:'8px',padding:'5px 12px',color:'white',fontSize:'12px',fontWeight:'800',fontFamily:"'Exo 2',sans-serif",boxShadow:`0 2px 8px ${T.orange}44`}}>
                        {claiming[tier.position] ? '...' : 'Забрать'}
                      </span>
                    )}
                  </div>
                );
              })}
            </div>
          </>
        )}
      </div>
    </div>
  );
};

// LEAGUE INFO SHEET
// ═══════════════════════════════════════════
const LeagueInfoSheet = ({onClose, profile}) => {
  const trophies = profile?.trophies || 0;
  const currentId = profile?.league ?? 1;
  const cur = LEAGUE_MAP[currentId] || LEAGUE_LIST[0];
  const nextLeague = currentId < 10 ? LEAGUE_MAP[currentId + 1] : null;
  const tierMin = cur.min;
  const tierMax = cur.max;
  const tierProgress = currentId < 10 ? Math.min(100, ((trophies - tierMin) / (tierMax - tierMin + 1)) * 100) : 100;

  return (
    <div style={{position:'absolute',inset:0,background:T.bg,zIndex:200,display:'flex',flexDirection:'column',animation:'fadeIn 0.25s'}}>
      {/* Header */}
      <div style={{height:'52px',background:'rgba(15,10,26,0.98)',display:'flex',alignItems:'center',gap:'10px',padding:'0 16px',flexShrink:0,borderBottom:`1px solid ${T.purple1}`}}>
        <button onClick={onClose} style={{width:'32px',height:'32px',borderRadius:'10px',background:T.bgCard,border:`1px solid ${T.purple1}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',flexShrink:0}}>
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9 3L5 7L9 11" stroke={T.grey2} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>
        </button>
        <span style={{fontSize:'15px',fontWeight:'700',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>Информация о лиге</span>
      </div>

      {/* Scrollable */}
      <div style={{flex:1,overflowY:'auto',padding:'12px 16px 20px'}}>

        {/* Current league highlight */}
        <div style={{background:`linear-gradient(135deg,${cur.color}22,${T.bgCard})`,border:`1px solid ${cur.color}44`,borderRadius:'18px',padding:'18px',marginBottom:'12px'}}>
          <div style={{display:'flex',alignItems:'center',gap:'14px',marginBottom:'14px'}}>
            <div style={{width:'56px',height:'56px',borderRadius:'16px',background:`${cur.color}22`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'30px',border:`1px solid ${cur.color}33`,flexShrink:0,boxShadow:`0 0 20px ${cur.color}22`}}>
              {cur.emoji}
            </div>
            <div>
              <div style={{fontSize:'20px',fontWeight:'900',color:T.white,fontFamily:"'Exo 2',sans-serif",lineHeight:1.1}}>{cur.name}</div>
              <div style={{fontSize:'11px',color:T.grey1,marginTop:'3px'}}>Лига {cur.id} · {trophies.toLocaleString()} 🏆</div>
            </div>
          </div>

          {/* Tier progress bar */}
          {nextLeague && (
            <div>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:'5px'}}>
                <span style={{fontSize:'10px',color:T.grey2}}>{cur.name}</span>
                <span style={{fontSize:'10px',color:T.grey2,fontWeight:'600'}}>{trophies} / {tierMax+1}</span>
                <span style={{fontSize:'10px',color:T.purpleLt}}>{nextLeague.name}</span>
              </div>
              <div style={{height:'6px',background:T.purple1,borderRadius:'3px',overflow:'hidden'}}>
                <div style={{width:`${tierProgress}%`,height:'100%',background:`linear-gradient(90deg,${cur.color},${T.orangeLt})`,borderRadius:'3px',transition:'width 0.5s'}}/>
              </div>
              <div style={{fontSize:'10px',color:T.grey2,marginTop:'4px',textAlign:'center'}}>ещё {nextLeague.min - trophies} 🏆 до {nextLeague.emoji} {nextLeague.name}</div>
            </div>
          )}
        </div>

        {/* All leagues list */}
        <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
          {LEAGUE_LIST.map(l => {
            const isCurrent = l.id === currentId;
            const isUnlocked = l.min <= trophies;
            return (
              <div key={l.id} style={{
                display:'flex',alignItems:'center',gap:'10px',
                background: isCurrent ? `${l.color}18` : (isUnlocked ? T.bgCard : 'rgba(26,16,48,0.4)'),
                border: isCurrent ? `1px solid ${l.color}55` : `1px solid ${T.purple1}`,
                borderRadius:'12px',padding:'10px 14px',
                opacity: isUnlocked ? 1 : 0.4,
                transition:'all 0.15s'
              }}>
                <div style={{width:'36px',height:'36px',borderRadius:'10px',background:isCurrent?`${l.color}22`:T.purple1,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px',flexShrink:0,border:isCurrent?`1px solid ${l.color}33`:'none'}}>
                  {l.emoji}
                </div>
                <div style={{flex:1}}>
                  <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
                    <span style={{fontSize:'13px',fontWeight:'700',color:isCurrent?T.white:T.grey1,fontFamily:"'Exo 2',sans-serif"}}>{l.name}</span>
                    {isCurrent && <span style={{fontSize:'9px',background:`${l.color}33`,color:l.color,borderRadius:'5px',padding:'1px 6px',fontWeight:'700'}}>ВЫ ЗДЕСЬ</span>}
                    {!isUnlocked && <span style={{fontSize:'12px'}}>🔒</span>}
                  </div>
                  <div style={{fontSize:'10px',color:T.grey2,marginTop:'1px'}}>{l.min.toLocaleString()} – {l.max.toLocaleString()} 🏆</div>
                </div>
                {isCurrent && (
                  <div style={{width:'8px',height:'8px',borderRadius:'50%',background:l.color,flexShrink:0,boxShadow:`0 0 8px ${l.color}66`}}/>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
