<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  background: #07040f;
  font-family: 'Inter', sans-serif;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  user-select: none;
}

#root {
  width: 100%;
  height: 100dvh;
  height: 100vh; /* fallback */

/* safe-area для iPhone */
.safe-pad-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }

@keyframes fadeUp    { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideUp   { from{transform:translateY(100%)} to{transform:translateY(0)} }
@keyframes fadeIn    { from{opacity:0} to{opacity:1} }
@keyframes glowPulse { 0%,100%{opacity:0.45;transform:translateX(-50%) scaleX(1)} 50%{opacity:0.7;transform:translateX(-50%) scaleX(1.1)} }
@keyframes shine     { 0%{left:-60%} 100%{left:140%} }
@keyframes blink     { 0%,100%{opacity:1} 50%{opacity:0} }
@keyframes rotateSlow{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes pulse     { 0%,100%{opacity:1} 50%{opacity:0.5} }
@keyframes pulse2    { 0%,100%{opacity:0.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.15)} }
@keyframes popIn     { from{opacity:0;transform:scale(0.93) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }
@keyframes spin      { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
@keyframes yellowPulse { 0%,100%{box-shadow:0 0 4px rgba(245,146,30,0.2)} 50%{box-shadow:0 0 14px rgba(245,146,30,0.6),0 0 22px rgba(245,146,30,0.3)} }
@keyframes ringPulse1 { 0%,100%{opacity:0.5;transform:translate(-50%,-50%) scale(0.8)} 50%{opacity:0.9;transform:translate(-50%,-50%) scale(1)} }
@keyframes ringPulse2 { 0%,100%{opacity:0.4;transform:translate(-50%,-50%) scale(1)} 50%{opacity:0.8;transform:translate(-50%,-50%) scale(1.3)} }
@keyframes ringPulse3 { 0%,100%{opacity:0.2;transform:translate(-50%,-50%) scale(1.3)} 50%{opacity:0.6;transform:translate(-50%,-50%) scale(1.7)} }
@keyframes ringExpand { from{opacity:0.7;transform:translate(-50%,-50%) scale(0.3)} to{opacity:0;transform:translate(-50%,-50%) scale(2.2)} }
@keyframes runeFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
@keyframes slideDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
@keyframes opponentReveal { from{opacity:0;transform:scale(0.85) translateY(16px)} to{opacity:1;transform:scale(1) translateY(0)} }
@keyframes opponentGlowPulse { 0%,100%{box-shadow:0 0 12px rgba(245,146,30,0.2),0 0 32px rgba(245,146,30,0.06)} 50%{box-shadow:0 0 20px rgba(245,146,30,0.45),0 0 50px rgba(245,146,30,0.14)} }
@keyframes tipSwap { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
@keyframes preBattleBgPulse { 0%,100%{opacity:0.35;transform:scale(1)} 50%{opacity:0.65;transform:scale(1.06)} }
@keyframes preBattleVsGlow { 0%,100%{box-shadow:0 0 14px rgba(124,92,191,0.3)} 50%{box-shadow:0 0 28px rgba(124,92,191,0.6),0 0 52px rgba(124,92,191,0.18)} }
@keyframes countBounce { 0%{opacity:0;transform:scale(0.5) translateY(14px)} 55%{transform:scale(1.1) translateY(-3px)} 100%{opacity:1;transform:scale(1) translateY(0)} }
@keyframes scaleIn { from{opacity:0;transform:scale(0.85) translateY(20px)} to{opacity:1;transform:scale(1) translateY(0)} }
@keyframes bounce { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-20px)} 60%{transform:translateY(-8px)} }
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
@keyframes titleShimmer { 0%{background-position:0% center} 100%{background-position:200% center} }
@keyframes profileFadeIn { from{opacity:0;transform:scale(0.96)} to{opacity:1;transform:scale(1)} }
@keyframes connectorPulse { 0%,100%{opacity:0.3} 50%{opacity:0.7} }

/* Critical loading CSS lives inline because this page does not load webapp/styles.css. */
#loading-screen {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  grid-template-areas: "vlogo" "hero" "gamelogo" "bottom";
  align-items: center;
  justify-items: center;
  width: 100vw;
  min-height: 100vh;
  min-height: 100dvh;
  height: 100dvh;
  padding: max(10px, env(safe-area-inset-top, 0px)) 16px max(10px, env(safe-area-inset-bottom, 0px));
  overflow: hidden;
  background: #0a0514;
  box-sizing: border-box;
  transition: opacity 0.5s ease;
  pointer-events: all;
}
#loading-screen.loading-done { opacity: 0; pointer-events: none; }
.loading-bg, .loading-stars, .loading-particles {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.loading-bg { z-index: 0; }
.loading-bg-layer {
  position: absolute;
  width: 160%;
  height: 160%;
  top: -30%;
  left: -30%;
  filter: blur(42px);
  opacity: 0.8;
  animation: loadingBgDrift 18s ease-in-out infinite;
}
.loading-bg-layer:nth-child(1) { background: radial-gradient(circle at 42% 58%, rgba(148,80,240,.28), transparent 56%); }
.loading-bg-layer:nth-child(2) { background: radial-gradient(circle at 58% 38%, rgba(100,150,255,.2), transparent 52%); animation-delay: -6s; }
.loading-bg-layer:nth-child(3) { background: radial-gradient(circle at 48% 68%, rgba(230,130,200,.16), transparent 52%); animation-delay: -12s; }
@keyframes loadingBgDrift {
  0%,100% { transform: translate3d(0,0,0) rotate(0deg); }
  50% { transform: translate3d(2%,-2%,0) rotate(3deg); }
}
.loading-stars, .loading-particles { z-index: 1; }
.loading-stars .star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px rgba(180,140,255,.85);
  animation: starTwinkle 3s ease-in-out infinite;
}
.loading-stars .star:nth-child(1){top:8%;left:12%}.loading-stars .star:nth-child(2){top:18%;left:82%;animation-delay:.5s}.loading-stars .star:nth-child(3){top:28%;left:40%;animation-delay:1s}.loading-stars .star:nth-child(4){top:38%;left:18%;animation-delay:1.5s}.loading-stars .star:nth-child(5){top:48%;left:72%;animation-delay:2s}.loading-stars .star:nth-child(6){top:58%;left:30%;animation-delay:.3s}.loading-stars .star:nth-child(7){top:68%;left:88%;animation-delay:.8s}.loading-stars .star:nth-child(8){top:78%;left:50%;animation-delay:1.2s}.loading-stars .star:nth-child(9){top:14%;left:55%;animation-delay:1.8s}.loading-stars .star:nth-child(10){top:24%;left:25%;animation-delay:2.2s}.loading-stars .star:nth-child(11){top:34%;left:78%;animation-delay:.7s}.loading-stars .star:nth-child(12){top:44%;left:48%;animation-delay:1.3s}.loading-stars .star:nth-child(13){top:54%;left:15%;animation-delay:1.9s}.loading-stars .star:nth-child(14){top:64%;left:92%;animation-delay:.4s}.loading-stars .star:nth-child(15){top:74%;left:35%;animation-delay:2.5s}
@keyframes starTwinkle { 0%,100%{opacity:.25;transform:scale(1)} 50%{opacity:1;transform:scale(1.5)} }
.loading-particles .particle {
  position: absolute;
  left: var(--x, 50%);
  bottom: -12px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(190,130,255,.9), rgba(100,150,255,.35));
  box-shadow: 0 0 12px rgba(180,120,250,.65);
  animation: particleFloat 10s ease-in-out infinite;
}
.loading-particles .particle:nth-child(1){--x:5%;animation-delay:0s}.loading-particles .particle:nth-child(2){--x:14%;animation-delay:.8s}.loading-particles .particle:nth-child(3){--x:23%;animation-delay:1.6s}.loading-particles .particle:nth-child(4){--x:32%;animation-delay:.4s}.loading-particles .particle:nth-child(5){--x:41%;animation-delay:1.2s}.loading-particles .particle:nth-child(6){--x:50%;animation-delay:2s}.loading-particles .particle:nth-child(7){--x:59%;animation-delay:.6s}.loading-particles .particle:nth-child(8){--x:68%;animation-delay:1.4s}.loading-particles .particle:nth-child(9){--x:77%;animation-delay:2.2s}.loading-particles .particle:nth-child(10){--x:86%;animation-delay:.3s}
@keyframes particleFloat { 0%{transform:translateY(0) scale(.3);opacity:0} 20%{opacity:1} 100%{transform:translateY(-100dvh) translateX(18px) scale(.7);opacity:0} }
.loading-v-logo, .loading-game-logo, .loading-hero, .loading-bottom {
  position: relative;
  z-index: 3;
}
.loading-v-logo { grid-area: vlogo; padding-top: 2px; }
.loading-v-logo img {
  display: block;
  width: clamp(28px, 9vw, 52px);
  max-width: 52px;
  max-height: 8vh;
  height: auto;
  object-fit: contain;
}
.loading-hero {
  grid-area: hero;
  display: grid;
  place-items: center;
  width: clamp(105px, 38vw, 230px);
  height: clamp(105px, 38vw, 230px);
}
.loading-hero-ring, .loading-hero-ring-outer {
  position: absolute;
  border-radius: 50%;
  box-sizing: border-box;
}
.loading-hero-ring {
  width: 78%;
  height: 78%;
  border: 2px solid rgba(160,120,240,.42);
  box-shadow: 0 0 40px rgba(140,100,240,.3), inset 0 0 34px rgba(140,100,240,.12);
  animation: heroRingPulse 3s ease-in-out infinite;
}
.loading-hero-ring-outer {
  width: 100%;
  height: 100%;
  border: 1px solid rgba(160,120,240,.18);
  box-shadow: 0 0 54px rgba(140,100,240,.13);
}
.loading-hero-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #c0a0ff;
  box-shadow: 0 0 16px #9c7de0;
  animation: heroDotOrbit 4s linear infinite;
}
@keyframes heroRingPulse { 0%,100%{transform:scale(1);opacity:.7} 50%{transform:scale(1.06);opacity:1} }
@keyframes heroDotOrbit { from{transform:rotate(0deg) translateX(48px) rotate(0deg)} to{transform:rotate(360deg) translateX(48px) rotate(-360deg)} }
.loading-game-logo { grid-area: gamelogo; display: flex; justify-content: center; width: 100%; }
.loading-game-logo img {
  display: block;
  width: min(72vw, 280px);
  max-width: 280px;
  max-height: 18vh;
  height: auto;
  object-fit: contain;
  filter: drop-shadow(0 0 18px rgba(160,120,250,.8)) drop-shadow(0 0 8px rgba(0,0,0,.8));
}
.loading-bottom {
  grid-area: bottom;
  width: min(100%, 560px);
  max-width: 100%;
  padding: 10px 10px 0;
}
.loading-status-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 12px;
  margin-bottom: 8px;
}
.loading-status-text {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: rgba(240,236,255,.88);
  font: 700 clamp(13px, 3.7vw, 16px) 'Exo 2', sans-serif;
}
.loading-percentage {
  color: #fff;
  font: 900 clamp(36px, 12vw, 68px)/.9 'Exo 2', sans-serif;
  text-shadow: 0 0 18px rgba(255,255,255,.45), 0 0 30px rgba(160,130,255,.5);
}
.loading-progress-track {
  width: 100%;
  height: clamp(8px, 2vh, 16px);
  position: relative;
  border-radius: 999px;
  background: rgba(90,55,140,.4);
  border: 1px solid rgba(160,120,240,.3);
  overflow: visible;
}
.loading-progress-fill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #f5931e, #ffb347, #fbbf24);
  box-shadow: 0 0 14px rgba(245,147,30,.65);
  transition: width .45s ease;
  position: relative;
}
.loading-progress-fill::after {
  content: "";
  position: absolute;
  right: -7px;
  top: 50%;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  transform: translateY(-50%);
  background: #fff;
  border: 2px solid #f5931e;
  box-shadow: 0 0 14px rgba(255,255,255,.8);
}
.loading-progress-shimmer { display: none; }
@media (max-height: 700px) {
  #loading-screen { padding-top: max(6px, env(safe-area-inset-top, 0px)); padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
  .loading-hero { width: clamp(80px, 30vw, 150px); height: clamp(80px, 30vw, 150px); }
  .loading-game-logo img { width: min(62vw, 220px); max-height: 15vh; }
  .loading-bottom { padding-top: 6px; }
}
@media (max-height: 560px) {
  .loading-v-logo { display: none; }
  .loading-hero { width: clamp(64px, 24vw, 110px); height: clamp(64px, 24vw, 110px); }
  .loading-game-logo img { width: min(52vw, 180px); max-height: 12vh; }
  .loading-percentage { font-size: clamp(28px, 10vw, 44px); }
}
</style>
</head>

<!-- Matchmaking overlay -->
<div id="searchOverlay" style="display:none;position:fixed;inset:0;z-index:20000;background:linear-gradient(180deg,rgba(7,4,15,0.94) 0%,rgba(15,10,26,0.92) 100%);backdrop-filter:blur(14px);align-items:center;justify-content:center;text-align:center;padding:24px;flex-direction:column;">
  <div style="position:absolute;inset:0;background-image:radial-gradient(ellipse at 50% 35%,rgba(92,63,160,0.2) 0%,transparent 70%);pointer-events:none;"></div>

  <div style="position:relative;width:180px;height:180px;margin-bottom:32px;">
    <div data-role="search-ring" style="position:absolute;top:50%;left:50%;width:140px;height:140px;border-radius:50%;border:1.5px solid rgba(156,125,224,0.35);transform:translate(-50%,-50%) scale(0.3);opacity:0;animation:ringExpand 3s ease-out infinite;animation-delay:0s"></div>
    <div data-role="search-ring" style="position:absolute;top:50%;left:50%;width:140px;height:140px;border-radius:50%;border:1.5px solid rgba(156,125,224,0.3);transform:translate(-50%,-50%) scale(0.3);opacity:0;animation:ringExpand 3s ease-out infinite;animation-delay:1s"></div>
    <div data-role="search-ring" style="position:absolute;top:50%;left:50%;width:140px;height:140px;border-radius:50%;border:1.5px solid rgba(156,125,224,0.25);transform:translate(-50%,-50%) scale(0.3);opacity:0;animation:ringExpand 3s ease-out infinite;animation-delay:2s"></div>
    <div style="position:absolute;top:50%;left:50%;width:80px;height:80px;border-radius:50%;border:1px solid rgba(124,92,191,0.4);transform:translate(-50%,-50%);animation:ringPulse1 2s ease-in-out infinite"></div>
    <div style="position:absolute;top:50%;left:50%;width:110px;height:110px;border-radius:50%;border:1px solid rgba(124,92,191,0.25);transform:translate(-50%,-50%);animation:ringPulse2 2s ease-in-out infinite"></div>
    <div style="position:absolute;top:50%;left:50%;width:146px;height:146px;border-radius:50%;border:1px solid rgba(124,92,191,0.14);transform:translate(-50%,-50%);animation:ringPulse3 2s ease-in-out infinite"></div>
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;animation:runeFloat 2.5s ease-in-out infinite;">
      <div style="width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#9c7de0,#5b3fa0);box-shadow:0 0 18px #7c5cbf,0 0 36px #5b3fa044;"></div>
    </div>

  <div style="font-size:20px;font-weight:900;color:#f0ecff;font-family:'Exo 2',sans-serif;margin-bottom:4px;letter-spacing:0.5px;">Поиск соперника</div>

  <div id="searchTipsBlock" style="background:rgba(45,31,82,0.35);border:1px solid rgba(93,63,160,0.25);border-radius:12px;padding:10px 14px;max-width:270px;margin-bottom:20px;cursor:pointer;" onclick="window._nextSearchTip?.()">
    <div style="display:flex;align-items:flex-start;gap:8px;text-align:left;">
      <span style="font-size:14px;flex-shrink:0;opacity:0.7;">💡</span>
      <span id="searchTipText" style="font-size:12px;color:#c4b8e8;line-height:1.5;"></span>
    </div>

  <div id="opponentReveal" style="display:none;margin-bottom:20px;">
    <div style="background:rgba(19,13,38,0.97);border:1px solid rgba(245,146,30,0.3);border-radius:18px;padding:14px 20px;display:flex;align-items:center;gap:14px;animation:opponentGlowPulse 2.5s ease-in-out infinite;">
      <div id="oppRevealAvatar" style="width:48px;height:48px;border-radius:50%;border:2px solid rgba(245,146,30,0.5);background:linear-gradient(135deg,rgba(245,146,30,0.2),rgba(245,146,30,0.05));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#f5921e;font-family:'Exo 2',sans-serif;overflow:hidden;background-size:cover;background-position:center;flex-shrink:0;"></div>

// ── Matchmaking (outside React) ──────────────────────
let matchmakingTimer = null;
let _mmPollInterval = null;
let _searchTimerInterval = null;
let _searchStartedAt = 0;
let _searchTipIndex = -1;

window.cancelSearch = function() {
  clearTimeout(matchmakingTimer);
  if (_mmPollInterval) { clearInterval(_mmPollInterval); _mmPollInterval = null; }
  if (_searchTimerInterval) { clearInterval(_searchTimerInterval); _searchTimerInterval = null; }
  var o = document.getElementById('searchOverlay');
  if (o) o.style.display = 'none';
  var reveal = document.getElementById('opponentReveal');
  if (reveal) reveal.style.display = 'none';
};

function _startSearchTimer() {
  _searchStartedAt = Date.now();
  var el = document.getElementById('searchTimer');
  if (_searchTimerInterval) clearInterval(_searchTimerInterval);
  _searchTimerInterval = setInterval(function() {
    var elapsed = Math.floor((Date.now() - _searchStartedAt) / 1000);
    var secs = elapsed < 99 ? elapsed : 99;
    var m = String(Math.floor(secs / 60));
    if (m.length < 2) m = '0' + m;
    var s = String(secs % 60);
    if (s.length < 2) s = '0' + s;
    if (el) el.textContent = m + ':' + s;
  }, 250);
}

function _stopSearchTimer() {
  if (_searchTimerInterval) { clearInterval(_searchTimerInterval); _searchTimerInterval = null; }
}

function _pickRandomTip() {
  var tips = window.__matchTips;
  if (!tips || tips.length === 0) return '';
  _searchTipIndex = Math.floor(Math.random() * tips.length);
  return tips[_searchTipIndex];
}

window._nextSearchTip = function() {
  var tips = window.__matchTips;
  if (!tips || tips.length === 0) return;
  _searchTipIndex = (_searchTipIndex + 1) % tips.length;
  var el = document.getElementById('searchTipText');
  if (el) { el.style.animation = 'none'; el.offsetHeight; el.style.animation = 'tipSwap 0.3s ease'; el.textContent = tips[_searchTipIndex]; }
};

function _resetSearchOverlay() {
  var overlay = document.getElementById('searchOverlay');
  if (!overlay) return;
  overlay.style.display = 'flex';
  var timerEl = document.getElementById('searchTimer');
  if (timerEl) timerEl.textContent = '00:00';
  var textEl = document.querySelector('[data-role="search-overlay-text"]');
  if (textEl) textEl.textContent = 'Подбираем соперника, подождите';
  var reveal = document.getElementById('opponentReveal');
  if (reveal) reveal.style.display = 'none';
  var rings = document.querySelectorAll('[data-role="search-ring"]');
  for (var i = 0; i < rings.length; i++) rings[i].style.display = '';
  var tipEl = document.getElementById('searchTipText');
  if (tipEl) tipEl.textContent = _pickRandomTip();
  var tipsBlock = document.getElementById('searchTipsBlock');
  if (tipsBlock) tipsBlock.style.display = '';
}

function _showOpponentReveal(data) {
  _stopSearchTimer();
  var i;
  var rings = document.querySelectorAll('[data-role="search-ring"]');
  for (i = 0; i < rings.length; i++) rings[i].style.display = 'none';
  var timerEl = document.getElementById('searchTimer');
  if (timerEl) timerEl.style.display = 'none';
  var textEl = document.querySelector('[data-role="search-overlay-text"]');
  if (textEl) textEl.style.display = 'none';
  var tipsBlock = document.getElementById('searchTipsBlock');
  if (tipsBlock) tipsBlock.style.display = 'none';

  var reveal = document.getElementById('opponentReveal');
  if (!reveal) return;
  reveal.style.display = '';
  reveal.style.animation = 'none';
  reveal.offsetHeight;
  reveal.style.animation = 'opponentReveal 0.5s cubic-bezier(0.32,0.72,0,1)';

  var name = data.opponent_name || data.opponentName || 'Соперник';
  document.getElementById('oppRevealName').textContent = name;

  var avatarUrl = data.opponent_avatar_url || data.opponentAvatar;
  var avatarEl = document.getElementById('oppRevealAvatar');
  if (avatarUrl) {
    avatarEl.style.backgroundImage = 'url(' + avatarUrl + ')';
    avatarEl.textContent = '';
  } else {
    avatarEl.style.backgroundImage = '';
    avatarEl.textContent = name.charAt(0).toUpperCase();
  }

  var clan = data.opponent_clan || data.opponentClan || '';
  var clanEl = document.getElementById('oppRevealClan');
  if (clan) {
    clanEl.style.display = 'inline-block';
    clanEl.textContent = clan;
  } else {
    clanEl.style.display = 'none';
  }

  var trophies = data.opponent_trophies;
  if (trophies === undefined) trophies = data.opponentTrophies;
  if (trophies === undefined) trophies = 0;
  document.getElementById('oppRevealTrophies').textContent = '🏆 ' + Number(trophies).toLocaleString();
}

// ── Музыка ──────────────────────────────────────────────
let _musicStarted = false;
window._musicEnabled = true;

window.startBgMusic = function() {
  if (_musicStarted || !window._musicEnabled) return;
  const audio = document.getElementById('bg-music');
  if (!audio) return;
  audio.volume = 0.35;
  audio.play().then(() => {
    _musicStarted = true;
  }).catch(() => {
    // Ждём первого взаимодействия
    const tryOnInteraction = () => {
      if (_musicStarted || !window._musicEnabled) return;
      audio.play().then(() => {
        _musicStarted = true;
        ['click','touchstart','keydown'].forEach(e => document.removeEventListener(e, tryOnInteraction));
      }).catch(() => {});
    };
    ['click','touchstart','keydown'].forEach(e => document.addEventListener(e, tryOnInteraction, {once:false}));
  });
};

window.stopBgMusic = function() {
  const audio = document.getElementById('bg-music');
  if (audio) { audio.pause(); audio.currentTime = 0; _musicStarted = false; }
};

window.toggleMusic = function(enabled) {
  window._musicEnabled = enabled;
  if (enabled) window.startBgMusic();
  else window.stopBgMusic();
};
// ────────────────────────────────────────────────────────

// ── Звук кнопок ─────────────────────────────────────────
window._playSfx = function(id) {
  if (!window._musicEnabled) return;
  const el = document.getElementById(id);
  if (!el) return;
  try { el.currentTime = 0; el.volume = 0.55; el.play().catch(() => {}); } catch (e) {}
};
window.playClick = function() {
  window._playSfx('btn-sound');
};
// Глобальный обработчик — звук на каждую кнопку
document.addEventListener('pointerdown', e => {
  if (e.target.closest('button, [role="button"]')) window.playClick();
}, {passive: true});
// ────────────────────────────────────────────────────────

// ── Loading Screen Controller ─────────────────────────
(() => {
  const DEBUG = new URLSearchParams(location.search).get('debug_loading') === '1';
  const DONE_CLASS  = 'loading-done';
  let _finished     = false;
  let _currentPct   = 0;

  const els = () => ({
    screen:   document.getElementById('loading-screen'),
    fill:     document.getElementById('loading-progress-fill'),
    pct:      document.getElementById('loading-percentage'),
    text:     document.getElementById('loading-text'),
  });

  function clamp(v) { return Math.max(0, Math.min(100, Math.round(v))); }

  window.setLoadingProgress = function(percent, label) {
    if (_finished) return;
    _currentPct = clamp(percent);
    const e = els();
    if (e.fill) e.fill.style.width = _currentPct + '%';
    if (e.pct)  e.pct.textContent  = _currentPct + '%';
    if (label && e.text) e.text.textContent = label;
  };

  window.finishLoading = function() {
    if (_finished) return;
    if (DEBUG) { console.log('[debug_loading] finishLoading called – skipping hide for debug'); return; }
    window.setLoadingProgress(100, 'Готово!');
    _finished = true;
    const e = els();
    if (!e.screen) return;
    e.screen.classList.add(DONE_CLASS);
    setTimeout(() => {
      if (e.screen && e.screen.parentNode) {
        e.screen.style.display = 'none';
      }
    }, 550);
  };

  // Fallback: force hide after 10s if still visible
  if (!DEBUG) {
    setTimeout(() => {
      if (!_finished) {
        console.warn('Loading screen force-hidden after timeout');
        window.finishLoading();
      }
    }, 10000);
  } else {
    console.log('[debug_loading] Debug mode – loading screen will not auto-hide');
  }
})();

document.addEventListener('DOMContentLoaded', () => {
  const cancelBtn = document.getElementById('cancelSearchBtn');
  if (cancelBtn) cancelBtn.onclick = window.cancelSearch;
  window.startBgMusic();
});

// display only — never used as server authority
window._getUserId = function() {
  const tg = window.Telegram?.WebApp;
  const urlId = new URLSearchParams(location.search).get('user_id');
  return tg?.initDataUnsafe?.user?.id || (urlId ? parseInt(urlId) : null);
};

// ── PvP Search ─────────────────────────────────────────
window.startBattle = async function(profile, deckId, mode) {
  _resetSearchOverlay();
  document.getElementById('battle-sound')?.play().catch(function(){});
  _startSearchTimer();

  var tg = window.Telegram?.WebApp;
  var userId = window._getUserId();
  var initData = tg?.initData || '';
  var body = { user_id: userId, _auth: initData, trophies: profile?.trophies || 0, game_mode: mode || 'classic' };
  const parsedDeck = parseInt(deckId);
  if (deckId && !isNaN(parsedDeck)) body.selected_deck_id = parsedDeck;
  console.log('[startBattle] deckId=', deckId, 'parsedDeck=', parsedDeck, 'body=', JSON.stringify(body));

  function openPreBattle(data) {
    _stopSearchTimer();
    if (_mmPollInterval) { clearInterval(_mmPollInterval); _mmPollInterval = null; }
    clearTimeout(matchmakingTimer);
    document.getElementById('searchOverlay').style.display = 'none';
    window._openPreBattle({ matchId: data.match_id, userId: userId, authData: initData,
      profile: profile, gameMode: data.game_mode || mode,
      opponentName: data.opponent_name, opponentAvatar: data.opponent_avatar_url,
      opponentTrophies: data.opponent_trophies, opponentClan: data.opponent_clan });
  }

  function handleFound(s) {
    if (s.opponent_name || s.opponentName) {
      _showOpponentReveal(s);
      setTimeout(function() { openPreBattle(s); }, 1400);
    } else {
      openPreBattle(s);
    }
  }

  try {
    var res = await fetch('/api/match/find', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('match find failed');
    var data = await res.json();

    if (data.status === 'found' && data.match_id) {
      handleFound(data);
    } else if (data.status === 'waiting' && data.match_id) {
      var matchId = data.match_id;
      if (_mmPollInterval) clearInterval(_mmPollInterval);
      _mmPollInterval = setInterval(async function() {
        if (Date.now() - _searchStartedAt > 25000) {
          _stopSearchTimer();
          clearInterval(_mmPollInterval); _mmPollInterval = null;
          document.getElementById('searchOverlay').style.display = 'none';
          return;
        }
        try {
          var r = await fetch('/api/match/status?id=' + encodeURIComponent(matchId) + '&_auth=' + encodeURIComponent(initData));
          if (!r.ok) return;
          var s = await r.json();
          if (s.status === 'found' && s.match_id) handleFound(s);
          else if (s.status === 'not_found') {
            _stopSearchTimer();
            clearInterval(_mmPollInterval); _mmPollInterval = null;
            document.getElementById('searchOverlay').style.display = 'none';
          }
        } catch(e) { console.error('poll error', e); }
      }, 2000);
    } else {
      _stopSearchTimer();
      document.getElementById('searchOverlay').style.display = 'none';
    }
  } catch(e) {
    console.error('Battle search error:', e);
    _stopSearchTimer();
    document.getElementById('searchOverlay').style.display = 'none';
  }
};

// ── VS Bot Search ───────────────────────────────────────
window.startVsBot = async function(difficulty, profile, deckId, mode) {
  _resetSearchOverlay();
  var overlayText = document.querySelector('[data-role="search-overlay-text"]');
  if (overlayText) overlayText.textContent = 'Подготавливаем бой...';
  _startSearchTimer();

  try {
    document.getElementById('battle-sound')?.play().catch(function(){});
    var tg = window.Telegram?.WebApp;
    var userId = window._getUserId();
    var initData = tg?.initData || '';
    var body = { _auth: initData, difficulty: difficulty, game_mode: mode || 'classic' };
    if (deckId != null) body.deck_id = parseInt(deckId);

    var res = await fetch('/api/match/vs-bot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('vs-bot failed');
    var data = await res.json();

    if (data.match_id) {
      _stopSearchTimer();
      document.getElementById('searchOverlay').style.display = 'none';
      if (data.opponent_name || data.opponentName) {
        _showOpponentReveal(data);
        setTimeout(function() {
          window._openPreBattle({ matchId: data.match_id, userId: userId, authData: initData,
            profile: profile, gameMode: data.game_mode || mode,
            opponentName: data.opponent_name, opponentAvatar: data.opponent_avatar_url,
            opponentTrophies: data.opponent_trophies, opponentClan: data.opponent_clan });
        }, 1400);
      } else {
        window._openPreBattle({ matchId: data.match_id, userId: userId, authData: initData,
          profile: profile, gameMode: data.game_mode || mode,
          opponentName: data.opponent_name, opponentAvatar: data.opponent_avatar_url,
          opponentTrophies: data.opponent_trophies, opponentClan: data.opponent_clan });
      }
    } else {
      throw new Error(data.error || 'no match_id');
    }
  } catch(e) {
    console.error('VS Bot error:', e);
    _stopSearchTimer();
    document.getElementById('searchOverlay').style.display = 'none';
  }
};

window._openPreBattle = function(data) { window.__preBattleData = data; window.__analytics?.battlePlayed(); window.__rootSetPreBattle?.(true); };
window._rootSetPreBattle = null;

window.saveNickname = async function(nick) {
  try {
    const tg = window.Telegram?.WebApp;
    const initData = tg?.initData || '';
    let url = '/api/change-nickname';
    if (initData) url += '?_auth=' + encodeURIComponent(initData);

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nickname: nick }),
    });
    return await res.json();
  } catch(e) {
    return { success: false, error: e.message };
  }
};

window.loadProfile = async function() {
  try {
    const tg = window.Telegram?.WebApp;
    let url = '/api/profile';
    if (tg?.initData) {
      url += '?_auth=' + encodeURIComponent(tg.initData);
    }
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.json();
  } catch(e) {
    console.warn('Profile load error:', e);
    return null;
  }
};
</script>

const formatRewardLabel = (reward) => {
  if (reward.type === "coins") return "монет";
  if (reward.type === "gems") return "гемов";
  if (reward.type === "case") {
    const n = {1:"Обычный",2:"Улучшенный",3:"Элитный",4:"Легендарный",5:"Божественный"};
    return `кейс ${reward.divine ? "Божественный" : (n[reward.tier]||"T"+reward.tier)}`;
  }
  if (reward.type === "particles") {
    const r = {rare:"Редкой",superrare:"Сверхредкой",epic:"Эпической",legendary:"Легендарной"};
    return `${reward.amount} част. ${r[reward.rarity]||reward.rarity}`;
  }
  if (reward.type === "shards") return `${reward.amount} оск.`;
  if (reward.type === "guaranteed_card") {
    const r = {rare:"Редкая",epic:"Эпическая",legendary:"Легендарная",mythic:"Мифическая"};
    return `Гар. ${r[reward.rarity]||reward.rarity}`;
  }
  if (reward.type === "cosmetic") return "Косметика";
  return reward.type;
};

const SettingsScreen = ({onClose, profile}) => {
  const s = profile?.settings || {};
  const [notifs, setNotifs] = React.useState({
    cases:     s.notif_cases           ?? true,
    daily:     s.notif_daily_rewards   ?? true,
    invites:   s.notif_game_invites    ?? true,
    friends:   s.notif_friend_requests ?? true,
    events:    s.notif_events          ?? true,
    news:      s.notif_news            ?? false,
    generator: s.notif_generator      ?? true,
  });
  const [music,  setMusic]  = React.useState(s.sound_music ?? true);
  const [sfx,    setSfx]    = React.useState(s.sound_sfx   ?? true);
  const [blockFr,setBlockFr]= React.useState(s.social_block_friend_requests ?? false);
  const nickRef  = React.useRef(null);
  const [nickStatus, setNickStatus] = React.useState(null); // null|'saving'|'ok'|'err'
  const nickChanged = profile?.nickname_changed || false;

  const saveNick = async () => {
    const val = nickRef.current?.value?.trim() || '';
    if (!val || nickStatus === 'saving') return;
    setNickStatus('saving');
    const res = await window.saveNickname(val);
    if (res?.success) {
      setNickStatus('ok');
      setTimeout(() => setNickStatus(null), 2000);
    } else {
      setNickStatus('err');
      setTimeout(() => setNickStatus(null), 2500);
    }
  };

  const saveAllSettings = React.useCallback(async (n, m, s, b) => {
    try {
      const payload = {
        notif_cases: n.cases,
        notif_daily_rewards: n.daily,
        notif_game_invites: n.invites,
        notif_friend_requests: n.friends,
        notif_events: n.events,
        notif_news: n.news,
        notif_generator: n.generator,
        sound_music: m,
        sound_sfx: s,
        social_block_friend_requests: b,
      };
      await fetch(apiUrl('/api/settings'), {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      if (window.__updateProfile && window.loadProfile) {
        window.loadProfile().then(d => { if (d && window.__updateProfile) window.__updateProfile(d); });
      }
    } catch(e) {}
  }, []);

  const stateRef = React.useRef({notifs, music, sfx, blockFr});
  stateRef.current = {notifs, music, sfx, blockFr};
  React.useEffect(() => {
    return () => {
      const st = stateRef.current;
      saveAllSettings(st.notifs, st.music, st.sfx, st.blockFr);
    };

const ADMIN_ID = 6803854304;
const isAdmin  = (profile) => profile?.user_id === ADMIN_ID;

const apiUrl = (path) => {
  const tg = window.Telegram?.WebApp;
  if (!tg?.initData) return path;
  return `${path}?_auth=${encodeURIComponent(tg.initData)}`;
};

// PROMO SECTION (в настройках)
// ═══════════════════════════════════════════
const PromoSection = ({profile}) => {
  const admin = isAdmin(profile);
  const promoRef     = React.useRef(null);
  const [promoStatus,setPromoStatus] = React.useState(null); // null|'ok'|'err'|'loading'
  const [promoMsg,   setPromoMsg]    = React.useState('');
  const [promoReward,setPromoReward] = React.useState(null);

  // Admin create form state
  const codeRef  = React.useRef(null);
  const [cType,  setCType]   = React.useState('permanent');
  const [cGems,  setCGems]   = React.useState('');
  const [cCoins, setCCoins]  = React.useState('');
  const [cKeys,  setCKeys]   = React.useState('');
  const [cStatus,setCStatus] = React.useState(null);
  const [cMsg,   setCMsg]    = React.useState('');
  const [codes,  setCodes]   = React.useState([]);
  const [codesLoaded, setCodesLoaded] = React.useState(false);

  const usePromo = async () => {
    const code = promoRef.current?.value?.trim().toUpperCase();
    if (!code) return;
    setPromoStatus('loading'); setPromoMsg(''); setPromoReward(null);
    try {
      const res = await fetch('/api/promocode/use' + apiUrl('').replace('?','&').replace(/^&/,'?'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({code}),
      });
      const d = await res.json();
      if (d.success) {
        setPromoStatus('ok');
        setPromoReward({gems: d.gems||0, coins: d.coins||0, keys: d.keys||0});
        setPromoMsg('Промокод активирован!');
        if (promoRef.current) promoRef.current.value = '';
      } else {
        const msgs = {not_found:'Промокод не найден', expired:'Промокод истёк', already_used:'Уже использован', not_eligible:'Только для новых игроков'};
        setPromoStatus('err'); setPromoMsg(msgs[d.error] || d.message || 'Ошибка');
      }
    } catch(e) { setPromoStatus('err'); setPromoMsg('Ошибка сети'); }
    setTimeout(()=>{setPromoStatus(null);setPromoMsg('');setPromoReward(null);},4000);
  };

  const createPromo = async () => {
    const code = codeRef.current?.value?.trim().toUpperCase();
    if (!code) return;
    setCStatus('loading'); setCMsg('');
    try {
      const res = await fetch(apiUrl('/api/admin/promocodes/create'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({code, type:cType, reward_gems:+cGems||0, reward_coins:+cCoins||0, reward_keys:+cKeys||0}),
      });
      const d = await res.json();
      if (d.success) { setCStatus('ok'); setCMsg('Промокод создан: '+code); if(codeRef.current) codeRef.current.value=''; loadCodes(); }
      else { setCStatus('err'); setCMsg(d.message || d.error || 'Ошибка'); }
    } catch(e) { setCStatus('err'); setCMsg('Ошибка сети'); }
    setTimeout(()=>{setCStatus(null);setCMsg('');},4000);
  };

  const loadCodes = React.useCallback(async () => {
    if (!admin) return;
    try {
      const res = await fetch(apiUrl('/api/admin/promocodes/list'));
      const d = await res.json();
      setCodes(d.promocodes || []);
      setCodesLoaded(true);
    } catch(e){}
  }, [admin]);

  React.useEffect(()=>{ if (admin) loadCodes(); }, [admin, loadCodes]);

  const T2 = T; // alias
  return (
    <div style={{marginTop:'4px'}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:'8px',margin:'14px 0 8px'}}>
        <span style={{fontSize:'17px'}}>🎟️</span>
        <span style={{fontSize:'15px',fontWeight:'700',color:T2.white,fontFamily:"'Exo 2',sans-serif"}}>Промокоды</span>
        {admin && <span style={{fontSize:'10px',color:T2.orange,background:'rgba(245,146,30,0.12)',borderRadius:'5px',padding:'1px 6px',fontWeight:'600'}}>ADMIN</span>}
      </div>

      {/* Use promo */}
      <div style={{background:T2.bgCard,borderRadius:'12px',padding:'12px 14px',border:`1px solid ${T2.purple1}`,marginBottom:'6px'}}>
        <div style={{fontSize:'11px',color:T2.grey3,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'8px'}}>Ввести промокод</div>
        <div style={{display:'flex',gap:'8px'}}>
          <input ref={promoRef} placeholder="EXTRAARENA2025" maxLength={32}
            style={{flex:1,background:T2.bgDeep,border:`1px solid ${promoStatus==='err'?'#f87171':promoStatus==='ok'?'#4ade80':T2.purple2}`,borderRadius:'9px',padding:'8px 11px',color:T2.white,fontSize:'12px',fontFamily:"'Inter',sans-serif",outline:'none',textTransform:'uppercase'}}/>
          <button onClick={usePromo} style={{height:'36px',padding:'0 14px',borderRadius:'9px',background:T2.purple2,border:`1px solid ${T2.purple3}`,color:T2.white,fontSize:'12px',fontWeight:'700',cursor:'pointer',fontFamily:"'Exo 2',sans-serif",flexShrink:0}}>
            {promoStatus==='loading'?'...':'Применить'}
          </button>
        </div>
        {promoMsg && <div style={{fontSize:'11px',color:promoStatus==='ok'?'#4ade80':'#f87171',marginTop:'6px'}}>{promoMsg}</div>}
        {promoReward && (promoReward.gems>0||promoReward.coins>0||promoReward.keys>0) && (
          <div style={{display:'flex',gap:'6px',marginTop:'6px',flexWrap:'wrap'}}>
            {promoReward.gems  >0 && <span style={{fontSize:'11px',color:'#c4b5fd',background:'rgba(167,139,250,0.12)',borderRadius:'6px',padding:'2px 8px'}}>+{promoReward.gems} 💎</span>}
            {promoReward.coins >0 && <span style={{fontSize:'11px',color:T2.orange,background:`${T2.orange}12`,borderRadius:'6px',padding:'2px 8px'}}>+{promoReward.coins} 🪙</span>}
            {promoReward.keys  >0 && <span style={{fontSize:'11px',color:'#fbbf24',background:'rgba(251,191,36,0.12)',borderRadius:'6px',padding:'2px 8px'}}>+{promoReward.keys} 🗝️</span>}
          </div>
        )}
      </div>

      {/* Admin: create promo */}
      {admin && <>
        <div style={{background:T2.bgCard,borderRadius:'12px',padding:'13px 14px',border:`1px solid ${T2.orange}30`,marginBottom:'6px'}}>
          <div style={{fontSize:'11px',color:T2.orange,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'10px',fontWeight:'700'}}>⚙️ Создать промокод</div>
          <input ref={codeRef} placeholder="КОД (латиница, caps)" maxLength={32}
            style={{width:'100%',background:T2.bgDeep,border:`1px solid ${T2.purple2}`,borderRadius:'9px',padding:'8px 11px',color:T2.white,fontSize:'12px',marginBottom:'8px',fontFamily:"'Inter',sans-serif",outline:'none',textTransform:'uppercase',boxSizing:'border-box'}}/>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'6px',marginBottom:'8px'}}>
            {[['cGems','💎 Гемы',cGems,setCGems],['cCoins','🪙 Монеты',cCoins,setCCoins],['cKeys','🗝️ Ключи',cKeys,setCKeys]].map(([id,pl,val,set])=>(
              <input key={id} value={val} onChange={e=>set(e.target.value.replace(/\D/g,''))} placeholder={pl} inputMode="numeric"
                style={{background:T2.bgDeep,border:`1px solid ${T2.purple2}`,borderRadius:'9px',padding:'7px 9px',color:T2.white,fontSize:'11px',fontFamily:"'Inter',sans-serif",outline:'none',textAlign:'center',width:'100%',boxSizing:'border-box'}}/>
            ))}
          </div>
          <div style={{display:'flex',gap:'5px',marginBottom:'10px'}}>
            {['permanent','personal','welcome'].map(t=>(
              <button key={t} onClick={()=>setCType(t)} style={{flex:1,padding:'5px 4px',borderRadius:'8px',background:cType===t?T2.purple2:T2.bgDeep,border:`1px solid ${cType===t?T2.purpleHL:T2.purple1}`,color:cType===t?T2.white:T2.grey3,fontSize:'10px',fontWeight:cType===t?'700':'400',cursor:'pointer',fontFamily:"'Exo 2',sans-serif"}}>
                {t==='permanent'?'Общий':t==='personal'?'Личный':'Новичку'}
              </button>
            ))}
          </div>
          <button onClick={createPromo} style={{width:'100%',height:'38px',background:`linear-gradient(135deg,${T2.orange},${T2.orangeD})`,border:'none',borderRadius:'10px',color:'white',fontSize:'13px',fontWeight:'800',cursor:'pointer',fontFamily:"'Exo 2',sans-serif"}}>
            Создать
          </button>
          {cMsg && <div style={{fontSize:'11px',color:cStatus==='ok'?'#4ade80':'#f87171',marginTop:'6px'}}>{cMsg}</div>}
        </div>

        {/* Admin: promo list */}
        {codesLoaded && codes.length > 0 && (
          <div style={{background:T2.bgCard,borderRadius:'12px',padding:'12px 14px',border:`1px solid ${T2.purple1}`}}>
            <div style={{fontSize:'11px',color:T2.grey3,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'8px',display:'flex',justifyContent:'space-between'}}>
              <span>Созданные коды</span>
              <button onClick={loadCodes} style={{background:'none',border:'none',color:T2.purpleLt,fontSize:'11px',cursor:'pointer'}}>Обновить</button>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:'5px',maxHeight:'160px',overflowY:'auto'}}>
              {codes.map(c=>(
                <div key={c.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 8px',background:T2.bgDeep,borderRadius:'8px',border:`1px solid ${T2.purple1}`}}>
                  <span style={{fontSize:'12px',fontWeight:'700',color:T2.white,fontFamily:"'Exo 2',sans-serif",letterSpacing:'0.5px'}}>{c.code}</span>
                  <div style={{display:'flex',gap:'4px',fontSize:'11px',color:T2.grey2}}>
                    {c.reward_gems>0 && <span>{c.reward_gems}💎</span>}
                    {c.reward_coins>0 && <span>{c.reward_coins}🪙</span>}
                    {c.reward_keys>0 && <span>{c.reward_keys}🗝️</span>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </>}
    </div>
  );
};

const ShopScreen = ({profile, onProfileUpdate}) => {
  const [sets,          setSets]          = React.useState([]);
  const [particlesData, setParticlesData] = React.useState(null);
  const [particlesTimer, setParticlesTimer] = React.useState('');
  const [loading,       setLoading]       = React.useState(true);
  const [boughtParts,   setBoughtParts]   = React.useState({});
  const [buying,        setBuying]        = React.useState(null);
  const [showPassModal, setShowPassModal] = React.useState(false);
  const [passTab,       setPassTab]       = React.useState('basic');
  const [payModal,      setPayModal]      = React.useState(null);
  const [starsStep,     setStarsStep]     = React.useState(false);
  const [showGift,      setShowGift]      = React.useState(false);
  const [giftRecipient, setGiftRecipient] = React.useState('');
  const [historyUrl,    setHistoryUrl]    = React.useState(null);

  React.useEffect(() => { window.__openExtraPassModal = () => setShowPassModal(true); return () => { delete window.__openExtraPassModal; }; }, []);

  React.useEffect(function(){
    if (!profile || !profile.user_id) return;
    fetch(_buildAuthUrl('/api/payments/history/start'), {method:'POST'})
      .then(function(r){ return r.json(); })
      .then(function(d){ setHistoryUrl(d.success && d.has_purchases ? d.history_url : null); })
      .catch(function(){});
  }, [profile]);

  var reloadProfile = function(){
    if (onProfileUpdate) {
      window.loadProfile().then(function(data){ if (data) onProfileUpdate(data); });
    }
  };

  var calcStars = function(price){ return Math.ceil((price / 1.5) * 1.2); };

  const loadData = React.useCallback(async function(){
    setLoading(true);
    try {
      const [sr, pr] = await Promise.all([
        fetch(_buildAuthUrl('/api/shop/sets')).then(function(r){ return r.json(); }),
        fetch(_buildAuthUrl('/api/shop/particles/daily')).then(function(r){ return r.json(); }),
      ]);
      setSets(sr.sets || []);
      setParticlesData(pr);
      if (pr && pr.purchased_today) {
        var nb = {};
        pr.purchased_today.forEach(function(id){ nb[id] = true; });
        setBoughtParts(nb);
      }
    } catch(e){}
    setLoading(false);
  }, [profile?.user_id]);

  React.useEffect(function(){ loadData(); }, [loadData]);

  React.useEffect(function(){
    if (!particlesData || !particlesData.next_rotation_ts) return;
    function tick(){
      var now = Math.floor(Date.now()/1000);
      var diff = Math.max(0, particlesData.next_rotation_ts - now);
      var h = Math.floor(diff/3600);
      var m = Math.floor((diff%3600)/60);
      var s = diff%60;
      setParticlesTimer(h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'));
    }
    tick();
    var i = setInterval(tick, 1000);
    return function(){ clearInterval(i); };
  }, [particlesData]);

  var buyGems = async function(itemType, itemName){
    setBuying(itemType);
    try {
      var res = await fetch(_buildAuthUrl('/api/shop/buy'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({item_type: itemType, item_name: itemName}),
      });
      var d = await res.json();
      if (d.success) {
        window.showToast(d.message || 'Куплено!', 'success', 2500);
        reloadProfile();
      } else {
        window.showToast(d.message || d.error || 'Ошибка', 'error');
      }
    } catch(e){ window.showToast('Ошибка сети', 'error'); }
    setBuying(null);
  };

  var openPaymentModal = function(itemType, itemName, amountRub, metadata, pkgType){
    setStarsStep(false);
    setPayModal({itemType:itemType, itemName:itemName, amountRub:amountRub, metadata:metadata||{}, pkgType:pkgType});
  };

  var doRublePayment = async function(method){
    if (!payModal) return;
    var pm = payModal;
    var it = pm.itemType; var nm = pm.itemName; var am = pm.amountRub;
    var mt = pm.metadata || {}; var pk = pm.pkgType;
    if (method === 'yookassa') {
      setPayModal(null); setStarsStep(false);
      setBuying(it || pk || 'yoo');
      try {
        var meta = Object.assign({item_type: it, item_name: nm}, mt);
        if (pk) meta.package_type = pk;
        if (mt.recipient_id) meta.recipient_id = mt.recipient_id;
        var body = {item_type: it || mt.item_type || '', package_type: pk || ''};
        if (mt.recipient_id) body.recipient_id = mt.recipient_id;
        if (mt.ultra !== undefined) body.ultra = mt.ultra;
        var res = await fetch(_buildAuthUrl('/api/payments/checkout/start'), {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(body)
        });
        var d = await res.json();
        if (d.success && d.checkout_url) {
          sessionStorage.setItem('pending_checkout_jti', d.checkout_jti || '');
          sessionStorage.setItem('pending_payment_item', it || pk || 'yookassa_purchase');
          sessionStorage.setItem('pending_payment_timestamp', String(Date.now()));
          sessionStorage.setItem('pending_payment_method', 'yookassa');
          var link = document.createElement('a');
          link.href = d.checkout_url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          document.body.appendChild(link);
          link.click();
          link.remove();
        } else {
          window.showToast(d.message || d.error || 'Ошибка', 'error');
        }
      } catch(e){ window.showToast('Ошибка сети', 'error'); }
      setBuying(null);
    } else {
      setStarsStep(true);
      setBuying('stars_'+Date.now());
      try {
        var sres = await fetch(_buildAuthUrl('/api/payments/stars/create'), {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({amount_rub: am, description: nm, metadata: Object.assign({item_type: it, item_name: nm}, mt)}),
        });
        var sd = await sres.json();
        if (sd.success) {
          window.showToast('Счёт Stars отправлен в чат с ботом.', 'success', 5000);
          setStarsStep('done');
        } else {
          window.showToast(sd.message || sd.error || 'Ошибка Stars', 'error');
          setStarsStep(false);
        }
      } catch(e){ window.showToast('Ошибка сети', 'error'); setStarsStep(false); }
      setBuying(null);
    }
  };

  var buyParticles = async function(cardId){
    setBuying('particles_'+cardId);
    try {
      var res = await fetch(_buildAuthUrl('/api/shop/particles/buy'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({card_id: cardId}),
      });
      var d = await res.json();
      if (d.success) {
        window.showToast(d.message || 'Частицы куплены!', 'success', 2500);
        setBoughtParts(function(bp){ var nb={}; for(var k in bp)nb[k]=bp[k]; nb[cardId]=true; return nb; });
        reloadProfile();
      } else {
        window.showToast(d.message || d.error || 'Ошибка', 'error');
      }
    } catch(e){ window.showToast('Ошибка сети', 'error'); }
    setBuying(null);
  };

  var hasExtraPass = profile?.extra_pass === 'active';
  var extraExpiry = profile?.extra_pass_expires_at;

  if (loading) {
    return (
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:'10px'}}>

                Отмена
              </button>
            </div>

          <div onClick={function(e){ e.stopPropagation(); }} style={{width:'100%',maxWidth:'380px',background:T.bgDeep,borderRadius:'22px',border:'1px solid '+T.purple1,boxShadow:'0 20px 60px rgba(0,0,0,0.7)',overflow:'hidden',animation:'popIn 0.2s',marginBottom:'10px',padding:'20px 16px',display:'flex',flexDirection:'column',gap:'14px'}}>
            <div style={{textAlign:'center'}}>
              <div style={{fontSize:'40px',marginBottom:'8px'}}>⭐</div>
              <div style={{fontSize:'16px',fontWeight:900,color:T.white,fontFamily:"'Exo 2',sans-serif"}}>Счёт отправлен в Telegram</div>
              <div style={{fontSize:'12px',color:T.grey2,marginTop:'6px',lineHeight:1.6}}>
                Откройте чат с ботом и оплатите счёт.

            <div style={{background:'#7f1d1d',border:'1px solid #ef4444',borderRadius:'12px',padding:'14px',textAlign:'center'}}>
              <div style={{fontSize:'13px',fontWeight:800,color:'#fca5a5',fontFamily:"'Exo 2',sans-serif"}}>⚠️ Важная информация</div>
              <div style={{fontSize:'11px',color:'#fecaca',marginTop:'6px',lineHeight:1.6}}>
                Если награды не поступили сразу — перезапустите бота. Это нормально для оплаты через Stars.
              </div>
            </div>
            <button onClick={function(){ setPayModal(null); setStarsStep(false); }}
              style={{width:'100%',background:'linear-gradient(135deg,'+T.purple3+','+T.purple2+')',border:'none',borderRadius:'12px',padding:'12px',color:'white',fontSize:'14px',fontWeight:800,fontFamily:"'Exo 2',sans-serif",cursor:'pointer'}}>
              Понятно

      {historyUrl && (
        <div style={{padding:'12px 16px',textAlign:'center'}}>
          <a href={historyUrl} target="_blank" rel="noopener noreferrer" style={{display:'inline-block',background:'none',border:'1px solid '+T.purple1,borderRadius:'12px',padding:'10px 24px',color:T.white,fontSize:'13px',fontWeight:700,fontFamily:"'Exo 2',sans-serif",cursor:'pointer',textDecoration:'none'}}>
            📋 История покупок
          </a>

      )}

    </div>
  );
};

// CASE OPEN SCREEN
// ═══════════════════════════════════════════
const TIER_COLORS = ['','#6ee7b7','#60a5fa','#a78bfa','#f59e0b','#f43f5e'];
const TIER_NAMES  = ['','T1','T2','T3','T4','T5'];
const RARITY_COLORS = {common:'#9ca3af',rare:'#60a5fa',superrare:'#a78bfa',epic:'#f59e0b',legendary:'#f97316',mythic:'#ec4899',divine:'#fcd34d',limited:'#f43f5e',start:T.ai};
const RARITY_LABELS = {common:'Обычная',rare:'Редкая',superrare:'Суперредкая',epic:'Эпическая',legendary:'Легендарная',mythic:'Мифическая',divine:'Божественная',limited:'Лимит.',start:'Стартовая'};

const CaseOpenScreen = ({onClose, onDone, profile}) => {
  const [phase,    setPhase]    = React.useState('intro');   // intro|tapping|opening|reveal
  const [tapN,     setTapN]     = React.useState(0);         // 0-4
  const [tierSeq,  setTierSeq]  = React.useState([1,1,1,1]); // cosmetic tiers per tap
  const [upgraded, setUpgraded] = React.useState(false);
  const [result,   setResult]   = React.useState(null);
  const [skipping, setSkipping] = React.useState(false);

  // Cosmetic tier sequence for animation (independent of server result)
  const fakeRollTier = (cur) => Math.random() < 0.28 ? Math.min(cur+1,5) : cur;

  const doTap = () => {
    if (tapN >= 4 || phase !== 'tapping') return;
    window._playSfx('case-tap-sound');
    const prevTier = tapN === 0 ? 1 : tierSeq[tapN-1];
    const newTier  = fakeRollTier(prevTier);
    const wasUpgraded = newTier > prevTier;
    const newSeq = [...tierSeq]; newSeq[tapN] = newTier;
    setTierSeq(newSeq);
    setUpgraded(wasUpgraded);
    if (wasUpgraded) setTimeout(()=>setUpgraded(false), 600);
    const nextTap = tapN + 1;
    setTapN(nextTap);
    if (nextTap >= 4) { setTimeout(()=>openCase(), 600); }
  };

  const openCase = async () => {
    window._playSfx('case-open-sound');
    setPhase('opening');
    try {
      const res = await fetch(apiUrl('/api/cases/open-from-keys'), {method:'POST', headers:{'Content-Type':'application/json'}});
      const d = await res.json();
      if (d.success) { setResult(d); setPhase('reveal'); window.__analytics?.caseOpened(); setTimeout(()=>window._playSfx('case-reward-sound'), 300); }
      else { setPhase('error'); setResult(d); }
    } catch(e) { setPhase('error'); setResult({error: 'Ошибка сети'}); }
  };

  const skip = async () => {
    if (skipping) return;
    setSkipping(true);
    const fSeq = [1,1,1,1];
    let cur=1;
    for(let i=0;i<4;i++){cur=fakeRollTier(cur);fSeq[i]=cur;}
    setTierSeq(fSeq); setTapN(4);
    await openCase();
  };

  const curTier  = tapN === 0 ? 1 : tierSeq[tapN-1];
  const tierColor = TIER_COLORS[curTier] || TIER_COLORS[1];

  return (
    <div style={{position:'absolute',inset:0,background:'rgba(5,2,12,0.97)',zIndex:50,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-start',overflow:'hidden',animation:'fadeIn 0.2s'}}>
      {/* Close/Skip */}
      <div style={{width:'100%',display:'flex',justifyContent:'space-between',padding:'14px 18px 0',flexShrink:0}}>
        <button onClick={onClose} style={{background:'none',border:`1px solid ${T.grey3}`,borderRadius:'10px',padding:'6px 12px',color:T.grey2,fontSize:'12px',cursor:'pointer',fontFamily:"'Inter',sans-serif"}}>✕ Закрыть</button>
        {phase==='tapping' && !skipping && (
          <button onClick={skip} style={{background:'none',border:`1px solid ${T.grey3}`,borderRadius:'10px',padding:'6px 12px',color:T.grey2,fontSize:'12px',cursor:'pointer',fontFamily:"'Inter',sans-serif"}}>Пропустить ⏩</button>
        )}
      </div>

      {/* INTRO */}
      {phase==='intro' && (
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px',textAlign:'center'}}>
          <div style={{fontSize:'80px',marginBottom:'20px',animation:'pulse2 2s ease-in-out infinite',filter:`drop-shadow(0 0 30px ${T.orange}66)`}}>📦</div>
          <div style={{fontSize:'22px',fontWeight:'900',color:T.white,fontFamily:"'Exo 2',sans-serif",marginBottom:'8px'}}>Открытие кейса</div>
          <div style={{fontSize:'13px',color:T.grey1,marginBottom:'32px',lineHeight:1.5}}>4 тапа — и узнаешь,<br/>что внутри</div>
          <button onClick={()=>setPhase('tapping')} style={{width:'220px',height:'56px',background:`linear-gradient(135deg,${T.orange},${T.orangeD})`,border:'none',borderRadius:'18px',color:'white',fontSize:'18px',fontWeight:'900',fontFamily:"'Exo 2',sans-serif",cursor:'pointer',boxShadow:`0 8px 28px ${T.orange}55`,letterSpacing:'1px'}}>Начать</button>
        </div>
      )}

      {/* TAPPING */}
      {phase==='tapping' && (
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'space-between',padding:'16px 24px 32px',width:'100%'}}>
          <div style={{textAlign:'center',marginTop:'8px'}}>
            <div style={{fontSize:'13px',color:T.grey2,marginBottom:'4px'}}>Тап {tapN} / 4</div>
            <div style={{display:'flex',gap:'8px',justifyContent:'center',marginBottom:'10px'}}>
              {[0,1,2,3].map(i=>(
                <div key={i} style={{width:'28px',height:'6px',borderRadius:'3px',background:i<tapN?(TIER_COLORS[tierSeq[i]]||T.purpleLt):T.purple1,transition:'background 0.3s'}}/>
              ))}
            </div>
            {tapN>0 && (
              <div style={{display:'inline-flex',alignItems:'center',gap:'6px',background:`${tierColor}20`,border:`1px solid ${tierColor}80`,borderRadius:'10px',padding:'4px 14px',animation:upgraded?'popIn 0.4s':'none'}}>
                <span style={{fontSize:'13px',fontWeight:'700',color:tierColor,fontFamily:"'Exo 2',sans-serif"}}>{TIER_NAMES[curTier]}</span>
                {upgraded && <span style={{fontSize:'11px',color:tierColor}}>↑ Апгрейд!</span>}
              </div>
            )}
          </div>

          {/* Big chest */}
          <button onClick={doTap} style={{background:'none',border:'none',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'8px',padding:'0',WebkitTapHighlightColor:'transparent'}}>
            <div style={{fontSize:'100px',lineHeight:1,filter:`drop-shadow(0 0 ${tapN>0?40:20}px ${tierColor}88)`,transition:'filter 0.3s',transform:tapN>0?'scale(1.05)':'scale(1)',animation:'pulse2 1.8s ease-in-out infinite'}}>📦</div>
            <div style={{fontSize:'13px',color:T.grey1,marginTop:'4px'}}>Нажми, чтобы открыть</div>
          </button>

          <div style={{width:'100%',textAlign:'center'}}>
            <div style={{fontSize:'24px',fontWeight:'900',color:tierColor,fontFamily:"'Exo 2',sans-serif",marginBottom:'4px',transition:'color 0.3s'}}>{TIER_NAMES[curTier] || 'T1'}</div>
            <div style={{fontSize:'11px',color:T.grey3}}>Текущий тир кейса</div>
          </div>
        </div>
      )}

      {/* OPENING */}
      {phase==='opening' && (
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'18px'}}>
          <div style={{width:'48px',height:'48px',border:`3px solid ${T.purple2}`,borderTopColor:T.purpleLt,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/>
          <div style={{fontSize:'16px',color:T.grey1,fontWeight:'600',fontFamily:"'Exo 2',sans-serif"}}>Открываем...</div>
        </div>
      )}

      {/* REVEAL */}
      {phase==='reveal' && result && (
        <div style={{flex:1,overflowY:'auto',width:'100%',padding:'16px 18px 32px'}}>
          {/* Tier badge */}
          <div style={{textAlign:'center',marginBottom:'16px'}}>
            <div style={{display:'inline-flex',alignItems:'center',gap:'8px',background:`${TIER_COLORS[result.final_tier]||T.purpleLt}20`,border:`1px solid ${TIER_COLORS[result.final_tier]||T.purpleLt}`,borderRadius:'12px',padding:'6px 18px'}}>
              <span style={{fontSize:'14px',fontWeight:'900',color:TIER_COLORS[result.final_tier]||T.purpleLt,fontFamily:"'Exo 2',sans-serif"}}>{TIER_NAMES[result.final_tier]} — открыт!</span>
            </div>
          </div>

          {/* Coins row */}
          {result.rewards?.coins > 0 && (
            <div style={{background:`${T.orange}12`,border:`1px solid ${T.orange}40`,borderRadius:'14px',padding:'12px 16px',marginBottom:'10px',display:'flex',alignItems:'center',gap:'12px',animation:'popIn 0.3s'}}>
              <span style={{fontSize:'28px'}}>🪙</span>
              <div>
                <div style={{fontSize:'18px',fontWeight:'900',color:T.orange,fontFamily:"'Exo 2',sans-serif"}}>+{result.rewards.coins} монет</div>
                <div style={{fontSize:'11px',color:T.grey2}}>Добавлено в кошелёк</div>
              </div>
            </div>
          )}

          {/* Cards */}
          {(result.rewards?.cards||[]).map((c,i)=>(
            <div key={i} style={{background:`${RARITY_COLORS[c.rarity]||T.purpleLt}12`,border:`1px solid ${RARITY_COLORS[c.rarity]||T.purpleLt}40`,borderRadius:'14px',padding:'12px 16px',marginBottom:'8px',display:'flex',alignItems:'center',gap:'12px',animation:`popIn 0.3s ${i*0.08}s both`}}>
              <div style={{width:'44px',height:'44px',borderRadius:'10px',background:`${RARITY_COLORS[c.rarity]||T.purpleLt}20`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px',flexShrink:0}}>🃏</div>
              <div>
                <div style={{fontSize:'14px',fontWeight:'700',color:T.white,fontFamily:"'Exo 2',sans-serif"}}>{c.card_name || 'Карта'}</div>
                <div style={{display:'flex',alignItems:'center',gap:'6px',marginTop:'2px'}}>
                  <span style={{fontSize:'10px',color:RARITY_COLORS[c.rarity]||T.purpleLt,background:`${RARITY_COLORS[c.rarity]||T.purpleLt}18`,borderRadius:'5px',padding:'1px 6px',fontWeight:'600'}}>{RARITY_LABELS[c.rarity]||c.rarity}</span>
                  <span style={{fontSize:'10px',color:'#4ade80'}}>✦ Новая!</span>
                </div>
              </div>
            </div>
          ))}

          {/* Particles */}
          {(result.rewards?.particles||[]).map((p,i)=>(
            <div key={i} style={{background:`${RARITY_COLORS[p.rarity]||T.purpleLt}10`,border:`1px solid ${RARITY_COLORS[p.rarity]||T.purpleLt}30`,borderRadius:'14px',padding:'10px 14px',marginBottom:'8px',display:'flex',alignItems:'center',gap:'12px',animation:`popIn 0.3s ${i*0.08}s both`}}>
              <div style={{width:'40px',height:'40px',borderRadius:'10px',background:`${RARITY_COLORS[p.rarity]||T.purpleLt}15`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px',flexShrink:0}}>✨</div>
              <div style={{flex:1}}>
                <div style={{fontSize:'12px',fontWeight:'600',color:T.grey1,fontFamily:"'Exo 2',sans-serif"}}>{p.card_name}</div>
                <div style={{fontSize:'11px',color:T.grey3}}>Уже есть → +{p.particles} частиц</div>
              </div>
            </div>
          ))}

          {result.rewards?.gems > 0 && (
            <div style={{background:'rgba(167,139,250,0.1)',border:'1px solid rgba(167,139,250,0.4)',borderRadius:'14px',padding:'12px 16px',marginBottom:'10px',display:'flex',alignItems:'center',gap:'12px',animation:'popIn 0.3s'}}>
              <span style={{fontSize:'28px'}}>💎</span>
              <div>
                <div style={{fontSize:'18px',fontWeight:'900',color:'#c4b5fd',fontFamily:"'Exo 2',sans-serif"}}>+{result.rewards.gems} гемов</div>
              </div>
            </div>
          )}

          {result.rewards?.jackpot && (
            <div style={{textAlign:'center',padding:'10px',marginBottom:'8px',color:'#fbbf24',fontSize:'14px',fontWeight:'700',animation:'pulse2 1.5s ease-in-out infinite'}}>⚡ ДЖЕКПОТ!</div>
          )}

          {/* Actions */}
          <div style={{display:'flex',gap:'10px',marginTop:'16px'}}>
            {(result.remaining_keys||0) > 0 ? (
              <button onClick={()=>{setPhase('intro');setTapN(0);setTierSeq([1,1,1,1]);setResult(null);setSkipping(false);}}
                style={{flex:1,height:'50px',background:`linear-gradient(135deg,${T.orange},${T.orangeD})`,border:'none',borderRadius:'14px',color:'white',fontSize:'15px',fontWeight:'900',fontFamily:"'Exo 2',sans-serif",cursor:'pointer',boxShadow:`0 5px 18px ${T.orange}44`}}>
                Открыть ещё ({result.remaining_keys} 🗝️)
              </button>
            ) : (
              <div style={{flex:1,textAlign:'center',padding:'12px',color:T.grey3,fontSize:'12px'}}>Ключей больше нет</div>
            )}
            <button onClick={()=>{onDone?.(result);onClose();}} style={{height:'50px',padding:'0 20px',background:T.bgCard,border:`1px solid ${T.purple2}`,borderRadius:'14px',color:T.grey1,fontSize:'14px',fontWeight:'700',fontFamily:"'Exo 2',sans-serif",cursor:'pointer'}}>Забрать</button>
          </div>
        </div>
      )}

      {phase==='error' && (
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:'12px',padding:'32px'}}>
          <div style={{fontSize:'36px'}}>⚠️</div>
          <div style={{fontSize:'14px',color:'#f87171',textAlign:'center'}}>{result?.message || result?.error || 'Ошибка открытия'}</div>
          <button onClick={onClose} style={{padding:'8px 24px',background:T.bgCard,border:`1px solid ${T.purple2}`,borderRadius:'12px',color:T.grey1,fontSize:'13px',cursor:'pointer'}}>Закрыть</button>
        </div>
      )}
    </div>
  );
};

// BATTLE PICK SHEET (спасательный круг)

const DIFFICULTIES = [
  {id:'lite',  label:'Новичок',    desc:'Лёгкий бот-случайщик',  color:'#4ade80'},
  {id:'easy',  label:'Лёгкий',     desc:'Базовая тактика',        color:'#a3e635'},
  {id:'medium',label:'Средний',    desc:'Сбалансированная игра',  color:T.orange},
  {id:'hard',  label:'Сложный',    desc:'ONNX — читает игру',     color:'#fb923c'},
  {id:'max',   label:'Максимум',   desc:'Лучшая модель, 0.1T',    color:'#f87171'},
];

const BattlePickSheet = ({onClose, profile}) => {
  const [tab, setTab]           = React.useState('friend');
  const [diff, setDiff]         = React.useState('medium');
  const [friendId, setFriendId] = React.useState('');
  const [starting, setStarting] = React.useState(false);
  const [deckId, setDeckId]     = React.useState('');
  const [presets, setPresets]   = React.useState([]);

  React.useEffect(() => {
    (async () => {
      try {
        const res = await fetch(_buildAuthUrl('/api/deck/presets'));
        if (!res.ok) return;
        const d = await res.json();
        const list = d.presets || [];
        setPresets(list);
        const primary = list.find(p => p.is_primary && (p.card_ids?.filter(Boolean)?.length||0) > 0);
        if (primary) setDeckId(String(primary.preset_number));
        else { const complete = list.find(p => (p.card_ids?.filter(Boolean)?.length||0) === 9); if (complete) setDeckId(String(complete.preset_number)); else { const first = list.find(p => (p.card_ids?.filter(Boolean)?.length||0) > 0); if (first) setDeckId(String(first.preset_number)); } }
      } catch(e){}
    })();
  }, []);

  const selectedDeck = presets.find(p => String(p.preset_number) === deckId);
  const deckCount = selectedDeck ? (selectedDeck.card_ids?.filter(Boolean)?.length || 0) : 0;

  const startBot = async () => {
    if (starting) return;
    setStarting(true);
    onClose();
    await window.startVsBot(diff, profile, deckId, 'training');
  };

  return (
    <div style={{position:'absolute',inset:0,background:'rgba(5,3,14,0.75)',backdropFilter:'blur(9px)',zIndex:20,display:'flex',flexDirection:'column',justifyContent:'flex-end'}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} className="safe-pad-bottom" style={{background:`linear-gradient(180deg,#1a1238 0%,#130d26 100%)`,borderRadius:'24px 24px 0 0',padding:'16px 18px 24px',border:`1px solid ${T.purple1}`,borderBottom:'none',boxShadow:'0 -16px 50px rgba(0,0,0,0.5)',animation:'slideUp 0.28s cubic-bezier(0.32,0.72,0,1)'}}>
        <div style={{width:'36px',height:'4px',borderRadius:'2px',background:T.purple2,margin:'0 auto 14px'}}/>

        {/* Tabs */}
        <div style={{display:'flex',background:T.bgDeep,borderRadius:'12px',padding:'3px',marginBottom:'16px',gap:'3px'}}>
          {[{id:'friend',label:'🤝 Дружеская игра'},{id:'bot',label:'🤖 Тренировка'}].map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'8px 4px',borderRadius:'10px',background:tab===t.id?T.purple2:'none',border:'none',color:tab===t.id?T.white:T.grey2,fontSize:'12px',fontWeight:tab===t.id?'700':'400',fontFamily:"'Exo 2',sans-serif",cursor:'pointer',transition:'all 0.15s'}}>{t.label}</button>
          ))}
        </div>

        {/* Deck selector — shared */}
        <div style={{marginBottom:'14px'}}>
          <div style={{fontSize:'11px',color:T.grey3,textTransform:'uppercase',letterSpacing:'0.5px',marginBottom:'8px'}}>Колода</div>
          {presets.length === 0 ? (
            <div style={{background:T.bgCard,border:`1px solid ${T.purple1}`,borderRadius:'12px',padding:'10px 14px'}}>
              <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                <div style={{width:'20px',height:'20px',borderRadius:'50%',border:`2px solid ${T.purple2}`,borderTopColor:T.purpleLt,animation:'spin 0.8s linear infinite',flexShrink:0}}/>
                <span style={{fontSize:'12px',color:T.grey2}}>Загрузка колод...</span>
              </div>
            </div>
          ) : (
            <div style={{position:'relative'}}>
              <select value={deckId} onChange={e=>setDeckId(e.target.value)}
                style={{width:'100%',appearance:'none',background:T.bgCard,border:`1px solid ${T.purple2}`,borderRadius:'12px',padding:'11px 36px 11px 14px',color:T.white,fontSize:'13px',fontWeight:'600',fontFamily:"'Exo 2',sans-serif",outline:'none',cursor:'pointer'}}>
                {presets.map(p => {
                  const filled = (p.card_ids?.filter(Boolean)?.length || 0);
                  return <option key={p.preset_number} value={String(p.preset_number)} style={{background:T.bgDeep,color:T.white}}>{p.preset_name || `Колода ${p.preset_number}`} ({filled}/9)</option>;
                })}
              </select>
              <svg style={{position:'absolute',right:'14px',top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}} width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 5l3 3 3-3" stroke={T.grey2} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </div>
          )}
        </div>

        {tab === 'friend' && <>
          {/* Friends online */}
          <div style={{background:T.bgCard,border:`1px solid ${T.purple1}`,borderRadius:'14px',padding:'12px 14px',marginBottom:'12px'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'10px'}}>

const ArenaScreen = ({onMenu, onAI, onGenerator, onOpenBattles, onBattlePick, onStartBattle, onOpenCase, onOpenGloryPath, onOpenLeagueInfo, onGoToShop, onOpenBattlePass, profile}) => {
  const [hasCases,    setHasCases]    = React.useState((profile?.keys || profile?.cases_count || 0) > 0);
  const [battleHover, setBattleHover] = React.useState(false);
  const [shineAnim,   setShineAnim]   = React.useState(false);
  const [genStatus,   setGenStatus]   = React.useState(null);
  const [genTick,     setGenTick]     = React.useState(0);

  React.useEffect(()=>{
    setHasCases((profile?.keys || profile?.cases_count || 0) > 0);
  },[profile]);

  React.useEffect(() => {
    const fetch_ = async () => {
      try {
        const r = await fetch(_buildAuthUrl('/api/generator/status'));
        if (r.ok) setGenStatus(await r.json());
      } catch(e) {}
    };
    fetch_();
    const pollIv = setInterval(fetch_, 10000);
    const tickIv = setInterval(() => setGenTick(t => t + 1), 1000);
    return () => { clearInterval(pollIv); clearInterval(tickIv); };
  }, []);

  React.useEffect(()=>{
    if(battleHover){setShineAnim(false);const t=setTimeout(()=>setShineAnim(true),20);return()=>clearTimeout(t);}
  },[battleHover]);

  const trophyCount = profile?.trophies || 0;
  const leagueId = profile?.league ?? 1;
  const leagueMap = {1:'Novice',2:'Bronze',3:'Silver',4:'Gold',5:'Crystal',6:'Master',7:'Champion',8:'Grandmaster',9:'Legendary',10:'Extra'};
  const leagueName = leagueMap[leagueId] || 'Novice';
  const leagueThresholds = LEAGUE_LIST.map(l => l.min);
  leagueThresholds.push(10000);
  const leagueMin = leagueThresholds[leagueId - 1] || 0;
  const nextLeagueTrophies = leagueId < 10 ? leagueThresholds[leagueId] : 10000;
  const nextLeagueName = leagueId < 10 ? (leagueMap[leagueId+1] || 'Max') : 'Max';

  const winsSinceLastCase = profile?.settings?.wins_since_last_case || 0;
  const ep = profile?.extra_pass || 'inactive';
  const winsForCase = ep === 'ultra' ? 3 : ep === 'active' ? 4 : 5;

  const artSize = Math.min(Math.round(window.innerWidth * 0.48), 190);

  const [gloryTiers, setGloryTiers] = React.useState([]);

  React.useEffect(() => {
    const uid = profile?.user_id || window._userId || 0;
    if (!uid) return;
    let cancelled = false;
    fetch("/api/rewards/track/glory?user_id=" + uid).then(r => r.json()).then(d => {
      if (!cancelled) setGloryTiers(d.tiers || []);

    if (sec == null) return null;
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    return h > 0
      ? `${h}ч ${String(m).padStart(2,'0')}м`
      : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  };

};

const _buildAuthUrl = (path) => {
  const tg = window.Telegram?.WebApp;
  if (!tg?.initData) return path;
  const p = new URLSearchParams();
  p.set('_auth', tg.initData);
  return `${path}?${p.toString()}`;
};

// ─── Upgrade cost helpers (mirrors database.py / main.js formulas) ───────────
const _UP_PARTICLES = {1:5,2:10,3:20,4:40,5:80,6:160,7:320,8:640,9:2500};
const _UP_COINS     = {1:50,2:150,3:400,4:900,5:2000,6:4500,7:8000,8:13000,9:40000};
const _RARITY_PM = {common:1.0,rare:1.3,start:1.4,superrare:1.6,epic:2.0,legendary:3.0,mythic:4.0,divine:5.0,limited:6.0};
const _RARITY_CM = {common:1.0,rare:1.2,start:1.3,superrare:1.5,epic:2.0,legendary:3.0,mythic:4.0,divine:5.0,limited:6.0};
const calcUpgradeParticles = (rarity, level) =>
  Math.ceil((_UP_PARTICLES[level] || 5)  * (_RARITY_PM[rarity] || 1.0));
const calcUpgradeCoins = (rarity, level) =>
  Math.ceil((_UP_COINS[level]     || 50) * (_RARITY_CM[rarity] || 1.0));
